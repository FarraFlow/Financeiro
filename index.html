/* true assim que dispara -- evita repetir o fetch a cada render() (a pagina de
   DRE Projetado e re-renderizada varias vezes por sessao: slider, toggle, etc). */
let _tentouCarregarCenarios = false;

function pgDREProjetado() {
  if (!_tentouCarregarCenarios) {
    _tentouCarregarCenarios = true;
    /* o DRE Projetado sempre abre limpo (cenario padrao, dropdown em "nao salvo"),
       nunca restaura automaticamente o ultimo cenario editado -- o usuario decide
       explicitamente qual cenario carregar pelo dropdown. Isso so busca a lista
       pro dropdown aparecer preenchido; nao mexe em cfgProjetado. */
    limparUltimoAberto();
    atualizarCenariosCache().then(() => { if (pagina === 'dre-projetado') render(); });
  }
  if (!cfgProjetado) cfgProjetado = cenarioPadrao(); // sincrono: a pagina nao espera a rede pra aparecer
  const projetado = projetarDRE(H, CALC, cfgProjetado);
  // adaptador para que agregar() funcione com a estrutura de projetado
  const adapter = {
    meses: projetado.meses.map(m => ({ comp: m.comp, m: m.m })),
    linhas: projetado.linhas,
    valores: projetado.valores
  };
  const fonte = { [String(cfgProjetado.anoAlvo)]: adapter };
  // colunas mensais: uma por mês do período
  const cols = projetado.meses.map(mi => ({
    ano: String(cfgProjetado.anoAlvo),
    comps: [mi.comp],
    nome: mi.rot,
    tipo: 'mes',
    m: mi.m,
    real: mi.real,
    ref: null,
  }));
  // tabelaDRE()/cascata()/evolucao() chamam agregar() diretamente (nao recebem fonte por parametro);
  // troca temporaria do global durante a renderizacao desta pagina, restaurado logo em seguida.
  // IMPORTANTE: aggFonte fecha sobre antigoAgregar (a funcao original), nao sobre o identificador
  // mutavel `agregar` -- se chamasse `agregar(p, fonte)` em vez de `antigoAgregar(p, fonte)`, a busca
  // dinamica do nome resolveria pra ela mesma apos a troca abaixo e causaria recursao infinita.
  const antigoAgregar = agregar;
  const aggFonte = p => {
    const src = fonte[p.ano] ? fonte : H;
    return antigoAgregar(p, src);
  };
  agregar = aggFonte;
  /* Devolucao de Vendas nao entra na projecao (estornos pontuais, sem base pra
     projetar -- ver calcularCustoComVendas). Alem de ficar zerada no calculo,
     a linha some da tabela: nao faz sentido mostrar uma categoria que o motor
     nunca vai preencher. Sempre oculta aqui, independente do que o usuario
     marcou em "Ocultar no DRE Detalhado" (esse checkbox e pras outras). */
  const ocultosProjecao = [...(cfgProjetado.ocultos || []), 'CUSTO COM VENDAS/DEVOLUÇÃO DE VENDAS'];
  let html;
  try {
    html = `<div class="grade">${painelProjetado(cfgProjetado, projetado.mesesReais)}</div>`
      + `<div class="grade">${grupoProjecoesHTML(cfgProjetado, projetado.mesesReais)}</div>`
      + `<div class="grade">${tabelaDRE(cols, ocultosProjecao)}</div>`;
  } finally {
    agregar = antigoAgregar;
  }
  return html;
}

/* periodos que viram colunas: um selecionado, ou todos do ano */
function colunas() {
  if (visao === 'ano') return [periodoDe(compAtual, 'ano')];
  const op = opcoesPeriodo(compAtual.slice(2));
  const alvo = op.filter(([c]) => selPeriodos.size === 0 || selPeriodos.has(c));
  const usar = alvo.length ? alvo : op;
  return usar.map(([c]) => periodoDe(c, visao));
}

function pgDRE() {
  const cols = colunas();
  const p = cols.length === 1 ? cols[0]
    : { ...cols[0], comps: cols.flatMap(c => c.comps), nome: cols[0].ano, tipo: cols[0].tipo,
        ref: periodoAnoAntLista(cols) };
  return kpis(p)
    + `<div class="grade">${evolucao(p)}</div>`
    + `<div class="grade c2">${cascata(p)}${saidas(p)}</div>`
    + `<div class="grade">${tabelaDRE(cols)}</div>`
    + `<div class="grade">${canais(p)}</div>`
    + painelInsights(p);
}

/* ===================== render ===================== */
const VISOES = [['mes', 'Mês'], ['trim', 'Trimestre'], ['sem', 'Semestre'], ['ano', 'Ano']];

/* opcoes do seletor de periodo, conforme a visao */
function opcoesPeriodo(ano) {
  const ms = mesesDoAno(ano);
  if (visao === 'mes') return ms.map(m => [m.comp, m.rot]);
  if (visao === 'trim') {
    const q = [...new Set(ms.map(m => Math.ceil(m.m / 3)))].sort();
    return q.map(n => [ms.filter(m => Math.ceil(m.m / 3) === n).slice(-1)[0].comp, `${n}º Trim`]);
  }
  if (visao === 'sem') {
    const q = [...new Set(ms.map(m => Math.ceil(m.m / 6)))].sort();
    return q.map(n => [ms.filter(m => Math.ceil(m.m / 6) === n).slice(-1)[0].comp, `${n}º Sem`]);
  }
  return [];
}
/* mantem o periodo valido ao trocar de visao ou de ano */
function ajustarPeriodo(ano) {
  const op = opcoesPeriodo(ano);
  if (!op.length) { const ms = mesesDoAno(ano); compAtual = ms[ms.length - 1].comp; return; }
  if (!op.some(([c]) => c === compAtual)) compAtual = op[op.length - 1][0];
}
function resumoSelecao(op) {
  if (selPeriodos.size === 0) return 'Todos';
  const marcados = op.filter(([c]) => selPeriodos.has(c));
  if (marcados.length === 0) return 'Todos';
  if (marcados.length === 1) return marcados[0][1];
  if (marcados.length === op.length) return 'Todos';
  if (marcados.length <= 3) return marcados.map(([, r]) => r).join(', ');
  return `${marcados.length} períodos`;
}

function filtros() {
  const anos = Object.keys(H).sort().reverse();
  const anoSel = compAtual.slice(2);
  const op = opcoesPeriodo(anoSel);
  return `<label for="fAno">Ano</label>
    <select id="fAno">${anos.map(a => `<option value="${a}" ${a === anoSel ? 'selected' : ''}>${a}</option>`).join('')}</select>
    <label for="fVis">Visão</label>
    <select id="fVis">${VISOES.map(([v, n]) => `<option value="${v}" ${v === visao ? 'selected' : ''}>${n}</option>`).join('')}</select>
    ${op.length ? `<label>Período</label>
    <div class="sel-multi">
      <button type="button" class="bt-sel" id="btPer" aria-expanded="${painelAberto}">
        ${esc(resumoSelecao(op))} <span class="cv">▾</span></button>
      <div class="painel ${painelAberto ? 'aberto' : ''}" id="painelPer">
        <label class="opt todos"><input type="checkbox" id="pTodos" ${selPeriodos.size === 0 ? 'checked' : ''}> Todos</label>
        <div class="sep"></div>
        ${op.map(([c, r]) => `<label class="opt"><input type="checkbox" class="pOpt" value="${c}"
          ${selPeriodos.has(c) ? 'checked' : ''}> ${esc(r)}</label>`).join('')}
      </div></div>` : ''}`;
}

let forcarTopo = false;
function render() {

  const antRol = document.getElementById('rolTab');
  if (antRol) salvoRol = { left: antRol.scrollLeft, top: antRol.scrollTop };
  document.getElementById('nav').innerHTML = `<div class="grp">Relatórios</div>` + navHTML() +
    `<div class="rod">Regime de competência.<br>Fonte: conciliação de faturamento, despesas do ERP e planilha Farra DRE.</div>`;

  const pg = PAGINAS.find(x => x.id === pagina);
  document.getElementById('tTit').textContent = pg.tit;
  const cs = pagina === 'dre-real' ? colunas() : [];
  const anoCx = pagina === 'caixa' ? anoCaixaAtual() : null;
  const opCx = anoCx ? opcoesPeriodoCaixa(anoCx) : [];
  document.getElementById('tSub').textContent = pagina === 'dre-real'
    ? (cs.length > 1 ? `${cs[0].ano} · ${cs.length} períodos` : cs[0].nome)
    : pagina === 'dre-projetado' ? 'Simulação'
    : anoCx ? (visaoCaixa === 'ano' ? `Ano ${anoCx}` : `${anoCx} · ${resumoSelecaoCaixa(opCx)}`)
    : 'Em construção';
  document.getElementById('filtros').innerHTML = pagina === 'dre-real' ? filtros() : pagina === 'caixa' ? filtrosCaixa() : '';
  document.getElementById('app').innerHTML =
    pagina === 'dre-real' ? pgDRE()
    : pagina === 'dre-projetado' ? pgDREProjetado()
    : pagina === 'caixa' ? pgCaixa()
    : pgVazia('Indicadores', 'Página reservada para os indicadores gerenciais: ciclo de caixa, giro de estoque, litragem por canal, inadimplência e metas.');

  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
    pagina = b.dataset.p; forcarTopo = true; document.getElementById('menu').classList.remove('abre'); render(); });
  const fa = document.getElementById('fAno'), fm = document.getElementById('fMes'), fv = document.getElementById('fVis');
  if (fa) fa.onchange = e => { const ms = mesesDoAno(e.target.value);
    compAtual = ms[ms.length - 1].comp; selPeriodos = new Set(); render(); };
  const bp = document.getElementById('btPer');
  if (bp) {
    bp.onclick = e => { e.stopPropagation(); painelAberto = !painelAberto; render(); };
    document.getElementById('pTodos').onchange = () => { selPeriodos = new Set(); render(); };
    document.querySelectorAll('.pOpt').forEach(cb => cb.onchange = () => {
      cb.checked ? selPeriodos.add(cb.value) : selPeriodos.delete(cb.value);
      const ult = [...selPeriodos].sort().pop();
      if (ult) compAtual = ult;
      render();
    });
    document.getElementById('painelPer').onclick = e => e.stopPropagation();
  }
  const cav = document.getElementById('cAV'), cah = document.getElementById('cAH'), cd = document.getElementById('cDelta');
  if (cav) cav.onchange = e => { mostrarAV = e.target.checked; render(); };
  if (cah) cah.onchange = e => { mostrarAH = e.target.checked; render(); };
  if (cd) cd.onchange = e => { mostrarDelta = e.target.checked; render(); };
  if (fv) fv.onchange = e => { visao = e.target.value; selPeriodos = new Set(); render(); };
  const pAno = document.getElementById('pAno'), pMesIni = document.getElementById('pMesIni'),
        pMesFim = document.getElementById('pMesFim'), pN = document.getElementById('pN');
  if (pAno) {
    pAno.onchange = e => { cfgProjetado.anoAlvo = Number(e.target.value); render(); };
    pMesIni.onchange = e => { cfgProjetado.mesIni = Number(e.target.value); if (cfgProjetado.mesIni > cfgProjetado.mesFim) cfgProjetado.mesFim = cfgProjetado.mesIni; render(); };
    pMesFim.onchange = e => { cfgProjetado.mesFim = Number(e.target.value); if (cfgProjetado.mesFim < cfgProjetado.mesIni) cfgProjetado.mesIni = cfgProjetado.mesFim; render(); };
    pN.onchange = e => { cfgProjetado.N = Number(e.target.value); render(); };
  }
  // wiring toggle recolher/expandir blocos -- usa alternarBloco para partir do estado real
  document.querySelectorAll('.bloco-toggle').forEach(btn => {
    btn.onclick = () => {
      const bloco = btn.dataset.bloco;
      if (!bloco) return;
      cfgProjetado.recolhidos = alternarBloco(cfgProjetado, bloco);
      render();
    };
  });
  // wiring do topo de bloco: input de variação + checkbox "aplicar a todas as categorias"
  document.querySelectorAll('.bloco-sliders').forEach(elBloco => {
    const inpBloco = elBloco.querySelector('.inpBloco');
    const chkAplicar = elBloco.querySelector('.chkAplicarBloco');
    if (!inpBloco || !chkAplicar) return;
    const primeiraCat = elBloco.querySelector('.slider-cat');
    const bloco = primeiraCat && primeiraCat.dataset.bloco;
    const aplicarNoBloco = () => {
      if (!chkAplicar.checked || !bloco) return;
      const valor = Number(inpBloco.value) / 100;
      categoriasComSlider().filter(c => c.bloco === bloco)
        .forEach(c => { cfgProjetado.sliders[c.cam] = { modo: 'unico', valor }; });
      render();
    };
    inpBloco.onchange = aplicarNoBloco;
    chkAplicar.onchange = aplicarNoBloco;
  });
  // wiring botão exportar CSV
  const btExport = document.getElementById('btExportarCsv');
  if (btExport && pagina === 'dre-projetado') {
    btExport.onclick = () => {
      const projetado = projetarDRE(H, CALC, cfgProjetado);
      const adapter = {
        meses: projetado.meses.map(m => ({ comp: m.comp, m: m.m })),
        linhas: projetado.linhas,
        valores: projetado.valores
      };
      const cols = projetado.meses.map(mi => ({
        ano: String(cfgProjetado.anoAlvo),
        comps: [mi.comp],
        nome: mi.rot,
        tipo: 'mes',
        m: mi.m,
        real: mi.real,
        ref: null,
      }));
      const antigoAgregar = agregar;
      const aggFonte = p => {
        const src = { [String(cfgProjetado.anoAlvo)]: adapter };
        return antigoAgregar(p, src[p.ano] ? { [p.ano]: src[p.ano] } : H);
      };
      agregar = aggFonte;
      try {
        baixarDRECsv(cols, cfgProjetado.ocultos || [], `DRE-projetado-${cfgProjetado.anoAlvo}.csv`);
      } finally {
        agregar = antigoAgregar;
      }
    };
  }
  // wiring por categoria: ocultar, modo mês a mês, input único, inputs mensais
  document.querySelectorAll('.slider-cat').forEach(el => {
    const cam = el.dataset.cam;
    const chkOcultar = el.querySelector('.chkOcultar');
    const chkMensal = el.querySelector('.chkMensal');
    const inpUnico = el.querySelector('.inpUnico');
    if (chkOcultar) chkOcultar.onchange = () => {
      const atuais = new Set(cfgProjetado.ocultos || []);
      chkOcultar.checked ? atuais.add(cam) : atuais.delete(cam);
      cfgProjetado.ocultos = [...atuais];
      render();
    };
    if (chkMensal) chkMensal.onchange = () => {
      const s = cfgProjetado.sliders[cam] || { modo: 'unico', valor: 0 };
      const qtdMeses = cfgProjetado.mesFim - cfgProjetado.mesIni + 1;
      cfgProjetado.sliders[cam] = chkMensal.checked
        ? { modo: 'mensal', valor: Array.from({ length: qtdMeses }, () => (s.modo === 'unico' ? s.valor : 0)) }
        : { modo: 'unico', valor: s.modo === 'mensal' ? (s.valor[0] || 0) : s.valor };
      render();
    };
    if (inpUnico) inpUnico.onchange = () => {
      cfgProjetado.sliders[cam] = { modo: 'unico', valor: Number(inpUnico.value) / 100 };
      render();
    };
    el.querySelectorAll('.inpMes').forEach(im => {
      im.onchange = () => {
        const i = Number(im.dataset.mes);
        const s = cfgProjetado.sliders[cam] || { modo: 'mensal', valor: [] };
        s.modo = 'mensal'; s.valor[i] = Number(im.value) / 100;
        cfgProjetado.sliders[cam] = s;
        render();
      };
    });
  });
  // wiring dos valores fixos das Financeiras (valor em R$, nao %)
  document.querySelectorAll('.inpFin').forEach(inp => {
    inp.onchange = () => {
      const chave = inp.dataset.chave;              // 'despesas' | 'receitas'
      const mes = Number(inp.dataset.mes);
      const bruto = inp.value.trim();
      cfgProjetado.financeiro = cfgProjetado.financeiro || {};
      cfgProjetado.financeiro[chave] = cfgProjetado.financeiro[chave] || {};
      // campo vazio remove a trava e volta pro calculo automatico (media historica)
      if (bruto === '') delete cfgProjetado.financeiro[chave][mes];
      else cfgProjetado.financeiro[chave][mes] = Number(bruto);
      render();
    };
  });
  // wiring dos cenários -- lista vem do cache (ja carregado por pgDREProjetado());
  // salvar/excluir precisam de rede, entao viram async e atualizam o cache ao final,
  // sucesso ou erro (erro fica visível na barra de cenários via cenariosErroAtual()).
  const pCenario = document.getElementById('pCenario');
  if (pCenario) {
    pCenario.onchange = () => {
      // selecionar o placeholder volta pro cenário padrão (nenhum cenário ativo)
      if (!pCenario.value) { limparUltimoAberto(); cfgProjetado = cenarioPadrao(); render(); return; }
      const c = cenariosCacheAtual().find(x => x.nome === pCenario.value);
      if (c) {
        cfgProjetado = { anoAlvo: c.anoAlvo, mesIni: c.mesIni, mesFim: c.mesFim, baseMode: c.baseMode, N: c.N, sliders: c.sliders, ocultos: c.ocultos || [] };
        // `recolhidos` só entra se o cenário salvou o campo; ausente = todos recolhidos (default)
        if (c.hasOwnProperty('recolhidos')) cfgProjetado.recolhidos = c.recolhidos;
        // valores fixos das Financeiras (juros) salvos junto do cenário
        if (c.financeiro) cfgProjetado.financeiro = c.financeiro;
        salvarUltimoAberto(c.nome);
        render();
      }
    };
    document.getElementById('btSalvarCenario').onclick = async () => {
      const nome = prompt('Nome do cenário:', pCenario.value || '');
      if (!nome) return;
      try {
        await salvarCenario(nome, cfgProjetado);
        salvarUltimoAberto(nome);
      } catch (err) {
        alert('Não foi possível salvar o cenário: ' + (err && err.message || err));
      }
      await atualizarCenariosCache();
      render();
    };
    document.getElementById('btExcluirCenario').onclick = async () => {
      const nome = pCenario.value || nomeCenarioAtivoCache();
      if (!nome) return;
      if (!confirm('Excluir o cenário "' + nome + '"?')) return;
      try {
        await excluirCenario(nome);
        limparUltimoAberto();
        cfgProjetado = cenarioPadrao();
      } catch (err) {
        alert('Não foi possível excluir o cenário: ' + (err && err.message || err));
      }
      await atualizarCenariosCache();
      render();
    };
  }
  const fac = document.getElementById('fAnoCaixa');
  if (fac) fac.onchange = e => { anoCaixaEscolhido = e.target.value; selPeriodosCaixa = new Set(); render(); };
  const fvc = document.getElementById('fVisCaixa');
  if (fvc) fvc.onchange = e => { visaoCaixa = e.target.value; selPeriodosCaixa = new Set(); render(); };
  const bpc = document.getElementById('btPerCaixa');
  if (bpc) {
    bpc.onclick = e => { e.stopPropagation(); painelAbertoCaixa = !painelAbertoCaixa; render(); };
    document.getElementById('pTodosCaixa').onchange = () => { selPeriodosCaixa = new Set(); render(); };
    document.querySelectorAll('.pOptCaixa').forEach(cb => cb.onchange = () => {
      cb.checked ? selPeriodosCaixa.add(cb.value) : selPeriodosCaixa.delete(cb.value);
      render();
    });
    document.getElementById('painelPerCaixa').onclick = e => e.stopPropagation();
  }
  document.querySelectorAll('#tb tr[data-b]').forEach(tr => {
    const ativar = () => { alternarLinha(abertos, tr.dataset.b); render(); };
    tr.onclick = ativar;
    tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ativar(); } };
  });

  document.querySelectorAll('#tbCaixa tr[data-bc]').forEach(tr => {
    const ativar = () => { alternarLinha(abertosCaixa, tr.dataset.bc); render(); };
    tr.onclick = ativar;
    tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ativar(); } };
  });

  const btc = document.getElementById('btNiveisCaixa');
  if (btc) btc.onclick = () => {
    if (Object.keys(abertosCaixa).some(k => abertosCaixa[k])) abertosCaixa = {};
    else {
      const anoC = anoCaixaAtual();
      let b0 = null, pai1 = null;
      (anoC && CX[anoC] ? CX[anoC].linhas : []).forEach(l => {
        if (l.nivel === 0) { b0 = l.rot; abertosCaixa[b0] = true; }
        if (l.nivel === 1) { pai1 = b0 + '/' + l.rot; abertosCaixa[pai1] = true; }
        if (l.nivel === 2) abertosCaixa[pai1 + '/' + l.rot] = true;
      });
    }
    render();
  };

  const bt = document.getElementById('btNiveis');
  if (bt) bt.onclick = () => {
    if (Object.keys(abertos).some(k => abertos[k])) abertos = {};
    else {
      const cc = colunas();
      const tot = { ...cc[0], comps: cc.flatMap(c => c.comps) };
      const agg = agregar(tot); let b0 = null;
      const n3 = nivel3De(tot.comps); let r1 = null;
      agg.linhas.forEach(l => {
        if (l.nivel === 0) { b0 = l.rot; abertos[b0] = true; }
        if (l.nivel === 1) { r1 = l.rot; abertos[b0 + '/' + l.rot] = true; }
        if (l.nivel === 2 && n3[r1] && n3[r1][l.rot]) abertos[b0 + '/' + r1 + '/' + l.rot] = true;
      });
    }
    render();
  };
  sincronizarRolagem();
  sincronizarRolagem('rolTopoCaixa', 'rolTabCaixa');
  desenharEvolucao();
  desenharEvolucaoCaixa();
  ligarCanais();
  ligarParticipacaoCaixa();
  // mantem a rolagem da pagina onde estava, mesmo que o conteudo abaixo mude de altura
  window.scrollTo(0, scrollY);
  requestAnimationFrame(() => window.scrollTo(0, scrollY));
}

/* anel de canais: passar o mouse numa fatia, na legenda ou na barra acende o mesmo canal nos tres lugares */
function ligarCanais() {
  const donut = document.getElementById('donutCanais');
  if (!donut) return;
  const grupos = [...new Set([...document.querySelectorAll('[data-g]')].map(el => el.dataset.g))];
  const marcar = alvo => {
    grupos.forEach(g => {
      const ativo = g === alvo;
      document.querySelectorAll(`.fatia[data-g="${g}"]`).forEach(el => el.classList.toggle('esmaecida', !!alvo && !ativo));
      document.querySelectorAll(`.canal-legenda .it[data-g="${g}"]`).forEach(el => el.classList.toggle('on', ativo));
      document.querySelectorAll(`.bh .li[data-g="${g}"]`).forEach(el => el.classList.toggle('on', ativo));
    });
  };
  document.querySelectorAll('[data-g]').forEach(el => {
    el.addEventListener('mouseenter', () => marcar(el.dataset.g));
    el.addEventListener('mouseleave', () => marcar(null));
  });
}

/* barra de rolagem espelhada no topo da tabela */
function sincronizarRolagem(idTopo = 'rolTopo', idTab = 'rolTab') {
  const topo = document.getElementById(idTopo), tab = document.getElementById(idTab);
  if (!topo || !tab) return;
  const larg = tab.scrollWidth;
  topo.firstElementChild.style.width = larg + 'px';
  topo.style.display = larg > tab.clientWidth + 2 ? 'block' : 'none';
  // largura util pode diferir entre as duas barras (a de baixo perde espaço para a
  // rolagem vertical); sincroniza por FRACAO, nao por pixel, pra ambas chegarem ao fim juntas
  const maxTopo = () => Math.max(topo.scrollWidth - topo.clientWidth, 1);
  const maxTab = () => Math.max(tab.scrollWidth - tab.clientWidth, 1);
  if (salvoRol) { tab.scrollLeft = salvoRol.left; tab.scrollTop = salvoRol.top;
    topo.scrollLeft = (salvoRol.left / maxTab()) * maxTopo(); }
  let travado = false;
  topo.onscroll = () => { if (travado) return; travado = true;
    tab.scrollLeft = (topo.scrollLeft / maxTopo()) * maxTab(); travado = false; };
  tab.onscroll = () => { if (travado) return; travado = true;
    topo.scrollLeft = (tab.scrollLeft / maxTab()) * maxTopo(); travado = false; };
}

if (typeof document !== 'undefined' && document.getElementById('tog')) {
  document.getElementById('tog').onclick = () => document.getElementById('menu').classList.toggle('abre');
  document.addEventListener('click', () => {
    if (painelAberto) { painelAberto = false; render(); }
    else if (painelAbertoCaixa) { painelAbertoCaixa = false; render(); }
  });
  let __rt;
  window.addEventListener('resize', () => { clearTimeout(__rt); __rt = setTimeout(() => { sincronizarRolagem(); sincronizarRolagem('rolTopoCaixa', 'rolTabCaixa'); desenharEvolucao(); desenharEvolucaoCaixa(); }, 150); });
  render();
}
