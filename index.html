<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farra DRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Tema "Aurora" — gradiente azul-verde animado + vidro fosco, cores da marca Farra Bier */
  --bg-1:#0A141C;         /* base do fundo — azul-noite profundo */
  --carta:#15242B;        /* solido opaco — usado onde precisa ser 100% opaco (tabela, sticky) */
  --vidro:rgba(21,36,43,.58);   /* vidro fosco — cartoes flutuando sobre a aurora */
  --vidro-b:rgba(255,255,255,.09); /* borda do vidro */
  --papel:rgba(255,255,255,.07); /* superficie elevada — inputs, hover */
  --linha:rgba(255,255,255,.13); /* bordas gerais */
  --tinta:#F1F6F4;        /* texto principal */
  --cinza:#A9BFC2;        /* texto secundario */
  --cinza-c:#6D8488;      /* texto terciario */

  --azul:#6FA3DA;         /* 2374/2159 CP, clareado — acento primario agora */
  --azul-fundo:#2C5C8C;   /* variante solida p/ preenchimento (linha final da DRE) */
  --azul-c:#9CC8F2;
  --bordo:#FF6E79;        /* 7622 CP, clareado forte p/ fundo escuro saturado */
  --vermelho:#FF8F97;
  --ouro:#FFC369;         /* 4021 CP, clareado */
  --ouro-c:#FFE388;       /* 2005 CP */
  --verde:#7FE07E;        /* 3561 CP, clareado — segundo acento vivo */
  --laranja:#FFA24D;      /* 2011 CP */

  --menu:216px;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-1); color:var(--tinta);
  font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  position:relative; isolation:isolate; min-height:100vh;
}
/* ================= aurora animada de fundo ================= */
body::before,body::after{
  content:''; position:fixed; inset:-25%; z-index:-1; pointer-events:none;
  filter:blur(95px) saturate(150%);
}
body::before{
  background:
    radial-gradient(36% 40% at 16% 20%, #3E7FC4 0%, transparent 70%),
    radial-gradient(44% 48% at 86% 14%, #35A45E 0%, transparent 72%),
    radial-gradient(48% 52% at 26% 88%, #1E5C8C 0%, transparent 70%);
  opacity:.65;
  animation:aurora1 36s ease-in-out infinite alternate;
}
body::after{
  background:
    radial-gradient(38% 42% at 78% 80%, #5BCB74 0%, transparent 70%),
    radial-gradient(30% 34% at 52% 46%, #2E6FA0 0%, transparent 75%);
  mix-blend-mode:screen; opacity:.5;
  animation:aurora2 29s ease-in-out infinite alternate-reverse;
}
@keyframes aurora1{
  0%{transform:translate(0,0) rotate(0deg) scale(1)}
  100%{transform:translate(5%,-4%) rotate(10deg) scale(1.08)}
}
@keyframes aurora2{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(-6%,5%) scale(1.12)}
}
@media (prefers-reduced-motion:reduce){ body::before,body::after{animation:none} }
h1,h2,h3{font-family:'Archivo',sans-serif; letter-spacing:-.01em; margin:0}

/* ================= menu lateral ================= */
.menu{
  position:fixed; left:0; top:0; bottom:0; width:216px; z-index:40;
  background:linear-gradient(165deg, rgba(34,68,98,.82) 0%, rgba(20,58,46,.88) 100%);
  backdrop-filter:blur(28px) saturate(140%); -webkit-backdrop-filter:blur(28px) saturate(140%);
  color:#fff; display:flex; flex-direction:column;
  border-right:1px solid var(--vidro-b);
}
.marca{
  display:flex; align-items:center; gap:12px; position:relative;
  padding:18px 14px; border-bottom:1px solid rgba(255,255,255,.14);
}
.marca::before{
  content:''; position:absolute; left:-30px; top:-30px; width:150px; height:150px; z-index:0;
  background:radial-gradient(circle, rgba(127,224,126,.28) 0%, rgba(111,163,218,.20) 45%, transparent 72%);
  pointer-events:none;
}
.marca img{height:56px; width:auto; display:block; flex:none; position:relative; z-index:1;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.4))}
.marca .tit{display:flex; align-items:center; gap:6px; line-height:1; align-self:center; position:relative; z-index:1}
.marca .tit b,.marca .tit i{font-family:'Fraunces',serif; font-style:normal; font-size:20px; text-transform:uppercase; font-optical-sizing:auto}
.marca .tit b{font-weight:800; letter-spacing:.02em; color:#fff}
.marca .tit i{font-weight:600; letter-spacing:.13em; color:var(--verde)}
.nav{padding:12px 10px; display:flex; flex-direction:column; gap:2px; flex:1}
.nav .grp{font-size:9.5px; text-transform:uppercase; letter-spacing:.16em; color:#8FADB2; padding:12px 10px 6px}
.nav button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:0; color:#DCEBEA; font:inherit; font-size:13px;
  padding:10px 12px; border-radius:9px; cursor:pointer; transition:background .15s,color .15s;
}
.nav button:hover{background:rgba(255,255,255,.10); color:#fff}
.nav button.on{background:linear-gradient(120deg, var(--azul) 0%, var(--verde) 130%); color:#0A141C; font-weight:700; box-shadow:0 4px 16px rgba(111,163,218,.35)}
.nav button.on .ic{color:#0A141C}
.nav button .ic{width:15px; text-align:center; font-size:12px; opacity:.9}
.nav .rod{margin-top:auto; padding:14px 12px; font-size:10.5px; color:#7E9A9E; line-height:1.45}
.menu-tog{display:none}

/* ================= área principal ================= */
.wrap{margin-left:216px; min-height:100vh; display:flex; flex-direction:column}
.topo{
  background:var(--vidro); backdrop-filter:blur(22px) saturate(150%); -webkit-backdrop-filter:blur(22px) saturate(150%);
  border-bottom:1px solid var(--linha);
  padding:13px 26px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  position:sticky; top:0; z-index:30;
}
.topo::after{
  content:''; position:absolute; left:0; right:0; top:100%; height:3px;
  background:linear-gradient(90deg, var(--azul) 0%, var(--verde) 55%, transparent 90%);
  opacity:.8;
}
.topo h2{font-family:'Fraunces',serif; font-size:20px; font-weight:600; letter-spacing:-.015em; font-optical-sizing:auto; color:var(--tinta)}
.topo .sub{font-size:11.5px; color:var(--cinza)}
.filtros{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.filtros label{font-size:9.5px; text-transform:uppercase; letter-spacing:.13em; color:var(--cinza)}
select{
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:6px 10px;
  background:var(--papel); color:var(--tinta); border:1px solid var(--linha);
  border-radius:6px; cursor:pointer;
}
select:focus-visible,button:focus-visible{outline:2px solid var(--azul); outline-offset:2px}
main{padding:22px 26px 60px; max-width:1720px; width:100%; position:relative; z-index:1}

/* ================= kpis ================= */
.kpis{display:grid; gap:10px; margin-bottom:18px; grid-template-columns:repeat(4,1fr)}
.kpis.k6{grid-template-columns:repeat(6,1fr)}
.kpi .val{font-size:clamp(15px,1.28vw,21px)}
.kpi{background:var(--vidro); backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--vidro-b); border-radius:var(--r); padding:13px 14px; position:relative; overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 14px 30px -18px rgba(0,0,0,.55)}
.kpi::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--cinza-c)}
.kpi.v::before{background:var(--verde)} .kpi.a::before{background:var(--ouro)} .kpi.r::before{background:var(--bordo)}
.kpi{display:flex; flex-direction:column}
.kpi .rot{font-size:9.5px; text-transform:uppercase; letter-spacing:.13em; color:var(--cinza);
  margin-bottom:7px; min-height:24px; display:flex; align-items:flex-start}
.kpi .val{font-family:'IBM Plex Mono',monospace; font-size:clamp(17px,1.5vw,22px); font-weight:600; letter-spacing:-.03em; white-space:nowrap; color:var(--tinta)}
.kpi .sub{font-size:11px; color:var(--cinza); margin-top:5px; line-height:1.35}
.delta{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11.5px}
.up{color:var(--verde)} .down{color:var(--bordo)}

/* ================= cartões ================= */
.grade{display:grid; gap:16px; margin-bottom:16px}
.c2{grid-template-columns:1.3fr 1fr}
.card{background:var(--vidro); backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--vidro-b); border-radius:var(--r); padding:19px 21px;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 20px 40px -22px rgba(0,0,0,.6); transition:box-shadow .18s ease, border-color .18s ease}
.card:hover{box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 24px 48px -20px rgba(0,0,0,.68); border-color:rgba(255,255,255,.16)}
.card-cab{display:flex; align-items:flex-start; gap:16px; justify-content:space-between}
.bt{font:inherit; font-size:11.5px; padding:6px 11px; border:1px solid var(--linha); background:var(--papel);
    color:var(--tinta); border-radius:6px; cursor:pointer; white-space:nowrap; transition:background .15s,border-color .15s}
.bt:hover{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.24)}
.rolagem-topo{overflow-x:auto; overflow-y:hidden; height:12px; margin-bottom:2px}
.rolagem-topo div{height:1px}
.rolagem{overflow-x:auto; overflow-y:auto; max-width:100%; max-height:640px; background:var(--carta); border-radius:8px}
.card{overflow:hidden}
.ponte-sub{font-size:11.5px; color:var(--cinza); margin-bottom:14px}
.ponte-cols{display:grid; grid-template-columns:1fr 1fr; gap:22px}
.ponte-cols h4{font-size:10px; text-transform:uppercase; letter-spacing:.13em; color:var(--cinza); margin:0 0 9px}
.ponte-cols .li{display:grid; grid-template-columns:132px 1fr 104px; align-items:center; gap:9px; margin-bottom:7px}
.ponte-cols .nm{font-size:11.5px; line-height:1.5; color:var(--tinta)}
.ponte-cols .de-para{display:block; font-size:10px; color:var(--cinza); font-family:'IBM Plex Mono',monospace}
.ponte-cols .tr{height:9px; background:var(--papel); border-radius:4px; overflow:hidden}
.ponte-cols .br{height:100%; border-radius:4px}
.ponte-cols .vl{font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-align:right}
.acoes{display:flex; gap:14px; align-items:center}
.flags{display:flex; gap:10px; align-items:center}
.sel-multi{position:relative}
.bt-sel{font:inherit; font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:6px 10px;
  background:var(--papel); border:1px solid var(--linha); border-radius:6px; cursor:pointer;
  color:var(--tinta); display:flex; align-items:center; gap:8px; min-width:112px; justify-content:space-between}
.bt-sel:hover{background:rgba(255,255,255,.14)}
.bt-sel .cv{color:var(--cinza-c); font-size:10px}
.painel{position:absolute; right:0; top:calc(100% + 5px); background:#122029; border:1px solid var(--linha);
  backdrop-filter:blur(24px); border-radius:8px; box-shadow:0 16px 38px rgba(0,0,0,.55); padding:7px; display:none; z-index:60; min-width:172px;
  max-width:min(260px, 90vw); max-height:320px; overflow-y:auto}
.painel.aberto{display:block}
.painel .opt{display:flex; align-items:center; gap:8px; padding:6px 9px; border-radius:5px;
  font-size:12.5px; cursor:pointer; white-space:nowrap; color:var(--tinta)}
.painel .opt:hover{background:var(--papel)}
.painel .opt.todos{font-weight:600}
.painel .sep{height:1px; background:var(--linha); margin:5px 2px}
.painel input{accent-color:var(--azul); cursor:pointer}
.dre th.vazia,.dre td.vazia{width:100%; border-bottom:1px solid var(--linha); padding:0}
.dre tr.tot td.vazia{background:rgba(111,163,218,.16)} .dre tr.fim td.vazia{background:var(--azul-fundo)}
.dre tr.pct td.vazia{background:rgba(255,195,105,.12)}
.fl{display:flex; align-items:center; gap:5px; font-size:11px; text-transform:uppercase; white-space:nowrap;
  letter-spacing:.1em; color:var(--cinza); cursor:pointer}
.fl input{accent-color:var(--azul); cursor:pointer}
.dre th i{display:block; font-style:normal; font-weight:400; font-size:9px; letter-spacing:.04em; color:var(--cinza-c); text-transform:none; margin-top:1px}
.dre td:first-child{white-space:nowrap}
.ponte{margin-top:20px; padding-top:16px; border-top:1px solid var(--linha)}
.ponte-cab{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:4px}
.ponte-cab h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--tinta)}
.ponte-cab span{font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600}
.pt-v{font-family:'IBM Plex Mono',monospace; font-size:11px; fill:var(--tinta)}
.pt-r{font-family:'Inter',sans-serif; font-size:10.5px; fill:var(--cinza)}
.card h2{font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--tinta)}
.card .leg{font-size:11.5px; color:var(--cinza); margin:5px 0 15px}

/* ================= cascata ================= */
.casc{display:flex; flex-direction:column; gap:3px}
.casc .l{display:grid; grid-template-columns:150px 1fr 112px 62px 68px; align-items:center; gap:10px; min-height:29px}
.casc .l.cab{min-height:22px; border-bottom:1px solid var(--linha); margin-bottom:5px}
.casc .l.cab .vl{font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--cinza); font-family:'Inter',sans-serif}
.casc .vl.av{color:var(--cinza)} .casc .vl.up{color:var(--verde)} .casc .vl.down{color:var(--bordo)}
.casc .nm{font-size:12px; text-align:right; line-height:1.25; color:var(--tinta)}
.casc .nm.forte{font-weight:600; font-family:'Archivo',sans-serif}
.casc .tr{position:relative; height:23px; background:linear-gradient(var(--linha),var(--linha)) center/100% 1px no-repeat}
.casc .br{position:absolute; height:23px; border-radius:3px; transition:width .5s cubic-bezier(.4,0,.2,1), left .5s cubic-bezier(.4,0,.2,1)}
.casc .vl{font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:right; font-variant-numeric:tabular-nums; color:var(--tinta)}
.casc .l.tot{border-top:1px solid var(--linha); border-bottom:1px solid var(--linha); padding:5px 0; margin:3px 0}

svg{display:block; width:100%; height:auto; overflow:visible}
.eixo{font-family:'IBM Plex Mono',monospace; font-size:12px; fill:var(--cinza)}
.eixo.forte{font-size:12.5px; fill:var(--tinta)}
.grafico{position:relative; min-height:120px}
.alvo{cursor:pointer}
.dica{position:absolute; top:6px; transform:translateX(-50%); opacity:0; pointer-events:none;
  background:#0B161C; color:var(--tinta); border:1px solid var(--linha); border-radius:8px; padding:9px 12px; font-size:12px;
  white-space:nowrap; transition:opacity .12s; box-shadow:0 16px 36px rgba(0,0,0,.55)}
.dica b{display:block; font-family:'Archivo',sans-serif; font-size:12.5px; margin-bottom:5px; color:var(--tinta)}
.dica span{display:flex; align-items:center; gap:7px; line-height:1.7}
.dica i{width:8px; height:8px; border-radius:2px; display:inline-block}
.dica em{font-style:normal; font-family:'IBM Plex Mono',monospace; margin-left:auto; padding-left:14px}

/* ================= barras ================= */
.tot-bar{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  padding:9px 12px; background:var(--papel); border-radius:7px; margin-bottom:5px}
.tot-bar span{font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--cinza)}
.tot-bar b{font-family:'IBM Plex Mono',monospace; font-size:16px; color:var(--tinta)}
.tot-sub{font-size:11px; color:var(--cinza); font-family:'IBM Plex Mono',monospace; margin-bottom:13px}
.bh{display:flex; flex-direction:column; gap:9px}
.bh .li{display:grid; grid-template-columns:1fr 92px; gap:10px; align-items:center}
.bh .nm{font-size:12px; display:flex; justify-content:space-between; gap:8px; margin-bottom:3px; color:var(--tinta)}
.bh .tr{height:7px; background:var(--papel); border-radius:4px; overflow:hidden}
.bh .br{height:100%; border-radius:4px; transition:width .5s ease}
.bh .pc{font-family:'IBM Plex Mono',monospace; font-size:12px; text-align:right}
.bh .pc i{display:block; font-style:normal; font-family:'Inter',sans-serif; font-size:8.5px;
  text-transform:uppercase; letter-spacing:.08em; color:var(--cinza-c); margin-top:1px}

/* ================= tabelas ================= */
table{width:100%; border-collapse:collapse; font-size:13px}
.dre{font-size:12px}
.dre th{
  text-align:right; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--tinta); font-weight:700; padding:10px 9px; border-bottom:1.5px solid var(--linha);
  background:var(--carta); vertical-align:top;
}
th{
  text-align:right; font-size:9.5px; text-transform:uppercase; letter-spacing:.1em;
  color:var(--cinza); font-weight:600; padding:8px 9px; border-bottom:1px solid var(--linha);
  background:var(--carta);
}
th:first-child{text-align:left}
td{padding:6px 9px; text-align:right; border-bottom:1px solid var(--linha); font-family:'IBM Plex Mono',monospace; white-space:nowrap; color:var(--tinta)}
.dre td, .dre th{padding-left:7px; padding-right:7px}
td:first-child{text-align:left; font-family:'Inter',sans-serif; white-space:nowrap}

.dre tr.n0 td{font-weight:600}
.dre tr.n1 td:first-child{padding-left:26px}
.dre tr.n1 td{color:var(--cinza); font-size:11.8px}
.dre tr.n2 td:first-child{padding-left:48px}
.dre tr.n2 td{color:var(--cinza); font-size:11.3px}
.dre tr.n3 td:first-child{padding-left:70px}
.dre tr.n3 td{color:var(--cinza-c); font-size:10.8px}
.dre td.tt{background:var(--papel); font-weight:600}
.dre th{position:sticky; top:0; z-index:3}
.dre td:first-child,.dre th:first-child{position:sticky; left:0; background:var(--carta)}
.dre tbody td:first-child{z-index:2}
.dre thead th:first-child{z-index:5}
.dre tr.tot td:first-child{background:#1E3A54} .dre tr.fim td:first-child{background:var(--azul-fundo)}
.dre tr.pct td:first-child{background:#3A2E17}
.dre tr.tot td{background:#1E3A54; color:var(--azul-c); font-weight:700; border-top:1px solid #2F5378; border-bottom:1px solid #2F5378}
.dre tr.fim td{background:var(--azul-fundo); color:#FBFEFD; font-weight:700; border:0}
.dre tr.pct td{background:#3A2E17; color:var(--ouro-c); font-weight:600; font-size:11.3px}
.dre tr.abre{cursor:pointer} .dre tr.abre:hover td{filter:brightness(1.22)}
.dre .seta{display:inline-block; width:13px; color:var(--cinza-c); font-size:9px}
.neg{color:var(--bordo)}
.av{color:var(--cinza-c)}
/* materialidade: variacoes pequenas ficam discretas; so o que passa do limiar acende */
.dre .up.leve,.dre .down.leve{color:var(--cinza); font-weight:400; opacity:.7}
.dre .up.mat{color:var(--verde); font-weight:700}
.dre .down.mat{color:var(--bordo); font-weight:700}

.tags{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--cinza); margin-top:14px}
.sem{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle}
.s-v{background:var(--verde)} .s-a{background:var(--ouro)} .s-r{background:var(--bordo)}

/* ================= insights ================= */
.ins{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px}
.ins-1 section ul{columns:2; column-gap:28px}
.ins-1 section li{break-inside:avoid; margin-bottom:11px}
@media (max-width:820px){ .ins-1 section ul{columns:1} }
tr.tt-canal td{border-top:1.5px solid var(--tinta); font-weight:600; background:var(--papel)}
.ins section{background:var(--vidro); backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--vidro-b); border-radius:var(--r); padding:18px 20px}
.ins h3{font-size:11px; text-transform:uppercase; letter-spacing:.12em; margin-bottom:12px}
.ins ul{margin:0; padding-left:17px}
.ins li{font-size:12.5px; margin-bottom:9px; line-height:1.5; color:var(--tinta)}
.ins li::marker{color:var(--cinza-c)}
.pill{font-size:9px; padding:2px 7px; border-radius:20px; letter-spacing:.08em; font-weight:600}
.p-v{background:rgba(127,224,126,.18); color:var(--verde)} .p-a{background:rgba(255,195,105,.18); color:var(--ouro)} .p-r{background:rgba(255,110,121,.18); color:var(--bordo)}
.vazio{color:var(--cinza); font-size:12.5px; font-style:italic}

.vazio-pg{background:var(--vidro); backdrop-filter:blur(20px); border:1px dashed var(--linha); border-radius:var(--r); padding:56px 30px; text-align:center; color:var(--cinza)}
.vazio-pg h3{font-size:15px; margin-bottom:8px; color:var(--tinta)}
.vazio-pg p{font-size:13px; margin:0 auto; max-width:470px}

@media (max-width:1024px){ .c2{grid-template-columns:1fr} .ponte-cols{grid-template-columns:1fr} }
@media (max-width:900px){
  .kpis, .kpis.k6{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:640px){
  .kpis, .kpis.k6{grid-template-columns:repeat(2,1fr)}
  .kpi{padding:11px 12px}
  .kpi .val{font-size:16px}
  .topo{padding:11px 14px}
  .topo h2{font-size:14.5px}
  .topo .sub{font-size:10.5px}
  .card{padding:15px 15px}
  .card h2{font-size:11px}
  .card .leg{font-size:10.5px; line-height:1.45; margin:4px 0 12px}
  .card-cab{gap:10px}
  .bt{font-size:10.5px; padding:5px 9px}
  .fl{font-size:10px}
}
@media (max-width:820px){
  .menu{transform:translateX(-100%); transition:transform .2s}
  .menu.abre{transform:none}
  .menu-tog{display:inline-block; background:none; border:1px solid var(--linha); border-radius:6px; padding:5px 9px; cursor:pointer; font-size:15px}
  .wrap{margin-left:0}
  main{padding:16px 14px 48px}
  .casc .l{grid-template-columns:92px 1fr 88px 48px 54px; gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function agregar(p) {
  if (!p || !p.comps.length) return null;
  const A = H[p.ano];
  const idx = p.comps.map(c => A.meses.findIndex(m => m.comp === c)).filter(i => i >= 0);
  const soma = A.valores.map(v => { let s = null;
    idx.forEach(i => { if (v[i] !== null && v[i] !== undefined) s = (s || 0) + v[i]; }); return s; });
  const pega = ch => { const k = A.linhas.findIndex(l => l.rot === ch); return k < 0 ? null : soma[k]; };
  const rl = pega(CH.rl);
  const REC = { 'MARGEM BRUTA': CH.rbr, 'MARGEM OPERACIONAL': CH.rop, 'MARGEM LÍQUIDA': CH.rex, 'MARGEM LIQUIDA': CH.rex };
  const val = A.linhas.map((l, i) => {
    if (l.tipo !== 'pct') return soma[i];
    const b = REC[l.rot.toUpperCase()];
    if (!b || !rl) return null;
    const r = pega(b); return r === null ? null : r / rl;
  });
  // indice por caminho: evita casar pelo nome quando mae e filha se chamam igual
  const porCaminho = {}; let b0 = null, n1 = null;
  A.linhas.forEach((l, i) => {
    if (l.nivel === 0) { b0 = l.rot; n1 = null; }
    if (l.nivel === 1) n1 = l.rot;
    const cam = l.nivel === 0 ? l.rot : l.nivel === 1 ? b0 + '/' + l.rot : b0 + '/' + n1 + '/' + l.rot;
    if (!(cam in porCaminho)) porCaminho[cam] = val[i];
  });
  return { linhas: A.linhas, val, porCaminho, ano: p.ano, comps: p.comps, nome: p.nome, tipo: p.tipo,
    v: ch => { const k = A.linhas.findIndex(l => l.rot === ch); return k < 0 ? null : val[k]; },
    vc: cam => (cam in porCaminho) ? porCaminho[cam] : null };
}

/* nível 3: só dos meses processados pelo pipeline */
function nivel3De(comps) {
  const out = {};
  comps.forEach(c => {
    const m = calcDe(c); if (!m) return;
    ['deducoes_det', 'custo_det', 'opex_det', 'dfin_det', 'dnop_det'].forEach(k => {
      Object.entries(m.atual[k] || {}).forEach(([n1, d1]) =>
        Object.entries(d1.filhos || {}).forEach(([n2, d2]) => {
          const f = d2.filhos || {};
          if (!Object.keys(f).length) return;
          out[n1] = out[n1] || {}; out[n1][n2] = out[n1][n2] || {};
          Object.entries(f).forEach(([n3, v]) => out[n1][n2][n3] = (out[n1][n2][n3] || 0) + v);
        }));
    });
  });
  return out;
}

/* ===================== análise vertical ===================== */
/* Receitas: mãe sobre receita bruta, filha sobre a mãe.
   Custo com vendas: bloco e filhas sobre receita com vendas; logística sobre resultado bruto.
   Demais: bloco e nível 1 sobre receita bruta. Níveis mais fundos não têm AV. */
function baseAV(l, ctx, agg, valPai1) {
  if (l.tipo === 'pct') return null;
  if (l.rot === CH.rb) return null;
  const rb = agg.v(CH.rb), rcv = agg.v(CH.rcv);
  if (ctx.b0 === CH.rb) {
    if (l.nivel === 1) return rb;
    if (l.nivel === 2) return valPai1;
    return null;
  }
  if (ctx.b0 === CH.ccv) {
    if (l.nivel === 0) return rcv;
    if (l.nivel === 1) return l.rot === 'LOGÍSTICA' ? rb : rcv;
    return null;
  }
  if (l.nivel <= 1) return rb;
  return null;
}

/* ===================== KPIs ===================== */
function kpis(p) {
  const a = agregar(p), ant = agregar(periodoAnterior(p));
  const g = (x, ch) => x ? x.v(ch) : null;
  const rl = g(a, CH.rl);
  const mg = (x, ch) => { const r = g(x, ch), l = g(x, CH.rl); return l ? r / l : null; };
  const dl = (x, y) => (y ? ((x - y) / Math.abs(y)) * 100 : null);
  const seta = d => d === null ? '<span class="av">sem base</span>'
    : `<span class="delta ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(1)}%</span> vs ${esc(ant.nome)}`;
  const sem = (at, ref, maior = true) => (ref === null || !isFinite(ref) || ref === 0) ? ''
    : ((maior ? at - ref : ref - at) >= 0 ? 'v' : (Math.abs((at - ref) / ref) <= 0.10 ? 'a' : 'r'));

  const cards = [
    { r: 'Receita bruta', v: R$(g(a, CH.rb)), s: seta(ant ? dl(g(a, CH.rb), g(ant, CH.rb)) : null), c: sem(g(a, CH.rb), g(ant, CH.rb)) },
    { r: 'Resultado bruto', v: R$(g(a, CH.rbr)), s: `Margem ${P(mg(a, CH.rbr))}`, c: sem(mg(a, CH.rbr), mg(ant, CH.rbr)) },
    { r: 'Resultado operacional', v: R$(g(a, CH.rop)), s: `Margem ${P(mg(a, CH.rop))}`, c: sem(mg(a, CH.rop), mg(ant, CH.rop)) },
    { r: 'Resultado do exercício', v: R$(g(a, CH.rex)), s: `Margem líquida ${P(mg(a, CH.rex))}`, c: g(a, CH.rex) < 0 ? 'r' : sem(mg(a, CH.rex), mg(ant, CH.rex)) }
  ];
  const cs = p.comps.map(calcDe).filter(Boolean);
  if (cs.length) {
    const lit = cs.reduce((s, x) => s + x.atual.litros, 0);
    const ped = cs.reduce((s, x) => s + x.atual.pedidos, 0);
    const rec = cs.reduce((s, x) => s + Object.values(x.atual.receita_vendas).reduce((q, w) => q + w, 0), 0);
    const cmv = cs.reduce((s, x) => s + x.atual.cmv, 0);
    cards.push({ r: 'Litros vendidos', v: N(lit) + ' L', s: `${N(ped)} pedidos · ticket ${R$(ped ? rec / ped : 0)}`, c: '' });
    cards.push({ r: 'Spread por litro', v: R$(lit ? (rec - cmv) / lit : 0), s: `Preço ${R$(lit ? rec / lit : 0)} · CMV ${R$(lit ? cmv / lit : 0)}`, c: '' });
  }
  return `<div class="kpis k${cards.length}">${cards.map(k => `<div class="kpi ${k.c}">
    <div class="rot">${k.r}</div><div class="val">${k.v}</div><div class="sub">${k.s}</div></div>`).join('')}</div>`;
}

/* ===================== cascata ===================== */
function cascata(p) {
  const a = agregar(p), ant = agregar(periodoAnterior(p));
  const g = (x, ch) => (x ? x.v(ch) : null) || 0;
  const rb = g(a, CH.rb), rcv = g(a, CH.rcv), rbr = g(a, CH.rbr);
  const rfin = a.v(CH.rfin) !== null ? a.v(CH.rfin) : (g(a, 'RECEITAS FINANCEIRAS') - g(a, 'DESPESAS FINANCEIRAS'));

  const passos = [
    { n: 'Receita bruta', v: rb, t: 'base', base: null, ch: CH.rb },
    { n: 'Deduções', v: -g(a, CH.ded), t: 'neg', base: rb, ch: CH.ded },
    { n: 'Receita líquida', v: g(a, CH.rl), t: 'sub', base: rb, ch: CH.rl },
    { n: 'CMV', v: -g(a, CH.cmv), t: 'neg', base: rcv, ch: CH.cmv },
    { n: 'Outros custos', v: -(g(a, CH.ccv) - g(a, CH.cmv)), t: 'neg', base: rcv, ch: null },
    { n: 'Resultado bruto', v: rbr, t: 'sub', base: rb, ch: CH.rbr },
    { n: 'Despesas operacionais', v: -g(a, CH.dop), t: 'neg', base: rb, ch: CH.dop },
    { n: 'Resultado operacional', v: g(a, CH.rop), t: 'sub', base: rb, ch: CH.rop },
    { n: 'Resultado financeiro', v: rfin, t: rfin >= 0 ? 'pos' : 'neg', base: rb, ch: CH.rfin },
    { n: 'Não operacional', v: g(a, 'RECEITAS NÃO OPERACIONAIS') - g(a, 'DESPESAS NÃO OPERACIONAIS'), t: 'neg', base: rb, ch: null },
    { n: 'Resultado do exercício', v: g(a, CH.rex), t: 'fim', base: rb, ch: CH.rex }
  ];
  const max = rb || 1; let cur = 0;
  const linhas = passos.map(s => {
    let ini, fim;
    if (['base', 'sub', 'fim'].includes(s.t)) { ini = 0; fim = s.v; cur = s.v; }
    else { ini = cur + Math.min(s.v, 0); fim = cur + Math.max(s.v, 0); cur += s.v; }
    const l = Math.max(0, Math.min(ini, fim)) / max * 100;
    const w = Math.max(Math.abs(fim - ini) / max * 100, 0.4);
    const cor = s.t === 'base' ? CORES.laranja : s.t === 'neg' ? CORES.bordo
      : s.t === 'fim' ? (s.v >= 0 ? CORES.verde : CORES.bordo) : CORES.azul;
    const forte = ['base', 'sub', 'fim'].includes(s.t);
    const av = s.base ? s.v / s.base : null;
    let dh = null, bom = 1;
    if (ant && s.ch) { const x = ant.v(s.ch);
      if (x) { dh = (Math.abs(s.v) - Math.abs(x)) / Math.abs(x); bom = s.t === 'neg' ? -1 : 1; } }
    return `<div class="l ${s.t === 'fim' ? 'tot' : ''}">
      <div class="nm ${forte ? 'forte' : ''}">${s.n}</div>
      <div class="tr"><div class="br" style="left:${l}%;width:${w}%;background:${cor};opacity:${s.t === 'sub' ? .82 : 1}"></div></div>
      <div class="vl" style="${s.t === 'fim' ? 'font-weight:600;color:' + (s.v >= 0 ? CORES.verde : CORES.bordo) : ''}">${M(s.t === 'neg' ? Math.abs(s.v) : s.v)}</div>
      <div class="vl av">${av === null ? '—' : P(Math.abs(av))}</div>
      <div class="vl ${dh === null ? 'av' : (dh * bom >= 0 ? 'up' : 'down')}">${dh === null ? '—' : (dh >= 0 ? '+' : '') + (dh * 100).toFixed(1) + '%'}</div>
    </div>`;
  }).join('');
  return `<div class="card"><h2>Da receita ao resultado</h2>
    <div class="leg">Cada barra parte de onde a anterior terminou. Laranja entra, bordô sai, azul é subtotal.
      AV segue a base de cada linha; Δ compara com ${esc(ant ? ant.nome : 'o período anterior')}.</div>
    <div class="casc"><div class="l cab"><div class="nm"></div><div class="tr"></div>
      <div class="vl">Valor</div><div class="vl">AV</div><div class="vl">Δ ${esc(ant ? ant.nome : '')}</div></div>${linhas}</div>${ponte(p)}</div>`;
}


/* decomposicao da variacao do resultado, em duas listas ordenadas por impacto */
function ponte(p) {
  const a = agregar(p), b = agregar(periodoAnterior(p));
  if (!b) return '';
  const g = (x, ch) => (x ? x.v(ch) : null) || 0;
  const rfin = x => x.v(CH.rfin) !== null ? x.v(CH.rfin) : (g(x, 'RECEITAS FINANCEIRAS') - g(x, 'DESPESAS FINANCEIRAS'));
  const naoOp = x => g(x, 'RECEITAS NÃO OPERACIONAIS') - g(x, 'DESPESAS NÃO OPERACIONAIS');
  const outros = x => g(x, CH.ccv) - g(x, CH.cmv);

  /* Regra geral: despesa/custo sempre em magnitude positiva (sobe = atrapalha, desce = ajuda).
     Receita sempre em magnitude positiva (sobe = ajuda, desce = atrapalha).
     Só a linha final do topo (ini -> fim) segue o sinal natural do resultado. */
  const item = (n, tipo, antes, depois) => {
    const delta = depois - antes;
    const bom = tipo === 'custo' ? delta <= 0 : delta >= 0;
    return { n, antes, depois, delta, bom, efeito: Math.abs(delta) };
  };
  /* Resultado financeiro e não operacional são receita-menos-despesa: quando o saldo é
     negativo nos dois períodos comparados, tratamos como despesa líquida (magnitude
     positiva); quando positivo nos dois, como receita líquida. Se cruzar zero, mantém
     o valor com sinal (caso raro). */
  const composto = (n, antesRaw, depoisRaw) => {
    if (antesRaw <= 0 && depoisRaw <= 0) return item(n, 'custo', -antesRaw, -depoisRaw);
    if (antesRaw >= 0 && depoisRaw >= 0) return item(n, 'receita', antesRaw, depoisRaw);
    return item(n, 'receita', antesRaw, depoisRaw);  // sinal cruzou zero: mantém natural
  };

  const ini = g(b, CH.rex), fim = g(a, CH.rex), dif = fim - ini;
  const ef = [
    item('Receita bruta', 'receita', g(b, CH.rb), g(a, CH.rb)),
    item('Deduções', 'custo', g(b, CH.ded), g(a, CH.ded)),
    item('CMV', 'custo', g(b, CH.cmv), g(a, CH.cmv)),
    item('Outros custos de venda', 'custo', outros(b), outros(a)),
    item('Despesas operacionais', 'custo', g(b, CH.dop), g(a, CH.dop)),
    composto('Resultado financeiro', rfin(b), rfin(a)),
    composto('Não operacional', naoOp(b), naoOp(a))
  ].filter(e => e.efeito > 0.005);
  const resid = dif - ef.reduce((s, e) => s + (e.bom ? e.efeito : -e.efeito), 0);
  if (Math.abs(resid) > 0.01) ef.push({ n: 'Outros', antes: null, depois: null,
    delta: resid, bom: resid >= 0, efeito: Math.abs(resid) });

  const max = Math.max(...ef.map(e => e.efeito), 1);
  const lista = (titulo, itens, cor) => !itens.length ? '' : `<div class="lado">
    <h4>${titulo}</h4>${itens.map(e => `<div class="li">
      <div class="nm">${esc(e.n)}${e.antes === null ? '' :
        `<span class="de-para">${M(e.antes)} → ${M(e.depois)}</span>`}</div>
      <div class="tr"><div class="br" style="width:${Math.max(e.efeito / max * 100, 1.5)}%;background:${cor}"></div></div>
      <div class="vl" style="color:${cor}">${e.delta >= 0 ? '+' : '−'}${R$(Math.abs(e.delta))}</div>
    </div>`).join('')}</div>`;
  const bons = ef.filter(e => e.bom).sort((x, y) => y.efeito - x.efeito);
  const maus = ef.filter(e => !e.bom).sort((x, y) => y.efeito - x.efeito);

  return `<div class="ponte">
    <div class="ponte-cab"><h3>O que explica a variação do resultado</h3>
      <span class="${dif >= 0 ? 'up' : 'down'}">${dif >= 0 ? '+' : '−'}${R$(Math.abs(dif))} contra ${esc(b.nome)}</span></div>
    <div class="ponte-sub">${R$(ini)} em ${esc(b.nome)} → ${R$(fim)} em ${esc(a.nome)}.
      Despesa que sobe atrapalha, que desce ajuda; receita segue o inverso — o valor de
      cada item já vem nesse sentido.</div>
    <div class="ponte-cols">${lista('Ajudou', bons, CORES.verde)}${lista('Atrapalhou', maus, CORES.bordo)}</div></div>`;
}

/* ===================== evolução ===================== */
function evolucao(p) {
  const fim = posDe(p.comps[p.comps.length - 1]);
  const S = TODOS.slice(Math.max(0, fim - 11), fim + 1).map(t => {
    const a = agregar(periodoDe(t.comp, 'mes'));
    return { rot: t.rot, rb: a.v(CH.rb) || 0, rex: a.v(CH.rex) || 0, dentro: p.comps.includes(t.comp) };
  });
  if (S.length < 2) return `<div class="card"><h2>Evolução</h2><div class="leg">Sem base suficiente.</div></div>`;
  window.__EVO = S;
  return `<div class="card"><h2>Evolução — últimos ${S.length} meses</h2>
    <div class="leg">Barra: receita bruta. Linha: resultado do exercício. Em destaque, os meses do período selecionado.
      Passe o mouse para ver os valores.</div>
    <div class="grafico" id="wrapEvo"><div class="dica" id="dicaEvo"></div></div></div>`;
}

/* desenha o SVG com o viewBox casando 1:1 com a largura real em tela, para o texto
   nao encolher junto com a geometria em telas estreitas */
function desenharEvolucao() {
  const wrap = document.getElementById('wrapEvo');
  if (!wrap || !window.__EVO) return;
  const S = window.__EVO;
  const W = Math.max(280, Math.round(wrap.clientWidth));
  const estreito = W < 520;
  const Ht = estreito ? 210 : 270;
  const ml = estreito ? 50 : 74, mr = 10, mt = 16, mb = estreito ? 28 : 34;
  const iw = W - ml - mr, ih = Ht - mt - mb;
  const vals = S.flatMap(m => [m.rb, m.rex, 0]);
  const hi = Math.max(...vals), lo = Math.min(...vals);
  const y = v => mt + ih - ((v - lo) / ((hi - lo) || 1)) * ih;
  const bw = iw / S.length;
  const fEixo = estreito ? 9.5 : 12, fForte = estreito ? 9.5 : 12.5;
  const gy = [...new Set([hi, (hi + lo) / 2, 0, lo])].map(v =>
    `<line x1="${ml}" y1="${y(v)}" x2="${W - mr}" y2="${y(v)}" stroke="${v === 0 ? '#3E5B62' : '#1C2E33'}"/>
     <text class="eixo" style="font-size:${fEixo}px" x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${Mk(v)}</text>`).join('');
  const barras = S.map((m, i) => { const x = ml + i * bw + bw * .2, w = bw * .6, y0 = y(0), y1 = y(m.rb);
    return `<rect x="${x}" y="${Math.min(y0, y1)}" width="${w}" height="${Math.abs(y0 - y1)}"
      fill="${CORES.laranja}" opacity="${m.dentro ? 1 : .68}" rx="2"/>`; }).join('');
  const pts = S.map((m, i) => [ml + i * bw + bw / 2, y(m.rex)]);
  const linha = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const pontos = pts.map((q, i) => `<circle cx="${q[0]}" cy="${q[1]}" r="${estreito ? 3 : 4}" fill="${S[i].rex >= 0 ? CORES.verde : CORES.bordo}" stroke="#0A141C" stroke-width="1.5"/>`).join('');
  const passoRot = estreito && S.length > 8 ? 2 : 1;   // pula meses no eixo se apertado
  const rots = S.map((m, i) => i % passoRot !== 0 ? '' :
    `<text class="eixo forte" style="font-size:${fForte}px" x="${ml + i * bw + bw / 2}" y="${Ht - (estreito ? 8 : 11)}" text-anchor="middle">${esc(m.rot)}</text>`).join('');
  const alvos = S.map((m, i) => `<rect class="alvo" x="${ml + i * bw}" y="${mt}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}"/>`).join('');
  const guia = `<line id="guia" x1="0" y1="${mt}" x2="0" y2="${mt + ih}" stroke="${CORES.azul}" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
  window.__EVO_PTS = S.map((m, i) => ({ ...m, x: ml + i * bw + bw / 2 }));
  wrap.innerHTML = `<svg id="svgEvo" width="${W}" height="${Ht}" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Evolução mensal">
      ${gy}${barras}<path d="${linha}" fill="none" stroke="${CORES.azul}" stroke-width="2.4"/>${pontos}${guia}${rots}${alvos}</svg>
    <div class="dica" id="dicaEvo"></div>`;
  ligarEvolucao();
}

function ligarEvolucao() {
  const svg = document.getElementById('svgEvo'), dica = document.getElementById('dicaEvo');
  if (!svg || !dica || !window.__EVO_PTS) return;
  const guia = document.getElementById('guia');
  const vb = svg.viewBox.baseVal;
  const mostrar = i => {
    const d = window.__EVO_PTS[i]; if (!d) return;
    dica.innerHTML = `<b>${esc(d.rot)}</b>
      <span><i style="background:${CORES.laranja}"></i>Receita bruta<em>${R$(d.rb)}</em></span>
      <span><i style="background:${d.rex >= 0 ? CORES.verde : CORES.bordo}"></i>Resultado<em>${R$(d.rex)}</em></span>`;
    const r = svg.getBoundingClientRect();
    const px = (d.x / vb.width) * r.width;
    dica.style.left = Math.min(Math.max(px, 90), r.width - 90) + 'px';
    dica.style.opacity = 1;
    guia.setAttribute('x1', d.x); guia.setAttribute('x2', d.x); guia.setAttribute('opacity', .7);
  };
  svg.querySelectorAll('.alvo').forEach(el => {
    el.addEventListener('mouseenter', () => mostrar(+el.dataset.i));
    el.addEventListener('click', () => mostrar(+el.dataset.i));
  });
  svg.addEventListener('mouseleave', () => { dica.style.opacity = 0; guia.setAttribute('opacity', 0); });
}

/* ===================== saídas até o resultado operacional ===================== */
function saidas(p) {
  const a = agregar(p); if (!a) return '';
  const PAIS = [CH.ded, CH.ccv, CH.dop];
  const bl = []; let pai = null;
  a.linhas.forEach((l, k) => {
    const v = a.val[k];
    if (l.nivel === 0) pai = PAIS.includes(l.rot) ? l.rot : null;
    if (l.nivel === 1 && pai && Math.abs(v || 0) > 0) bl.push({ g: l.rot, pai, v: Math.abs(v) });
  });
  if (!bl.length) return '';
  bl.sort((x, y) => y.v - x.v);
  const tot = bl.reduce((s, x) => s + x.v, 0);
  const max = bl[0].v;
  const rb = a.v(CH.rb) || 0, rop = a.v(CH.rop) || 0;
  const cor = q => q === CH.ded ? CORES.ouro : q === CH.ccv ? CORES.azul : CORES.laranja;
  const linhas = bl.map(b => `<div class="li"><div>
      <div class="nm"><span>${esc(b.g)}</span><span style="color:var(--cinza);font-family:'IBM Plex Mono',monospace">${R$(b.v)}</span></div>
      <div class="tr"><div class="br" style="width:${Math.max(b.v / max * 100, .6)}%;background:${cor(b.pai)};opacity:.88"></div></div>
    </div><div class="pc">${P(b.v / tot)}</div></div>`).join('');
  return `<div class="card"><h2>Para onde vai o dinheiro</h2>
    <div class="leg">Tudo que sai entre a receita bruta e o resultado operacional: deduções, custos com vendas e despesas operacionais.
      Não inclui resultado financeiro nem não operacional.</div>
    <div class="tot-bar"><span>Total das saídas</span><b>${R$(tot)}</b></div>
    <div class="tot-sub">${R$(rb)} de receita bruta − ${R$(tot)} = ${R$(rop)} de resultado operacional</div>
    <div class="bh">${linhas}</div>
    <div class="tags"><span><i class="sem" style="background:${CORES.ouro}"></i>Deduções</span>
      <span><i class="sem" style="background:${CORES.azul}"></i>Custo com vendas</span>
      <span><i class="sem" style="background:${CORES.laranja}"></i>Despesas operacionais</span></div></div>`;
}

/* ===================== canais ===================== */
function canais(p) {
  const cs = p.comps.map(calcDe).filter(Boolean);
  if (!cs.length) return '';
  const acc = {}; const fora = new Set();
  cs.forEach(c => { (c.atual.grupos_custo || []).forEach(g => fora.add(g));
    Object.entries(c.atual.margem_por_grupo).forEach(([g, v]) => {
      acc[g] = acc[g] || { receita: 0, cmv: 0, litros: 0, pedidos: 0 };
      ['receita', 'cmv', 'litros', 'pedidos'].forEach(k => acc[g][k] += v[k]); }); });
  const gs = Object.entries(acc).filter(([g]) => !fora.has(g))
    .map(([g, v]) => ({ g, ...v, mb: v.receita > 0 ? (v.receita - v.cmv) / v.receita : null }))
    .sort((x, y) => y.receita - x.receita);
  const max = Math.max(...gs.map(x => x.receita), 1);
  const tot = gs.reduce((s, x) => s + Math.max(x.receita, 0), 0) || 1;
  const linhas = gs.map(x => { const c = x.mb === null ? CORES.cinza : x.mb >= .55 ? CORES.verde : x.mb >= .35 ? CORES.ouro : CORES.bordo;
    return `<div class="li"><div>
      <div class="nm"><span>${esc(x.g)}</span><span style="color:var(--cinza);font-family:'IBM Plex Mono',monospace">${R$(x.receita)}</span></div>
      <div class="tr"><div class="br" style="width:${Math.max(x.receita / max * 100, .6)}%;background:${c}"></div></div>
    </div><div class="pc" style="color:${c}">${x.mb === null ? '—' : P(x.mb)}<i>margem</i></div></div>`; }).join('');
  const tab = gs.map(x => `<tr><td>${esc(x.g)}</td><td>${N(x.pedidos)}</td><td>${N(x.litros)}</td>
    <td>${M(x.receita)}</td><td>${M(x.cmv)}</td><td>${x.mb === null ? '—' : P(x.mb)}</td><td>${P(x.receita / tot)}</td></tr>
    `).join('') + `<tr class="tt-canal"><td>TOTAL</td><td>${N(gs.reduce((s,x)=>s+x.pedidos,0))}</td>
    <td>${N(gs.reduce((s,x)=>s+x.litros,0))}</td><td>${M(tot)}</td>
    <td>${M(gs.reduce((s,x)=>s+x.cmv,0))}</td>
    <td>${P((tot - gs.reduce((s,x)=>s+x.cmv,0)) / tot)}</td><td>100,0%</td></tr>`;
  return `<div class="card"><h2>Margem por canal</h2>
    <div class="leg">Barra proporcional à receita; número à direita é a margem bruta. Participação é sobre o
      total dos canais listados (vendas + logística): ${R$(tot)}.</div>
    <div class="bh">${linhas}</div>
    <div class="tags"><span><i class="sem s-v"></i>≥ 55%</span><span><i class="sem s-a"></i>35% a 55%</span><span><i class="sem s-r"></i>&lt; 35%</span></div>
    <div style="overflow-x:auto;margin-top:16px"><table>
      <thead><tr><th>Canal</th><th>Pedidos</th><th>Litros</th><th>Receita</th><th>CMV</th><th>Margem</th><th>Part.</th></tr></thead>
      <tbody>${tab}</tbody></table></div></div>`;
}

/* ===================== DRE detalhado ===================== */
function linhasDRE(agg, n3, comparativos) {
  const L = []; let b0 = null, pai1 = null, valPai1 = null, rotPai1 = null;
  agg.linhas.forEach((l, k) => {
    const v = agg.val[k];
    if (v === null || v === undefined) return;
    if (l.nivel === 0) { b0 = l.rot; pai1 = null; }
    if (l.nivel === 1) { pai1 = b0 + '/' + l.rot; valPai1 = v; rotPai1 = l.rot; }

    if (l.nivel === 1 && !abertos[b0]) return;
    if (l.nivel === 2 && !abertos[pai1]) return;

    const f = exibir(l), pct = l.tipo === 'pct';
    const base = baseAV(l, { b0 }, agg, valPai1);
    const av = (pct || !base) ? null : f(v) / base;

    // filhos
    let temF = false, idF = null;
    if (l.nivel === 0) { temF = agg.linhas[k + 1] && agg.linhas[k + 1].nivel === 1; idF = b0; }
    else if (l.nivel === 1) { temF = agg.linhas[k + 1] && agg.linhas[k + 1].nivel === 2; idF = pai1; }
    else if (l.nivel === 2) { const t = n3[rotPai1] && n3[rotPai1][l.rot]; if (t) { temF = true; idF = pai1 + '/' + l.rot; } }

    const cls = pct ? 'pct' : l.rot === 'RESULTADO DO EXERCÍCIO' ? 'fim' : l.tipo === 'total' ? 'tot' : 'n' + l.nivel;
    const cam = l.nivel === 0 ? l.rot : l.nivel === 1 ? b0 + '/' + l.rot : b0 + '/' + rotPai1 + '/' + l.rot;
    L.push({ cls, temF, idF, rot: (l.sinal ? '(' + l.sinal + ') ' : '') + l.rot,
      cam, l, pct, val: pct ? v : f(v), av, f, nivel: l.nivel });

    // nível 3
    if (l.nivel === 2 && temF && abertos[idF]) {
      Object.entries(n3[rotPai1][l.rot]).sort((a, b) => b[1] - a[1]).forEach(([n, vv]) =>
        L.push({ cls: 'n3', temF: false, rot: n, cam: null, l, pct: false,
          val: l.sinal === '-' ? -Math.abs(vv) : Math.abs(vv), av: null, nivel: 3 }));
    }
  });
  return L;
}

function tabelaDRE(cols) {
  /* cols: lista de periodos. Com mais de um, entra a coluna Total. */
  const varias = cols.length > 1;
  const total = varias ? { ...cols[0], comps: cols.flatMap(c => c.comps),
                           nome: 'Total ' + cols[0].ano, tipo: cols[0].tipo } : null;
  const aggs = cols.map(agregar);
  const aggTot = varias ? agregar(total) : aggs[0];
  const n3 = nivel3De(aggTot.comps);
  const L = linhasDRE(aggTot, n3);

  const fmt = (d, pct) => d === null ? '—' : pct ? ((d * 100 >= 0 ? '+' : '') + (d * 100).toFixed(1) + ' p.p.')
                                                 : ((d >= 0 ? '+' : '') + (d * 100).toFixed(1) + '%');
  const avDe = (agg, x) => {
    if (x.pct || !x.cam) return null;
    const b = baseAVcam(x, agg);
    const v = agg.vc(x.cam);
    return (b && v !== null) ? (x.f ? x.f(v) : v) / b : null;
  };
  const cel = (agg, x) => { const v = x.cam ? agg.vc(x.cam) : null;
    return v === null || v === undefined ? '—' : (x.pct ? P(v) : M(x.f ? x.f(v) : v)); };
  const delta = (agg, ref, x) => {
    const va = x.cam ? agg.vc(x.cam) : null, vb = (ref && x.cam) ? ref.vc(x.cam) : null;
    return x.pct ? (vb === null || va === null ? null : va - vb)
                 : variacao(x.f ? x.f(va) : va, x.f ? x.f(vb) : vb, x.l);
  };

  /* referencias: periodo anterior (para AH) e mesmo periodo do ano passado (para Δ ano) */
  const refsAnt = cols.map((c, i) => {
    const r = varias ? (i > 0 ? cols[i - 1] : periodoAnterior(c)) : periodoAnterior(c);
    return r ? agregar(r) : null;
  });
  const refsAno = cols.map(c => { const aa = periodoAnoAnt(c); return aa ? agregar(aa) : null; });
  const totRefAno = varias ? (() => { const r = periodoAnoAntLista(cols); return r ? agregar(r) : null; })() : null;

  /* cabeçalho */
  const th = [];
  const bloco = (rot, comp, anoAnt) => {
    th.push(`<th>${esc(rot)}</th>`);
    if (mostrarAV) th.push('<th>AV%</th>');
    if (mostrarAH) th.push(`<th>AH%${comp ? `<i>vs ${esc(comp)}</i>` : ''}</th>`);
    if (mostrarDelta) th.push(`<th>Δ ano${anoAnt ? `<i>vs ${esc(anoAnt)}</i>` : ''}</th>`);
  };
  cols.forEach((c, i) => bloco(agregar(c).nome,
    refsAnt[i] ? refsAnt[i].nome : null, refsAno[i] ? refsAno[i].nome : null));
  if (varias) bloco('Total ' + cols[0].ano, null, totRefAno ? totRefAno.nome : null);

  /* corpo */
  const linhas = L.map(x => {
    const tds = [];
    aggs.forEach((agg, i) => {
      tds.push(`<td>${cel(agg, x)}</td>`);
      if (mostrarAV) { const av = avDe(agg, x); tds.push(`<td class="av">${av === null ? '—' : P(Math.abs(av))}</td>`); }
      if (mostrarAH) { const d = delta(agg, refsAnt[i], x); tds.push(`<td class="${classeVar(d, x.l)}">${fmt(d, x.pct)}</td>`); }
      if (mostrarDelta) { const d = delta(agg, refsAno[i], x); tds.push(`<td class="${classeVar(d, x.l)}">${fmt(d, x.pct)}</td>`); }
    });
    if (varias) {
      tds.push(`<td class="tt">${cel(aggTot, x)}</td>`);
      if (mostrarAV) { const av = avDe(aggTot, x); tds.push(`<td class="av tt">${av === null ? '—' : P(Math.abs(av))}</td>`); }
      if (mostrarAH) { const d = delta(aggTot, totRefAno, x); tds.push(`<td class="tt ${classeVar(d, x.l)}">${fmt(d, x.pct)}</td>`); }
      if (mostrarDelta) { const d = delta(aggTot, totRefAno, x); tds.push(`<td class="tt ${classeVar(d, x.l)}">${fmt(d, x.pct)}</td>`); }
    }
    return `<tr class="${x.cls} ${x.temF ? 'abre' : ''}" ${x.temF ? `data-b="${esc(x.idF)}"` : ''}>
      <td><span class="seta">${x.temF ? (abertos[x.idF] ? '▾' : '▸') : ''}</span>${esc(x.rot)}</td>${tds.join('')}<td class="vazia"></td></tr>`;
  }).join('');

  return card('DRE detalhado',
    `AV: receitas sobre a receita bruta e sobre a categoria mãe; CMV, taxas, devolução e eventos sobre a receita com vendas;
     o restante sobre a receita bruta. AH compara com o período imediatamente anterior. Δ ano compara com o mesmo período do ano passado.`,
    `<table class="dre"><thead><tr><th>Linha</th>${th.join('')}<th class="vazia"></th></tr></thead>
      <tbody id="tb">${linhas}</tbody></table>`);
}

/* mesmo conjunto de períodos no ano anterior, para o total */
function periodoAnoAntLista(cols) {
  const ano = String(+cols[0].ano - 1);
  if (!H[ano]) return null;
  const comps = cols.flatMap(c => c.comps)
    .map(c => c.slice(0, 2) + ano).filter(c => posDe(c) >= 0);
  return comps.length ? { ano, comps, nome: cols.length > 1 ? ano : 'Total ' + ano,
                          tipo: cols[0].tipo, m: cols[0].m, ref: null } : null;
}

/* base da AV a partir da linha já montada */
function baseAVcam(x, agg) {
  const partes = x.cam.split('/');
  const b0 = partes[0];
  const pai1 = partes.length === 3 ? agg.vc(partes[0] + '/' + partes[1]) : null;
  return baseAV(x.l, { b0 }, agg, pai1);
}

/* cartão com rolagem espelhada no topo */
function card(titulo, leg, tabela) {
  return `<div class="card"><div class="card-cab">
      <div><h2>${titulo}</h2><div class="leg">${leg}</div></div>
      <div class="acoes">
        <span class="flags">
          <label class="fl"><input type="checkbox" id="cAV" ${mostrarAV ? 'checked' : ''}> AV</label>
          <label class="fl"><input type="checkbox" id="cAH" ${mostrarAH ? 'checked' : ''}> AH</label>
          <label class="fl"><input type="checkbox" id="cDelta" ${mostrarDelta ? 'checked' : ''}> Δ ano</label>
        </span>
        <button class="bt" id="btNiveis">${Object.keys(abertos).some(k => abertos[k]) ? 'Recolher tudo' : 'Expandir tudo'}</button>
      </div>
    </div>
    <div class="rolagem-topo" id="rolTopo"><div></div></div>
    <div class="rolagem" id="rolTab">${tabela}</div></div>`;
}

/* ===================== insights ===================== */
function painelInsights(p) {
  const c = p.comps.length === 1 ? calcDe(p.comps[0]) : null;
  if (!c) return '';
  const i = c.insights;
  if (!i.conclusoes || !i.conclusoes.length) return '';
  return `<div class="ins ins-1"><section><h3><span class="pill p-v">Conclusões</span></h3>
    <ul>${i.conclusoes.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section></div>`;
}

/* ===================== páginas ===================== */
const PAGINAS = [
  { id: 'dre', ic: '▦', nome: 'DRE', tit: 'Demonstrativo de Resultado' },
  { id: 'caixa', ic: '◈', nome: 'Fluxo de Caixa', tit: 'Fluxo de Caixa' },
  { id: 'ind', ic: '◉', nome: 'Indicadores', tit: 'Indicadores' }
];
const pgVazia = (t, x) => `<div class="vazio-pg"><h3>${esc(t)}</h3><p>${esc(x)}</p></div>`;

/* periodos que viram colunas: um selecionado, ou todos do ano */
function colunas() {
  if (visao === 'ano') return [periodoDe(compAtual, 'ano')];
  const op = opcoesPeriodo(compAtual.slice(2));
  const alvo = op.filter(([c]) => selPeriodos.size === 0 || selPeriodos.has(c));
  const usar = alvo.length ? alvo : op;
  return usar.map(([c]) => periodoDe(c, visao));
}

function pgDRE() {
  const cols = colunas();
  const p = cols.length === 1 ? cols[0]
    : { ...cols[0], comps: cols.flatMap(c => c.comps), nome: cols[0].ano, tipo: cols[0].tipo,
        ref: periodoAnoAntLista(cols) };
  return kpis(p)
    + `<div class="grade">${evolucao(p)}</div>`
    + `<div class="grade c2">${cascata(p)}${saidas(p)}</div>`
    + `<div class="grade">${tabelaDRE(cols)}</div>`
    + `<div class="grade">${canais(p)}</div>`
    + painelInsights(p);
}

/* ===================== render ===================== */
const VISOES = [['mes', 'Mês'], ['trim', 'Trimestre'], ['sem', 'Semestre'], ['ano', 'Ano']];

/* opcoes do seletor de periodo, conforme a visao */
function opcoesPeriodo(ano) {
  const ms = mesesDoAno(ano);
  if (visao === 'mes') return ms.map(m => [m.comp, m.rot]);
  if (visao === 'trim') {
    const q = [...new Set(ms.map(m => Math.ceil(m.m / 3)))].sort();
    return q.map(n => [ms.filter(m => Math.ceil(m.m / 3) === n).slice(-1)[0].comp, `${n}º Trim`]);
  }
  if (visao === 'sem') {
    const q = [...new Set(ms.map(m => Math.ceil(m.m / 6)))].sort();
    return q.map(n => [ms.filter(m => Math.ceil(m.m / 6) === n).slice(-1)[0].comp, `${n}º Sem`]);
  }
  return [];
}
/* mantem o periodo valido ao trocar de visao ou de ano */
function ajustarPeriodo(ano) {
  const op = opcoesPeriodo(ano);
  if (!op.length) { const ms = mesesDoAno(ano); compAtual = ms[ms.length - 1].comp; return; }
  if (!op.some(([c]) => c === compAtual)) compAtual = op[op.length - 1][0];
}
function resumoSelecao(op) {
  if (selPeriodos.size === 0) return 'Todos';
  const marcados = op.filter(([c]) => selPeriodos.has(c));
  if (marcados.length === 0) return 'Todos';
  if (marcados.length === 1) return marcados[0][1];
  if (marcados.length === op.length) return 'Todos';
  if (marcados.length <= 3) return marcados.map(([, r]) => r).join(', ');
  return `${marcados.length} períodos`;
}

function filtros() {
  const anos = Object.keys(H).sort().reverse();
  const anoSel = compAtual.slice(2);
  const op = opcoesPeriodo(anoSel);
  return `<label for="fAno">Ano</label>
    <select id="fAno">${anos.map(a => `<option value="${a}" ${a === anoSel ? 'selected' : ''}>${a}</option>`).join('')}</select>
    <label for="fVis">Visão</label>
    <select id="fVis">${VISOES.map(([v, n]) => `<option value="${v}" ${v === visao ? 'selected' : ''}>${n}</option>`).join('')}</select>
    ${op.length ? `<label>Período</label>
    <div class="sel-multi">
      <button type="button" class="bt-sel" id="btPer" aria-expanded="${painelAberto}">
        ${esc(resumoSelecao(op))} <span class="cv">▾</span></button>
      <div class="painel ${painelAberto ? 'aberto' : ''}" id="painelPer">
        <label class="opt todos"><input type="checkbox" id="pTodos" ${selPeriodos.size === 0 ? 'checked' : ''}> Todos</label>
        <div class="sep"></div>
        ${op.map(([c, r]) => `<label class="opt"><input type="checkbox" class="pOpt" value="${c}"
          ${selPeriodos.has(c) ? 'checked' : ''}> ${esc(r)}</label>`).join('')}
      </div></div>` : ''}`;
}

let salvoRol = null;
function render() {
  const antRol = document.getElementById('rolTab');
  if (antRol) salvoRol = { left: antRol.scrollLeft, top: antRol.scrollTop };
  document.getElementById('nav').innerHTML = `<div class="grp">Relatórios</div>` +
    PAGINAS.map(x => `<button data-p="${x.id}" class="${x.id === pagina ? 'on' : ''}"><span class="ic">${x.ic}</span>${x.nome}</button>`).join('') +
    `<div class="rod">Regime de competência.<br>Fonte: conciliação de faturamento, despesas do ERP e planilha Farra DRE.</div>`;

  const pg = PAGINAS.find(x => x.id === pagina);
  document.getElementById('tTit').textContent = pg.tit;
  const cs = pagina === 'dre' ? colunas() : [];
  document.getElementById('tSub').textContent = pagina === 'dre'
    ? (cs.length > 1 ? `${cs[0].ano} · ${cs.length} períodos` : cs[0].nome) : 'Em construção';
  document.getElementById('filtros').innerHTML = pagina === 'dre' ? filtros() : '';
  document.getElementById('app').innerHTML =
    pagina === 'dre' ? pgDRE()
    : pagina === 'caixa' ? pgVazia('Fluxo de Caixa', 'Página reservada. Assim que a base de entradas e saídas por data estiver definida, entra aqui com saldo, previsto x realizado e projeção.')
    : pgVazia('Indicadores', 'Página reservada para os indicadores gerenciais: ciclo de caixa, giro de estoque, litragem por canal, inadimplência e metas.');

  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
    pagina = b.dataset.p; document.getElementById('menu').classList.remove('abre'); render(); });
  const fa = document.getElementById('fAno'), fm = document.getElementById('fMes'), fv = document.getElementById('fVis');
  if (fa) fa.onchange = e => { const ms = mesesDoAno(e.target.value);
    compAtual = ms[ms.length - 1].comp; selPeriodos = new Set(); render(); };
  const bp = document.getElementById('btPer');
  if (bp) {
    bp.onclick = e => { e.stopPropagation(); painelAberto = !painelAberto; render(); };
    document.getElementById('pTodos').onchange = () => { selPeriodos = new Set(); render(); };
    document.querySelectorAll('.pOpt').forEach(cb => cb.onchange = () => {
      cb.checked ? selPeriodos.add(cb.value) : selPeriodos.delete(cb.value);
      const ult = [...selPeriodos].sort().pop();
      if (ult) compAtual = ult;
      render();
    });
    document.getElementById('painelPer').onclick = e => e.stopPropagation();
  }
  const cav = document.getElementById('cAV'), cah = document.getElementById('cAH'), cd = document.getElementById('cDelta');
  if (cav) cav.onchange = e => { mostrarAV = e.target.checked; render(); };
  if (cah) cah.onchange = e => { mostrarAH = e.target.checked; render(); };
  if (cd) cd.onchange = e => { mostrarDelta = e.target.checked; render(); };
  if (fv) fv.onchange = e => { visao = e.target.value; selPeriodos = new Set(); render(); };
  document.querySelectorAll('#tb tr[data-b]').forEach(tr => tr.onclick = () => {
    abertos[tr.dataset.b] = !abertos[tr.dataset.b]; render(); });

  const bt = document.getElementById('btNiveis');
  if (bt) bt.onclick = () => {
    if (Object.keys(abertos).some(k => abertos[k])) abertos = {};
    else {
      const cc = colunas();
      const tot = { ...cc[0], comps: cc.flatMap(c => c.comps) };
      const agg = agregar(tot); let b0 = null;
      const n3 = nivel3De(tot.comps); let r1 = null;
      agg.linhas.forEach(l => {
        if (l.nivel === 0) { b0 = l.rot; abertos[b0] = true; }
        if (l.nivel === 1) { r1 = l.rot; abertos[b0 + '/' + l.rot] = true; }
        if (l.nivel === 2 && n3[r1] && n3[r1][l.rot]) abertos[b0 + '/' + r1 + '/' + l.rot] = true;
      });
    }
    render();
  };
  sincronizarRolagem();
  desenharEvolucao();
}

/* barra de rolagem espelhada no topo da tabela */
function sincronizarRolagem() {
  const topo = document.getElementById('rolTopo'), tab = document.getElementById('rolTab');
  if (!topo || !tab) return;
  const larg = tab.scrollWidth;
  topo.firstElementChild.style.width = larg + 'px';
  topo.style.display = larg > tab.clientWidth + 2 ? 'block' : 'none';
  // largura util pode diferir entre as duas barras (a de baixo perde espaço para a
  // rolagem vertical); sincroniza por FRACAO, nao por pixel, pra ambas chegarem ao fim juntas
  const maxTopo = () => Math.max(topo.scrollWidth - topo.clientWidth, 1);
  const maxTab = () => Math.max(tab.scrollWidth - tab.clientWidth, 1);
  if (salvoRol) { tab.scrollLeft = salvoRol.left; tab.scrollTop = salvoRol.top;
    topo.scrollLeft = (salvoRol.left / maxTab()) * maxTopo(); }
  let travado = false;
  topo.onscroll = () => { if (travado) return; travado = true;
    tab.scrollLeft = (topo.scrollLeft / maxTopo()) * maxTab(); travado = false; };
  tab.onscroll = () => { if (travado) return; travado = true;
    topo.scrollLeft = (tab.scrollLeft / maxTab()) * maxTopo(); travado = false; };
}

document.getElementById('tog').onclick = () => document.getElementById('menu').classList.toggle('abre');
document.addEventListener('click', () => { if (painelAberto) { painelAberto = false; render(); } });
let __rt;
window.addEventListener('resize', () => { clearTimeout(__rt); __rt = setTimeout(() => { sincronizarRolagem(); desenharEvolucao(); }, 150); });
render();

</script>
