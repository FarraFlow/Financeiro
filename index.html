<style>
:root{
  /* Tema "Aurora" — gradiente azul-verde animado + vidro fosco, cores da marca Farra Bier */
  --bg-1:#0A141C;         /* base do fundo — azul-noite profundo */
  --carta:#15242B;        /* solido opaco — usado onde precisa ser 100% opaco (tabela, sticky) */
  --vidro:rgba(21,36,43,.58);   /* vidro fosco — cartoes flutuando sobre a aurora */
  --vidro-b:rgba(255,255,255,.09); /* borda do vidro */
  --papel:rgba(255,255,255,.07); /* superficie elevada — inputs, hover */
  --linha:rgba(255,255,255,.13); /* bordas gerais */
  --tinta:#F1F6F4;        /* texto principal */
  --cinza:#A9BFC2;        /* texto secundario */
  --cinza-c:#6D8488;      /* texto terciario */

  --azul:#6FA3DA;         /* 2374/2159 CP, clareado — acento primario agora */
  --azul-fundo:#2C5C8C;   /* variante solida p/ preenchimento (linha final da DRE) */
  --azul-c:#9CC8F2;
  --bordo:#FF6E79;        /* 7622 CP, clareado forte p/ fundo escuro saturado */
  --vermelho:#FF8F97;
  --ouro:#FFC369;         /* 4021 CP, clareado */
  --ouro-c:#FFE388;       /* 2005 CP */
  --verde:#7FE07E;        /* 3561 CP, clareado — segundo acento vivo */
  --laranja:#FFA24D;      /* 2011 CP */
  --margem:#6EE7D4;       /* ciano — acento proprio das linhas de margem */

  --linha-total-bg:#1E3A54;   /* fundo das linhas de totais/subtotais das tabelas */
  --linha-total-borda:#2F5378; /* borda das linhas de totais/subtotais das tabelas */

  --menu:216px;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-1); color:var(--tinta);
  font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  position:relative; min-height:100vh;
}
/* ================= aurora animada de fundo ================= */
body::before,body::after{
  content:''; position:fixed; inset:-25%; z-index:-1; pointer-events:none;
  filter:blur(95px) saturate(150%);
}
body::before{
  background:
    radial-gradient(36% 40% at 16% 20%, #3E7FC4 0%, transparent 70%),
    radial-gradient(44% 48% at 86% 14%, #35A45E 0%, transparent 72%),
    radial-gradient(48% 52% at 26% 88%, #1E5C8C 0%, transparent 70%);
  opacity:.65;
  animation:aurora1 36s ease-in-out infinite alternate;
}
body::after{
  background:
    radial-gradient(38% 42% at 78% 80%, #5BCB74 0%, transparent 70%),
    radial-gradient(30% 34% at 52% 46%, #2E6FA0 0%, transparent 75%);
  mix-blend-mode:screen; opacity:.5;
  animation:aurora2 29s ease-in-out infinite alternate-reverse;
}
@keyframes aurora1{
  0%{transform:translate(0,0) rotate(0deg) scale(1)}
  100%{transform:translate(5%,-4%) rotate(10deg) scale(1.08)}
}
@keyframes aurora2{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(-6%,5%) scale(1.12)}
}
@media (prefers-reduced-motion:reduce){ body::before,body::after{animation:none} }
h1,h2,h3{font-family:'Archivo',sans-serif; letter-spacing:-.01em; margin:0}

/* ================= menu lateral ================= */
.menu{
  position:fixed; left:0; top:0; bottom:0; width:216px; z-index:40; transform:translateZ(0);
  background:linear-gradient(165deg, rgba(34,68,98,.82) 0%, rgba(20,58,46,.88) 100%);
  backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
  color:#fff; display:flex; flex-direction:column;
  border-right:1px solid var(--vidro-b);
}
.marca{
  display:flex; align-items:center; gap:12px; position:relative;
  padding:18px 14px; border-bottom:1px solid rgba(255,255,255,.14);
}
.marca::before{
  content:''; position:absolute; left:-30px; top:-30px; width:150px; height:150px; z-index:0;
  background:radial-gradient(circle, rgba(127,224,126,.28) 0%, rgba(111,163,218,.20) 45%, transparent 72%);
  pointer-events:none;
}
.marca img{height:52px; width:auto; display:block; flex:none; position:relative; z-index:1;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.4))}
.marca .tit{display:flex; align-items:center; line-height:1.05; position:relative; z-index:1; min-width:0}
.marca .tit b,.marca .tit i{font-family:'Fraunces',serif; font-style:normal; font-size:17px; text-transform:uppercase; font-optical-sizing:auto; white-space:nowrap}
.marca .tit b{font-weight:800; letter-spacing:.02em; color:#fff}
.marca .tit i{font-weight:600; letter-spacing:.1em; color:var(--verde)}
.nav{padding:12px 10px; display:flex; flex-direction:column; gap:2px; flex:1}
.nav .grp{font-size:9.5px; text-transform:uppercase; letter-spacing:.16em; color:#8FADB2; padding:12px 10px 6px}
.nav .subgrp{font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:#9FBCC0; padding:10px 10px 4px 18px}
.nav button.sub{padding-left:24px; font-size:12.5px}
.nav button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:0; color:#DCEBEA; font:inherit; font-size:13px;
  padding:10px 12px; border-radius:9px; cursor:pointer; transition:background .15s,color .15s;
}
.nav button:hover{background:rgba(255,255,255,.10); color:#fff}
.nav button.on{background:linear-gradient(120deg, var(--azul) 0%, var(--verde) 130%); color:var(--bg-1); font-weight:700}
.nav button.on .ic{color:var(--bg-1); opacity:1}
.nav button .ic{width:18px; height:18px; flex:none; opacity:.88}
.nav button .ic svg{display:block; width:100%; height:100%}
.nav .rod{margin-top:auto; padding:14px 12px; font-size:10.5px; color:#7E9A9E; line-height:1.45}
.menu-tog{display:none}

/* ================= área principal ================= */
.wrap{margin-left:216px; min-height:100vh; display:flex; flex-direction:column}
.topo{
  background:rgba(9,17,23,.94); backdrop-filter:blur(12px) saturate(150%); -webkit-backdrop-filter:blur(12px) saturate(150%); transform:translateZ(0);
  border-bottom:1px solid var(--linha);
  padding:13px 26px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  position:sticky; top:0; z-index:30;
  box-shadow:0 12px 24px -8px rgba(0,0,0,.35);
}
.topo::after{
  content:''; position:absolute; left:0; right:0; top:100%; height:3px;
  background:linear-gradient(90deg, var(--azul) 0%, var(--verde) 55%, transparent 90%);
  opacity:.8;
}

}

.kpi .val{font-family:'IBM Plex Mono',monospace; font-size:clamp(16px,1.35vw,20px); font-weight:600; letter-spacing:-.03em; white-space:nowrap; color:var(--tinta)}
.kpi .sub{font-size:11px; color:var(--cinza); margin-top:5px; line-height:1.35}

/* ================= ícones ================= */

.card h2{display:flex; align-items:center; gap:8px}

/* ================= cartões ================= */
.grade{display:grid; gap:16px; margin-bottom:16px; min-width:0}

.bloco-sliders{padding:0 16px 10px}

/* cabeçalho recolhível do bloco */

/* box de premissa (custos variáveis) */

.inp-unico-wrap{display:flex; align-items:center; gap:4px}

/* bloco Financeiras: valores em R$ (nao %), fora do padrao de bloco-topo/slider-cat */
.bloco-fin .bloco-titulo{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--cinza-c); margin:10px 0 4px}

.fin-linha{padding:8px 0; border-bottom:1px solid var(--linha)}

.fin-meses{display:flex; flex-wrap:wrap; gap:6px}
.fin-meses label{display:flex; flex-direction:column; font-size:10px; align-items:center; gap:2px}
.fin-meses input[type="number"]{width:74px}

.grade > *{min-width:0; min-height:0}
.c2{grid-template-columns:1.3fr 1fr}
.card{background:var(--vidro); backdrop-filter:blur(10px) saturate(150%); -webkit-backdrop-filter:blur(10px) saturate(150%); transform:translateZ(0);
  border:1px solid var(--vidro-b); border-radius:var(--r); padding:19px 21px;

.bt{font:inherit; font-size:11.5px; padding:6px 11px; border:1px solid var(--linha); background:var(--papel);
    color:var(--tinta); border-radius:6px; cursor:pointer; white-space:nowrap; transition:background .15s,border-color .15s}

.rolagem-topo{overflow-x:auto; overflow-y:hidden; height:12px; margin-bottom:2px}

.card{overflow:hidden}
.ponte-sub{font-size:11.5px; color:var(--cinza); margin-bottom:14px}
.ponte-cols{display:grid; grid-template-columns:1fr 1fr; gap:22px}

.acoes{display:flex; gap:14px; align-items:center}

.sel-multi{position:relative}
.bt-sel{font:inherit; font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:6px 10px;
  background:var(--papel); border:1px solid var(--linha); border-radius:6px; cursor:pointer;
  color:var(--tinta); display:flex; align-items:center; gap:8px; min-width:112px; justify-content:space-between}

.painel{position:absolute; right:0; top:calc(100% + 5px); background:#122029; border:1px solid var(--linha);

  letter-spacing:.1em; color:var(--cinza); cursor:pointer}

.dre th i{display:block; font-style:normal; font-weight:400; font-size:9px; letter-spacing:.04em; color:var(--cinza-c); text-transform:none; margin-top:1px}

.ponte{margin-top:20px; padding-top:16px; border-top:1px solid var(--linha)}
.ponte-cab{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:4px}
.ponte-cab h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--tinta)}

.pt-v{font-family:'IBM Plex Mono',monospace; font-size:11px; fill:var(--tinta)}

/* ================= cascata ================= */
.casc{display:flex; flex-direction:column; gap:3px; position:relative}

svg{display:block; width:100%; height:auto; overflow:visible}

@keyframes subirBarra{from{transform:scaleY(0)} to{transform:scaleY(1)}}

.eixo{font-family:'IBM Plex Mono',monospace; font-size:12px; fill:var(--cinza)}

  white-space:nowrap; transition:opacity .12s; box-shadow:0 16px 36px rgba(0,0,0,.55)}

  padding:9px 12px; background:var(--papel); border-radius:7px; margin-bottom:5px}

   sem legenda separada: a cor da fatia repete no ponto ao lado do nome de cada

/* ================= tabelas ================= */

}
th:first-child{text-align:left}

.dre tr.n2 td:first-child{padding-left:48px}
.dre tr.n2 td{color:var(--cinza); font-size:11.3px}
.dre tr.n3 td:first-child{padding-left:70px}
.dre tr.n3 td{color:var(--cinza); font-size:10.8px}
.dre td.tt{font-weight:600}
.dre th{position:sticky; top:0; z-index:3}
.dre td:first-child,.dre th:first-child{position:sticky; left:0; background:var(--carta)}
.dre tbody td:first-child{z-index:2}
.dre thead th:first-child{z-index:5}
.dre tr.tot td:first-child,.dre tr.fim td:first-child{background:var(--linha-total-bg)}
.dre tr.pct td:first-child{background:#1F393E}
.dre tr.tot td,.dre tr.fim td{background:var(--linha-total-bg); color:var(--azul-c); font-weight:700; border-top:1px solid var(--linha-total-borda); border-bottom:1px solid var(--linha-total-borda)}
.dre tr.pct td{background:rgba(110,231,212,.11); color:var(--margem); font-weight:600; font-size:11.3px}
.dre tr.abre{cursor:pointer} .dre tr.abre:hover td{filter:brightness(1.22)}
.dre tr.abre:focus-visible{outline:2px solid var(--azul); outline-offset:-2px}
.dre tr.abre:focus-visible td{filter:brightness(1.22)}
.dre .seta{display:inline-block; width:13px; color:var(--cinza-c); font-size:9px}
.neg{color:var(--bordo)}
.dre tr.tot td.neg,.dre tr.fim td.neg,.dre tr.pct td.neg{color:var(--bordo)}
.av{color:var(--cinza-c)}
/* materialidade: variacoes pequenas ficam discretas; so o que passa do limiar acende */
.dre .up.leve,.dre .down.leve{color:var(--cinza); font-weight:400; opacity:.7}
.dre .up.mat{color:var(--verde); font-weight:700}
.dre .down.mat{color:var(--bordo); font-weight:700}

.tags{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--cinza); margin-top:14px}
.sem{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle}
.s-v{background:var(--verde)} .s-a{background:var(--ouro)} .s-r{background:var(--bordo)}

/* ================= insights ================= */
.ins{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px}
.ins-1 section ul{columns:2; column-gap:28px}
.ins-1 section li{break-inside:avoid; margin-bottom:11px}
@media (max-width:820px){ .ins-1 section ul{columns:1} }
tr.tt-canal td{border-top:1.5px solid var(--tinta); font-weight:600; background:var(--papel)}
.ins section{background:var(--vidro); backdrop-filter:blur(10px) saturate(150%); -webkit-backdrop-filter:blur(10px) saturate(150%);
  border:1px solid var(--vidro-b); border-radius:var(--r); padding:18px 20px}
.ins h3{font-size:11px; text-transform:uppercase; letter-spacing:.12em; margin-bottom:12px; display:flex; align-items:center; gap:8px}
.ins ul{margin:0; padding-left:17px}
.ins li{font-size:12.5px; margin-bottom:9px; line-height:1.5; color:var(--tinta)}
.ins li::marker{color:var(--cinza-c)}
.pill{font-size:9px; padding:2px 7px; border-radius:20px; letter-spacing:.08em; font-weight:600}
.p-v{background:rgba(127,224,126,.18); color:var(--verde)} .p-a{background:rgba(255,195,105,.18); color:var(--ouro)} .p-r{background:rgba(255,110,121,.18); color:var(--bordo)}
.vazio{color:var(--cinza); font-size:12.5px; font-style:italic}

.vazio-pg{background:var(--vidro); backdrop-filter:blur(10px); border:1px dashed var(--linha); border-radius:var(--r); padding:56px 30px; text-align:center; color:var(--cinza)}
.vazio-pg h3{font-size:15px; margin-bottom:8px; color:var(--tinta)}
.vazio-pg p{font-size:13px; margin:0 auto; max-width:470px}

@media (max-width:1024px){ .c2{grid-template-columns:1fr} .ponte-cols{grid-template-columns:1fr} }
@media (max-width:900px){
  .kpis, .kpis.k6{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:640px){
  .kpis, .kpis.k6{grid-template-columns:repeat(2,1fr)}
  .kpi{padding:11px 12px}
  .kpi .val{font-size:16px}
  .topo{padding:11px 14px}
  .topo h2{font-size:14.5px}
  .topo .sub{font-size:10.5px}
  .card{padding:15px 15px}
  .card h2{font-size:11px}
  .card .leg{font-size:10.5px; line-height:1.45; margin:4px 0 12px}
  .card-cab{gap:10px}
  .bt{font-size:11px; padding:11px 14px}
  .bt-sel{padding:11px 14px}
  .painel .opt{padding:10px 9px}
  .fl{font-size:10px}
}
@media (max-width:820px){
  .menu{transform:translateX(-100%); transition:transform .2s}
  .menu.abre{transform:none}
  .menu-tog{display:inline-block; background:none; border:1px solid var(--linha); border-radius:6px; padding:10px 13px; cursor:pointer; font-size:15px}
  .wrap{margin-left:0}
  main{padding:16px 14px 48px}
  .casc .l{grid-template-columns:92px 1fr 88px 48px 54px; gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const mesesDoAno = ano => TODOS.filter(t => t.ano === ano);
function periodoDe(comp, tipo) {
  const t = TODOS[posDe(comp)]; if (!t) return null;
  const ms = mesesDoAno(t.ano), m = t.m;
  const filtro = {
    mes: x => x.m === m,
    trim: x => Math.ceil(x.m / 3) === Math.ceil(m / 3),
    sem: x => Math.ceil(x.m / 6) === Math.ceil(m / 6),
    ano: () => true
  }[tipo] || (x => x.m === m);
  const sel = ms.filter(filtro);
  const nome = { mes: t.rot, trim: `${Math.ceil(m / 3)}º trim/${t.ano.slice(2)}`,
    sem: `${Math.ceil(m / 6)}º sem/${t.ano.slice(2)}`, ano: t.ano }[tipo];
  return { ano: t.ano, comps: sel.map(x => x.comp), nome, tipo, m };
}
/* período anterior e mesmo período do ano anterior */
function periodoAnterior(p) {
  if (p.ref !== undefined) return p.ref;          // periodo agregado define a propria referencia

    const i = posDe(p.comps[p.comps.length - 1]);

  const passo = p.tipo === 'trim' ? 3 : p.tipo === 'sem' ? 6 : 12;
  let m = p.m - passo, ano = +p.ano;
  if (m < 1) { m += 12; ano -= 1; }

  return posDe(comp) >= 0 ? periodoDe(comp, p.tipo) : null;
}

/* caminho hierarquico (mesmo criterio de linhasDRE): nivel0 -> rot; nivel1 ->

function construirCaminhos(linhas) {
  const porCam = {}, camDeIndice = [];
  let b0 = null, n1cam = null;
  linhas.forEach((l, i) => {
    if (l.nivel === 0) { b0 = l.rot; n1cam = null; }
    if (l.nivel === 1) n1cam = `${b0}/${l.rot}`;
    const cam = l.nivel === 0 ? l.rot : l.nivel === 1 ? `${b0}/${l.rot}` : `${n1cam}/${l.rot}`;
    porCam[cam] = i; camDeIndice[i] = cam;

  return { porCam, camDeIndice };
}
function indexarCaminhos(anoDados) { return construirCaminhos(anoDados.linhas).porCam; }

  const A = H[ano];
  if (!A) return null;
  const pos = A.meses.findIndex(x => x.m === mes);
  if (pos < 0) return null;
  const idx = indexarCaminhos(A)[cam];
  if (idx === undefined) return null;
  const v = A.valores[idx][pos];
  return (v === null || v === undefined) ? null : v;
}

  const anos = Object.keys(H).filter(a => H[a].meses.length === 12).sort();

}

  const temMes = a => {

    return calcDe(mesStr + a) !== null;

    .filter(a => Number(a) < anoAlvo && temMes(a))
    .sort((a, b) => b - a)

  const anoAlvoStr = String(anoAlvo);
  const hibridoInclui = baseMode === 'hibrido' && temMes(anoAlvoStr);

  let numerador = 0, denominador = 0;
  anos.forEach(a => {
    const d = valorDe(H, CALC, cam, a, mes), r = valorDe(H, CALC, refCam, a, mes);
