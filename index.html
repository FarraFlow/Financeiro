    let soma = 0;
    filhos.forEach(camFilho => {
      const v = baseValor(H, CALC, camFilho, anoAlvo, mes, baseMode, N) * (1 + varDoSlider(camFilho, mIdx));
      set(camFilho, mIdx, v); soma += v;
    });
    set(camBloco, mIdx, soma);
  };
  const calcularDireto = (cam, mIdx, mes) => set(cam, mIdx, baseValor(H, CALC, cam, anoAlvo, mes, baseMode, N));
  /* Financeiras: valor absoluto digitado pelo usuario (juros da divida ja sao conhecidos,
     nao fazem sentido como % de variacao). Campo vazio/ausente = volta pro baseValor. */
  const valorFinanceiroFixo = (chave, mes) => {
    const v = financeiro[chave] && financeiro[chave][mes];
    return (v === null || v === undefined || v === '') ? null : Number(v);
  };
  const calcularFinanceira = (cam, chave, mIdx, mes) => {
    const fixo = valorFinanceiroFixo(chave, mes);
    if (fixo !== null && !Number.isNaN(fixo)) { set(cam, mIdx, fixo); return; }
    calcularDireto(cam, mIdx, mes);
  };
  /* variacao aplicada no nivel do bloco (nao no filho) -- usado pelos blocos "sem detalhe"
     (Receitas/Despesas Nao Operacionais), onde so existe slider do bloco inteiro */
  const calcularComSliderBloco = (camBloco, mIdx, mes) => {
    const filhos = filhosImediatos(linhas, porCam, camDeIndice, camBloco);
    const varBloco = varDoSlider(camBloco, mIdx);
    if (!filhos.length) {
      set(camBloco, mIdx, baseValor(H, CALC, camBloco, anoAlvo, mes, baseMode, N) * (1 + varBloco));
      return;
    }
    let soma = 0;
    filhos.forEach(camFilho => {
      const v = baseValor(H, CALC, camFilho, anoAlvo, mes, baseMode, N) * (1 + varBloco);
      set(camFilho, mIdx, v); soma += v;
    });
    set(camBloco, mIdx, soma);
  };
  const calcularRatioBloco = (camBloco, refCam, mIdx, mes) => {
    const filhos = filhosImediatos(linhas, porCam, camDeIndice, camBloco);
    const alvo = filhos.length ? filhos : [camBloco];
    let soma = 0;
    alvo.forEach(cam => {
      const ratio = relacaoHistorica(H, CALC, cam, refCam, anoAlvo, mes, baseMode, N);
      const v = ratio * get(refCam, mIdx);
      set(cam, mIdx, v); soma += v;
    });
    if (filhos.length) set(camBloco, mIdx, soma);
  };

  /* soma dos 3 componentes de Receita Bruta num ano historico, direto dos dados
     (nao da linha "RECEITA BRUTA" agregada, que pode nao estar populada em
     fixtures de teste -- em producao ela bate, mas nao dependemos disso). */
  const somaRBHistorico = (a, mes) => {
    const rcvA = valorDe(H, CALC, 'RECEITA BRUTA/RECEITA COM VENDAS', a, mes) || 0;
    const logA = valorDe(H, CALC, 'RECEITA BRUTA/RECEITA LOGISTICA', a, mes) || 0;
    const repA = valorDe(H, CALC, 'RECEITA BRUTA/REPASSE BEER FLOW', a, mes) || 0;
    return rcvA + logA + repA;
  };

  /* ratio historico fixo de uma categoria contra a soma dos componentes de RB
     (em vez da linha "RECEITA BRUTA" agregada -- mesmo motivo do helper acima). */
  const ratioSobreRB = (cam, mIdx, mes) => {
    const anos = anosBase(H, CALC, anoAlvo, mes, baseMode, N);
    let num = 0, den = 0;
    anos.forEach(a => { num += valorDe(H, CALC, cam, a, mes) || 0; den += somaRBHistorico(a, mes); });
    return den ? num / den : 0;
  };

  /* Receita Logistica: SEM slider proprio, mantem % fixo de Receita Bruta (nao desliza
     quando RCV muda por conta de outro slider) -- mesma solucao algebrica de sempre:
     RB = RCV + Log + Repasse, Log/RB = k (constante historica) => Log = k/(1-k)*(RCV+Repasse).
     COM slider proprio (bloco ou subcategoria), o usuario esta deliberadamente projetando
     um valor diferente pra Receita Logistica -- nesse caso a variacao do slider se aplica
     em cima dessa base "neutra" (proporcional a RB), e a razao Log/RB passa a variar,
     refletindo a decisao do usuario. Cada subcategoria recebe sua fatia da base neutra
     proporcional ao peso historico dela dentro do total de Receita Logistica. */
  const calcularReceitaLogistica = (mIdx, mes) => {
    const camBloco = 'RECEITA BRUTA/RECEITA LOGISTICA';
    const filhos = filhosImediatos(linhas, porCam, camDeIndice, camBloco);
    const k = ratioSobreRB(camBloco, mIdx, mes);
    const rcv = get('RECEITA BRUTA/RECEITA COM VENDAS', mIdx);
    const repasse = get('RECEITA BRUTA/REPASSE BEER FLOW', mIdx);
    const baseTotal = k >= 1 ? 0 : (k / (1 - k)) * (rcv + repasse);

    if (!filhos.length) {
      set(camBloco, mIdx, baseTotal * (1 + varDoSlider(camBloco, mIdx)));
      return;
    }

    const anos = anosBase(H, CALC, anoAlvo, mes, baseMode, N);
    const somaFilho = {}; let somaTotal = 0;
    filhos.forEach(f => somaFilho[f] = 0);
    anos.forEach(a => filhos.forEach(f => {
      const v = valorDe(H, CALC, f, a, mes) || 0;
      somaFilho[f] += v; somaTotal += v;
    }));

    let soma = 0;
    filhos.forEach(f => {
      const peso = somaTotal ? somaFilho[f] / somaTotal : (1 / filhos.length);
      const v = (baseTotal * peso) * (1 + varDoSlider(f, mIdx));
      set(f, mIdx, v); soma += v;
    });
    set(camBloco, mIdx, soma);
  };

  /* CUSTO COM VENDAS: todos os filhos (CMV, Taxas, Eventos) mantem % fixo da
     Receita com Vendas -- igual sempre foi. LOGISTICA e excecao: e medida como
     % da Receita Bruta (nao da RCV), entao precisa da mesma ancora fixa em RB
     usada acima -- sem isso, Log(custo)/RCV fica fixo mas Log(custo)/RB desliza
     (RB nao anda 1:1 com RCV, ja que Receita Logistica e Repasse tem dinamica
     propria). LOGISTICA nao e componente de RB (fica do lado dos custos, nao
     das receitas), entao ancorar nela nao e circular.
     DEVOLUÇÃO DE VENDAS fica de fora da projecao por decisao do usuario: sao
     estornos pontuais e irregulares, nao um custo variavel proporcional a
     receita -- projetar um % dela olhando pro historico so criaria ruido. */
  const calcularCustoComVendas = (mIdx, mes) => {
    const filhos = filhosImediatos(linhas, porCam, camDeIndice, 'CUSTO COM VENDAS');
    const rcv = get('RECEITA BRUTA/RECEITA COM VENDAS', mIdx);
    let soma = 0;
    filhos.forEach(cam => {
      const nomeFilho = cam.split('/').pop();
      if (nomeFilho === 'DEVOLUÇÃO DE VENDAS') { set(cam, mIdx, 0); return; }
      const ehLogistica = nomeFilho === 'LOGÍSTICA';
      const v = ehLogistica
        ? ratioSobreRB(cam, mIdx, mes) * (get('RECEITA BRUTA', mIdx))
        : relacaoHistorica(H, CALC, cam, 'RECEITA BRUTA/RECEITA COM VENDAS', anoAlvo, mes, baseMode, N) * rcv;
      set(cam, mIdx, v); soma += v;
    });
    set('CUSTO COM VENDAS', mIdx, soma);
  };

  meses.forEach((mesInfo, mIdx) => {
    const mes = mesInfo.m;
    /* mes ja ocorrido: copia o real do historico e ignora base/sliders -- o dado ja aconteceu */
    if (mesInfo.real) {
      linhas.forEach((_, i) => {
        valores[i][mIdx] = valorDe(H, CALC, camDeIndice[i], String(anoAlvo), mes) ?? null;
      });
      return;
    }
    calcularComSlider('RECEITA BRUTA/RECEITA COM VENDAS', mIdx, mes);
    calcularDireto('RECEITA BRUTA/REPASSE BEER FLOW', mIdx, mes);
    calcularReceitaLogistica(mIdx, mes);
    set('RECEITA BRUTA', mIdx, get('RECEITA BRUTA/RECEITA COM VENDAS', mIdx) + get('RECEITA BRUTA/RECEITA LOGISTICA', mIdx) + get('RECEITA BRUTA/REPASSE BEER FLOW', mIdx));

    calcularRatioBloco('DEDUÇÕES DA RECEITA BRUTA', 'RECEITA BRUTA', mIdx, mes);
    const receitaLiquida = get('RECEITA BRUTA', mIdx) - get('DEDUÇÕES DA RECEITA BRUTA', mIdx);
    set('RECEITA LÍQUIDA', mIdx, receitaLiquida);

    calcularCustoComVendas(mIdx, mes);
    const resultadoBruto = receitaLiquida - get('CUSTO COM VENDAS', mIdx);
    set('RESULTADO BRUTO', mIdx, resultadoBruto);
    set('MARGEM BRUTA', mIdx, receitaLiquida ? resultadoBruto / receitaLiquida : 0);

    calcularComSlider('DESPESAS OPERACIONAIS', mIdx, mes);
    const resultadoOperacional = resultadoBruto - get('DESPESAS OPERACIONAIS', mIdx);
    set('RESULTADO OPERACIONAL', mIdx, resultadoOperacional);
    set('MARGEM OPERACIONAL', mIdx, receitaLiquida ? resultadoOperacional / receitaLiquida : 0);

    calcularFinanceira('RESULTADO FINANCEIRO/DESPESAS FINANCEIRAS', 'despesas', mIdx, mes);
    calcularFinanceira('RESULTADO FINANCEIRO/RECEITAS FINANCEIRAS', 'receitas', mIdx, mes);
    const resultadoFinanceiro = get('RESULTADO FINANCEIRO/RECEITAS FINANCEIRAS', mIdx) - get('RESULTADO FINANCEIRO/DESPESAS FINANCEIRAS', mIdx);
    set('RESULTADO FINANCEIRO', mIdx, resultadoFinanceiro);

    calcularComSliderBloco('RECEITAS NÃO OPERACIONAIS', mIdx, mes);
    calcularComSliderBloco('DESPESAS NÃO OPERACIONAIS', mIdx, mes);

    const resultadoExercicio = resultadoOperacional + resultadoFinanceiro + get('RECEITAS NÃO OPERACIONAIS', mIdx) - get('DESPESAS NÃO OPERACIONAIS', mIdx);
    set('RESULTADO DO EXERCÍCIO', mIdx, resultadoExercicio);
    set('MARGEM LÍQUIDA', mIdx, receitaLiquida ? resultadoExercicio / receitaLiquida : 0);
  });

  linhas.forEach((l, i) => {
    const casas = l.tipo === 'pct' ? 6 : 2;
    valores[i] = valores[i].map(x => (x === null ? null : Math.round(x * 10 ** casas) / 10 ** casas));
  });

  return { ano: anoAlvo, meses, linhas, valores, mesesReais: meses.filter(x => x.real).map(x => x.m) };
}

/* ===================== DRE Projetado: cenarios (Google Drive via Apps Script) =====================
   Os cenarios ficam numa pasta compartilhada do Drive (um .json por cenario), entao
   todo mundo que abre o dashboard ve a mesma lista. O acesso passa por um Apps Script
   publicado como App da Web -- ver apps_script/Codigo.gs para o codigo e as instrucoes
   de publicacao. Sem rede, listar devolve [] e salvar/excluir lancam erro pra UI avisar;
   nao ha fallback silencioso pro localStorage (evita duas fontes de verdade divergindo). */
let CENARIOS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxWyM90p_9wc5fC5IsWirbu7Uj4bRhwITVEdoHuSlQsEoMTvVIWhsNdikEmmUyUfjU1/exec';

/* setter exposto pra permitir configurar/trocar a URL sem editar o codigo-fonte
   (usado pelos testes; em producao o valor padrao acima e o que vale). */
function definirCenariosWebappUrl(url) { CENARIOS_WEBAPP_URL = url; }

/* "ultimo cenario aberto" continua local: e conveniencia de sessao desta pessoa
   (lembrar o que estava aberto ao recarregar), nao faz sentido compartilhar. */
const CHAVE_ULTIMO = 'dreProjetado.ultimoAberto';

function cenariosConfigurado() {
  return typeof CENARIOS_WEBAPP_URL === 'string' && CENARIOS_WEBAPP_URL.indexOf('http') === 0;
}

async function listarCenarios() {
  if (!cenariosConfigurado()) return [];
  try {
    const r = await fetch(CENARIOS_WEBAPP_URL + '?acao=listar', { method: 'GET' });
    const dados = await r.json();
    return dados && dados.ok ? (dados.cenarios || []) : [];
  } catch {
    return []; // sem rede: lista vazia, a UI mostra o aviso
  }
}

/* text/plain de proposito: com application/json o navegador manda um preflight
   OPTIONS que o Apps Script nao responde, e a requisicao morre no CORS. */
async function postCenario(corpo) {
  if (!cenariosConfigurado()) throw new Error('URL do Apps Script nao configurada em CENARIOS_WEBAPP_URL');
  const r = await fetch(CENARIOS_WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(corpo)
  });
  const dados = await r.json();
  if (!dados || !dados.ok) throw new Error((dados && dados.erro) || 'falha ao gravar no Drive');
  return dados.cenarios || [];
}

async function salvarCenario(nome, config) {
  return postCenario({ acao: 'salvar', nome, config });
}
async function excluirCenario(nome) {
  return postCenario({ acao: 'excluir', nome });
}
async function carregarCenario(nome) {
  const lista = await listarCenarios();
  return lista.find(c => c.nome === nome) || null;
}

/* ---------- cache sincrono ----------
   render() monta o HTML da pagina inteira de uma vez, de forma sincrona -- nao
   da pra fazer `await listarCenarios()` no meio dela. cenariosHTML() por isso
   le de um cache local, atualizado em segundo plano por atualizarCenariosCache():
   a tela aparece com o que tiver (mesmo vazio, na primeira visita) e, quando a
   resposta do Drive chega, um novo render() reflete a lista atualizada. */
let _cenariosCache = [];
let _cenariosCacheErro = null;

function cenariosCacheAtual() { return _cenariosCache; }
function cenariosErroAtual() { return _cenariosCacheErro; }

async function atualizarCenariosCache() {
  if (!cenariosConfigurado()) { _cenariosCacheErro = 'URL do Apps Script não configurada'; return; }
  try {
    const r = await fetch(CENARIOS_WEBAPP_URL + '?acao=listar', { method: 'GET' });
    const dados = await r.json();
    if (dados && dados.ok) {
      _cenariosCache = dados.cenarios || [];
      _cenariosCacheErro = null;
    } else {
      _cenariosCacheErro = (dados && dados.erro) || 'falha ao carregar cenários';
      // mantem o cache anterior -- um erro passageiro nao deve apagar a lista da tela
    }
  } catch (err) {
    _cenariosCacheErro = String(err && err.message || err);
  }
}

/* versao sincrona de nomeCenarioAtivo(), usada por cenariosHTML() dentro do render() */
function nomeCenarioAtivoCache(storage = localStorage) {
  const nome = storage.getItem(CHAVE_ULTIMO);
  if (!nome) return '';
  return _cenariosCache.some(c => c.nome === nome) ? nome : '';
}

function salvarUltimoAberto(nome, storage = localStorage) { storage.setItem(CHAVE_ULTIMO, nome); }
async function ultimoAbertoCenario(storage = localStorage) {
  const nome = storage.getItem(CHAVE_ULTIMO);
  return nome ? await carregarCenario(nome) : null;
}

/* Helpers novos: blocos recolhidos + cenario ativo */
function nomesBlocosSliders() {
  return [
    'RECEITA BRUTA/RECEITA COM VENDAS',
    'RECEITA BRUTA/RECEITA LOGISTICA',
    'DESPESAS OPERACIONAIS',
    'NÃO OPERACIONAIS'
  ];
}

/* bloco financeiro (Resultado Financeiro) usa o mesmo mecanismo de recolher/expandir
   dos blocos de slider, mas nao tem slider -- fica de fora de nomesBlocosSliders() pra
   nao contaminar os testes que contam "blocos com %" */
const BLOCO_FINANCEIRO = 'RESULTADO FINANCEIRO';
function nomesBlocosProjecao() {
  return [...nomesBlocosSliders(), BLOCO_FINANCEIRO];
}

function blocosRecolhidos(cfg) {
  const todos = new Set(nomesBlocosProjecao());
  if (!cfg.hasOwnProperty('recolhidos')) return todos; // default: todos recolhidos
  const explicit = cfg.recolhidos || [];
  if (explicit.length === 0) return new Set(); // [] explicit = nada recolhido
  return new Set(explicit.filter(b => todos.has(b)));
}

/* Alterna um bloco partindo do estado REALMENTE renderizado (blocosRecolhidos),
   nao de cfg.recolhidos cru -- na primeira abertura esse campo e undefined e ler
   ele direto faria o clique num bloco expandir todos os outros junto. */
function alternarBloco(cfg, bloco) {
  const atual = blocosRecolhidos(cfg);
  atual.has(bloco) ? atual.delete(bloco) : atual.add(bloco);
  return [...atual];
}

async function nomeCenarioAtivo(storage = localStorage) {
  const nome = storage.getItem(CHAVE_ULTIMO);
  if (!nome) return '';
  const c = await carregarCenario(nome);
  return c ? nome : '';
}

function limparUltimoAberto(storage = localStorage) {
  storage.removeItem(CHAVE_ULTIMO);
}

/* ===================== agregação do DRE ===================== */
function agregar(p, fonte = H) {
  if (!p || !p.comps.length) return null;
  const A = fonte[p.ano];
  const idx = p.comps.map(c => A.meses.findIndex(m => m.comp === c)).filter(i => i >= 0);
  const soma = A.valores.map(v => { let s = null;
    idx.forEach(i => { if (v[i] !== null && v[i] !== undefined) s = (s || 0) + v[i]; }); return s; });
  const pega = ch => { const k = A.linhas.findIndex(l => l.rot === ch); return k < 0 ? null : soma[k]; };
  const rl = pega(CH.rl);
  const REC = { 'MARGEM BRUTA': CH.rbr, 'MARGEM OPERACIONAL': CH.rop, 'MARGEM LÍQUIDA': CH.rex, 'MARGEM LIQUIDA': CH.rex };
  const val = A.linhas.map((l, i) => {
    if (l.tipo !== 'pct') return soma[i];
    const b = REC[l.rot.toUpperCase()];
    if (!b || !rl) return null;
    const r = pega(b); return r === null ? null : r / rl;
  });
  // indice por caminho: evita casar pelo nome quando mae e filha se chamam igual
  const porCaminho = {}; let b0 = null, n1 = null;
  A.linhas.forEach((l, i) => {
    if (l.nivel === 0) { b0 = l.rot; n1 = null; }
    if (l.nivel === 1) n1 = l.rot;
    const cam = l.nivel === 0 ? l.rot : l.nivel === 1 ? b0 + '/' + l.rot : b0 + '/' + n1 + '/' + l.rot;
    if (!(cam in porCaminho)) porCaminho[cam] = val[i];
  });
  return { linhas: A.linhas, val, porCaminho, ano: p.ano, comps: p.comps, nome: p.nome, tipo: p.tipo,
    v: ch => { const k = A.linhas.findIndex(l => l.rot === ch); return k < 0 ? null : val[k]; },
    vc: cam => (cam in porCaminho) ? porCaminho[cam] : null };
}

/* nível 3: só dos meses processados pelo pipeline */
function nivel3De(comps) {
  const out = {};
  comps.forEach(c => {
    const m = calcDe(c); if (!m) return;
    ['deducoes_det', 'custo_det', 'opex_det', 'dfin_det', 'dnop_det'].forEach(k => {
      Object.entries(m.atual[k] || {}).forEach(([n1, d1]) =>
        Object.entries(d1.filhos || {}).forEach(([n2, d2]) => {
          const f = d2.filhos || {};
          if (!Object.keys(f).length) return;
          out[n1] = out[n1] || {}; out[n1][n2] = out[n1][n2] || {};
          Object.entries(f).forEach(([n3, v]) => out[n1][n2][n3] = (out[n1][n2][n3] || 0) + v);
        }));
    });
  });
  return out;
}

/* ===================== análise vertical ===================== */
/* Receitas: mãe sobre receita bruta, filha sobre a mãe.
   Custo com vendas: bloco e filhas sobre receita com vendas; logística sobre resultado bruto.
   Demais: bloco e nível 1 sobre receita bruta. Níveis mais fundos não têm AV. */
function baseAV(l, ctx, agg, valPai1) {
  if (l.tipo === 'pct') return null;
  if (l.rot === CH.rb) return null;
  const rb = agg.v(CH.rb), rcv = agg.v(CH.rcv);
  if (ctx.b0 === CH.rb) {
    if (l.nivel === 1) return rb;
    if (l.nivel === 2) return valPai1;
    return null;
  }
  if (ctx.b0 === CH.ccv) {
    if (l.nivel === 0) return rcv;
    if (l.nivel === 1) return l.rot === 'LOGÍSTICA' ? rb : rcv;
    return null;
  }
  if (l.nivel <= 1) return rb;
  return null;
}

/* litros vendidos + pedidos de um período: meses com dre_MMAAAA.json (CALC)
   trazem os dois; meses so cobertos pela planilha manual Litragem.xlsx
   (historico.litros, injetada por litragem.py) trazem so litros -- pedidos
   fica sem dado nesses casos, nunca vira 0 disfarçado de valor real.
   recCalc soma a receita com vendas SO dos meses com pedidos (pra calcular
   ticket medio com numerador e denominador do mesmo escopo -- misturar com
   a receita do periodo inteiro infla o ticket quando o periodo tem meses
   sem contagem de pedidos). */
function litrosPeriodo(p) {
  const A = H[p.ano];
  let lit = 0, temLit = false, ped = 0, temPed = false, recCalc = 0;
  p.comps.forEach(c => {
    const cal = calcDe(c);
    if (cal) {
      lit += cal.atual.litros; ped += cal.atual.pedidos; temLit = true; temPed = true;
      recCalc += Object.values(cal.atual.receita_vendas).reduce((q, w) => q + w, 0);
      return;
    }
    if (!A || !A.litros) return;
    const i = A.meses.findIndex(m => m.comp === c);
    const v = i >= 0 ? A.litros[i] : null;
    if (v !== null && v !== undefined) { lit += v; temLit = true; }
  });
  return { lit, ped, temLit, temPed, recCalc };
}

/* ===================== KPIs ===================== */
function kpis(p) {
  const a = agregar(p), ant = agregar(periodoAnterior(p));
  const g = (x, ch) => x ? x.v(ch) : null;
  const rl = g(a, CH.rl);
  const mg = (x, ch) => { const r = g(x, ch), l = g(x, CH.rl); return l ? r / l : null; };
  const dl = (x, y) => (y ? ((x - y) / Math.abs(y)) * 100 : null);
  const seta = d => d === null ? '<span class="av">sem base</span>'
    : `<span class="delta ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(1)}%</span> vs ${esc(ant.nome)}`;
  const sem = (at, ref, maior = true) => (ref === null || !isFinite(ref) || ref === 0) ? ''
    : ((maior ? at - ref : ref - at) >= 0 ? 'v' : (Math.abs((at - ref) / ref) <= 0.10 ? 'a' : 'r'));

  const cards = [
    { r: 'Receita bruta', ic: 'ic-receita', v: Mk(g(a, CH.rb)), full: R$0(g(a, CH.rb)), s: seta(ant ? dl(g(a, CH.rb), g(ant, CH.rb)) : null), c: sem(g(a, CH.rb), g(ant, CH.rb)) },
    { r: 'Resultado bruto', ic: 'ic-resultado', v: Mk(g(a, CH.rbr)), full: R$0(g(a, CH.rbr)), s: `Margem ${P(mg(a, CH.rbr))}`, c: sem(mg(a, CH.rbr), mg(ant, CH.rbr)) },
    { r: 'Resultado operacional', ic: 'ic-resultado', v: Mk(g(a, CH.rop)), full: R$0(g(a, CH.rop)), s: `Margem ${P(mg(a, CH.rop))}`, c: sem(mg(a, CH.rop), mg(ant, CH.rop)) },
    { r: 'Resultado do exercício', ic: 'ic-margem', v: Mk(g(a, CH.rex)), full: R$0(g(a, CH.rex)), s: `Margem líquida ${P(mg(a, CH.rex))}`, c: g(a, CH.rex) < 0 ? 'r' : sem(mg(a, CH.rex), mg(ant, CH.rex)) }
  ];
  const { lit, ped, temLit, temPed, recCalc } = litrosPeriodo(p);
  if (temLit) {
    const rec = g(a, CH.rcv) || 0;
    const cmv = g(a, CH.cmv) || 0;
    cards.push({ r: 'Litros vendidos', ic: 'ic-litros', v: N(lit) + ' L',
      s: temPed ? `${N(ped)} pedidos · ticket ${R$(ped ? recCalc / ped : 0)}` : 'Sem dados de pedidos no período', c: '' });
    cards.push({ r: 'Spread por litro', ic: 'ic-margem', v: R$(lit ? (rec - cmv) / lit : 0), s: `Preço ${R$(lit ? rec / lit : 0)} · CMV ${R$(lit ? cmv / lit : 0)}`, c: '',
      dica: 'Receita com vendas menos CMV, dividido pelos litros vendidos no período selecionado.' });
  }
  return `<div class="kpis k${cards.length}">${cards.map(k => `<div class="kpi ${k.c}"${k.dica ? ` title="${esc(k.dica)}"` : ''}>
    <div class="ic-rot"><div class="ic-chip">${ic(k.ic)}</div><div class="rot">${k.r}</div></div>
    <div class="val"${k.full ? ` title="${esc(k.full)}"` : ''}>${k.v}</div><div class="sub">${k.s}</div></div>`).join('')}</div>`;
}

/* ===================== cascata ===================== */
function cascata(p) {
  const a = agregar(p), ant = agregar(periodoAnterior(p));
  const g = (x, ch) => (x ? x.v(ch) : null) || 0;
  const rb = g(a, CH.rb), rcv = g(a, CH.rcv), rbr = g(a, CH.rbr);
  const rfin = a.v(CH.rfin) !== null ? a.v(CH.rfin) : (g(a, 'RECEITAS FINANCEIRAS') - g(a, 'DESPESAS FINANCEIRAS'));

  const passos = [
    { n: 'Receita bruta', v: rb, t: 'base', base: null, ch: CH.rb },
    { n: 'Deduções', v: -g(a, CH.ded), t: 'neg', base: rb, ch: CH.ded },
    { n: 'Receita líquida', v: g(a, CH.rl), t: 'sub', base: rb, ch: CH.rl },
    { n: 'CMV', v: -g(a, CH.cmv), t: 'neg', base: rcv, ch: CH.cmv },
    { n: 'Outros custos', v: -(g(a, CH.ccv) - g(a, CH.cmv)), t: 'neg', base: rcv, ch: null },
    { n: 'Resultado bruto', v: rbr, t: 'sub', base: rb, ch: CH.rbr },
    { n: 'Despesas operacionais', v: -g(a, CH.dop), t: 'neg', base: rb, ch: CH.dop },
    { n: 'Resultado operacional', v: g(a, CH.rop), t: 'sub', base: rb, ch: CH.rop },
    { n: 'Resultado financeiro', v: rfin, t: rfin >= 0 ? 'pos' : 'neg', base: rb, ch: CH.rfin },
    { n: 'Não operacional', v: g(a, 'RECEITAS NÃO OPERACIONAIS') - g(a, 'DESPESAS NÃO OPERACIONAIS'), t: 'neg', base: rb, ch: null },
    { n: 'Resultado do exercício', v: g(a, CH.rex), t: 'fim', base: rb, ch: CH.rex }
  ];
  const max = rb || 1; let cur = 0;
  const linhas = passos.map(s => {
    let ini, fim;
    if (['base', 'sub', 'fim'].includes(s.t)) { ini = 0; fim = s.v; cur = s.v; }
    else { ini = cur + Math.min(s.v, 0); fim = cur + Math.max(s.v, 0); cur += s.v; }
    const l = Math.max(0, Math.min(ini, fim)) / max * 100;
    const w = Math.max(Math.abs(fim - ini) / max * 100, 0.4);
    const cor = s.t === 'base' ? CORES.laranja : s.t === 'neg' ? CORES.bordo
      : s.t === 'fim' ? (s.v >= 0 ? CORES.verde : CORES.bordo) : CORES.azul;
    const forte = ['base', 'sub', 'fim'].includes(s.t);
    const av = s.base ? s.v / s.base : null;
    let dh = null, bom = 1;
    if (ant && s.ch) { const x = ant.v(s.ch);
      if (x) { dh = (Math.abs(s.v) - Math.abs(x)) / Math.abs(x); bom = s.t === 'neg' ? -1 : 1; } }
    return `<div class="l ${s.t === 'fim' ? 'tot' : ''}">
      <div class="nm ${forte ? 'forte' : ''}">${s.n}</div>
      <div class="tr"><div class="br" style="transform:translateX(${l}%) scaleX(${w / 100});background:${cor};opacity:${s.t === 'sub' ? .82 : 1}"></div></div>
      <div class="vl" style="${s.t === 'fim' ? 'font-weight:600;color:' + (s.v >= 0 ? CORES.verde : CORES.bordo) : ''}">${M(s.t === 'neg' ? Math.abs(s.v) : s.v)}</div>
      <div class="vl av">${av === null ? '—' : P(Math.abs(av))}</div>
      <div class="vl ${dh === null ? 'av' : (dh * bom >= 0 ? 'up' : 'down')}">${dh === null ? '—' : (dh >= 0 ? '+' : '') + (dh * 100).toFixed(1) + '%'}</div>
    </div>`;
  }).join('');
  return `<div class="card"><h2><span class="ic-chip">${ic('ic-cascata')}</span>Da receita ao resultado</h2>
    <div class="leg">Cada barra parte de onde a anterior terminou. Laranja entra, bordô sai, azul é subtotal.
      AV segue a base de cada linha; Δ compara com ${esc(ant ? ant.nome : 'o período anterior')}.</div>
    <div class="casc"><div class="l cab"><div class="nm"></div><div class="tr"></div>
      <div class="vl">Valor</div><div class="vl">AV</div><div class="vl">Δ ${esc(ant ? ant.nome : '')}</div></div>${linhas}</div>${ponte(p)}</div>`;
}


/* decomposicao da variacao do resultado, em duas listas ordenadas por impacto */
function ponte(p) {
  const a = agregar(p), b = agregar(periodoAnterior(p));
  if (!b) return '';
  const g = (x, ch) => (x ? x.v(ch) : null) || 0;
  const rfin = x => x.v(CH.rfin) !== null ? x.v(CH.rfin) : (g(x, 'RECEITAS FINANCEIRAS') - g(x, 'DESPESAS FINANCEIRAS'));
  const naoOp = x => g(x, 'RECEITAS NÃO OPERACIONAIS') - g(x, 'DESPESAS NÃO OPERACIONAIS');
  const outros = x => g(x, CH.ccv) - g(x, CH.cmv);

  /* Regra geral: despesa/custo sempre em magnitude positiva (sobe = atrapalha, desce = ajuda).
     Receita sempre em magnitude positiva (sobe = ajuda, desce = atrapalha).
     Só a linha final do topo (ini -> fim) segue o sinal natural do resultado. */
  const item = (n, tipo, antes, depois) => {
    const delta = depois - antes;
    const bom = tipo === 'custo' ? delta <= 0 : delta >= 0;
    return { n, antes, depois, delta, bom, efeito: Math.abs(delta) };
  };
  /* Resultado financeiro e não operacional são receita-menos-despesa: quando o saldo é
     negativo nos dois períodos comparados, tratamos como despesa líquida (magnitude
     positiva); quando positivo nos dois, como receita líquida. Se cruzar zero, mantém
     o valor com sinal (caso raro). */
  const composto = (n, antesRaw, depoisRaw) => {
    if (antesRaw <= 0 && depoisRaw <= 0) return item(n, 'custo', -antesRaw, -depoisRaw);
    if (antesRaw >= 0 && depoisRaw >= 0) return item(n, 'receita', antesRaw, depoisRaw);
    return item(n, 'receita', antesRaw, depoisRaw);  // sinal cruzou zero: mantém natural
  };

  const ini = g(b, CH.rex), fim = g(a, CH.rex), dif = fim - ini;
  const ef = [
    item('Receita bruta', 'receita', g(b, CH.rb), g(a, CH.rb)),
    item('Deduções', 'custo', g(b, CH.ded), g(a, CH.ded)),
    item('CMV', 'custo', g(b, CH.cmv), g(a, CH.cmv)),
    item('Outros custos de venda', 'custo', outros(b), outros(a)),
    item('Despesas operacionais', 'custo', g(b, CH.dop), g(a, CH.dop)),
    composto('Resultado financeiro', rfin(b), rfin(a)),
    composto('Não operacional', naoOp(b), naoOp(a))
  ].filter(e => e.efeito > 0.005);
  const resid = dif - ef.reduce((s, e) => s + (e.bom ? e.efeito : -e.efeito), 0);
  if (Math.abs(resid) > 0.01) ef.push({ n: 'Outros', antes: null, depois: null,
    delta: resid, bom: resid >= 0, efeito: Math.abs(resid) });

  const max = Math.max(...ef.map(e => e.efeito), 1);
  const grad = { verde: 'linear-gradient(90deg,#3F9142,#8FE07A)', bordo: 'linear-gradient(90deg,#B23A44,#FF6E79)' };
  const lista = (titulo, itens, cor, key) => !itens.length ? '' : `<div class="lado">
    <h4>${titulo}</h4>${itens.map(e => `<div class="li">
      <div class="nm">${esc(e.n)}${e.antes === null ? '' :
        `<span class="de-para">${M(e.antes)} → ${M(e.depois)}</span>`}</div>
      <div class="tr"><div class="br brilho" style="transform:scaleX(${Math.max(e.efeito / max, .015)}) translateZ(0);background:${grad[key]}"></div></div>
      <div class="vl" style="color:${cor}">${e.delta >= 0 ? '+' : '−'}${R$(Math.abs(e.delta))}</div>
    </div>`).join('')}</div>`;
  const bons = ef.filter(e => e.bom).sort((x, y) => y.efeito - x.efeito);
  const maus = ef.filter(e => !e.bom).sort((x, y) => y.efeito - x.efeito);

  return `<div class="ponte">
    <div class="ponte-cab"><h3>O que explica a variação do resultado</h3>
      <span class="${dif >= 0 ? 'up' : 'down'}">${dif >= 0 ? '+' : '−'}${R$(Math.abs(dif))} contra ${esc(b.nome)}</span></div>
    <div class="ponte-sub">${R$(ini)} em ${esc(b.nome)} → ${R$(fim)} em ${esc(a.nome)}.
      Despesa que sobe atrapalha, que desce ajuda; receita segue o inverso — o valor de
      cada item já vem nesse sentido.</div>
    <div class="ponte-cols">${lista('Ajudou', bons, CORES.verde, 'verde')}${lista('Atrapalhou', maus, CORES.bordo, 'bordo')}</div></div>`;
}

/* ===================== evolução ===================== */
function evolucao(p) {
  const fim = posDe(p.comps[p.comps.length - 1]);
  const S = TODOS.slice(Math.max(0, fim - 11), fim + 1).map(t => {
    const a = agregar(periodoDe(t.comp, 'mes'));
    return { rot: t.rot, rb: a.v(CH.rb) || 0, rex: a.v(CH.rex) || 0, dentro: p.comps.includes(t.comp) };
  });
  if (S.length < 2) return `<div class="card"><h2><span class="ic-chip">${ic('ic-resultado')}</span>Evolução</h2><div class="leg">Sem base suficiente.</div></div>`;
  window.__EVO = S;
  return `<div class="card"><h2><span class="ic-chip">${ic('ic-resultado')}</span>Evolução — últimos ${S.length} meses</h2>
    <div class="leg">Barra: receita bruta. Linha: resultado do exercício. Em destaque, os meses do período selecionado.
      Passe o mouse para ver os valores.</div>
    <div class="grafico" id="wrapEvo"><div class="dica" id="dicaEvo"></div></div></div>`;
}

/* desenha o SVG com o viewBox casando 1:1 com a largura real em tela, para o texto
   nao encolher junto com a geometria em telas estreitas */
function desenharEvolucao() {
  const wrap = document.getElementById('wrapEvo');
  if (!wrap || !window.__EVO) return;
  const S = window.__EVO;
  const W = Math.max(280, Math.round(wrap.clientWidth));
  const estreito = W < 520;
  const Ht = estreito ? 210 : 270;
  const ml = estreito ? 50 : 74, mr = 10, mt = 16, mb = estreito ? 28 : 34;
  const iw = W - ml - mr, ih = Ht - mt - mb;
  const vals = S.flatMap(m => [m.rb, m.rex, 0]);
  const hi = Math.max(...vals), lo = Math.min(...vals);
  const y = v => mt + ih - ((v - lo) / ((hi - lo) || 1)) * ih;
  const bw = iw / S.length;
  const fEixo = estreito ? 9.5 : 12, fForte = estreito ? 9.5 : 12.5;
  const gy = [...new Set([hi, (hi + lo) / 2, 0, lo])].map(v =>
    `<line x1="${ml}" y1="${y(v)}" x2="${W - mr}" y2="${y(v)}" stroke="${v === 0 ? '#3E5B62' : '#1C2E33'}"/>
     <text class="eixo" style="font-size:${fEixo}px" x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${Mk(v)}</text>`).join('');
  const barras = S.map((m, i) => { const x = ml + i * bw + bw * .2, w = bw * .6, y0 = y(0), y1 = y(m.rb);
    return `<rect class="barra-evo" style="animation-delay:${i * 22}ms; transform-origin:${x + w / 2}px ${y0}px"
      x="${x}" y="${Math.min(y0, y1)}" width="${w}" height="${Math.abs(y0 - y1)}"
      fill="${CORES.laranja}" opacity="${m.dentro ? 1 : .68}" rx="2"/>`; }).join('');
  const pts = S.map((m, i) => [ml + i * bw + bw / 2, y(m.rex)]);
  const linha = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const pontos = pts.map((q, i) => `<circle class="ponto-evo" style="animation-delay:${240 + i * 22}ms" cx="${q[0]}" cy="${q[1]}" r="${estreito ? 3 : 4}" fill="${S[i].rex >= 0 ? CORES.verde : CORES.bordo}" stroke="#0A141C" stroke-width="1.5"/>`).join('');
  const passoRot = estreito && S.length > 8 ? 2 : 1;   // pula meses no eixo se apertado
  const rots = S.map((m, i) => i % passoRot !== 0 ? '' :
    `<text class="eixo forte" style="font-size:${fForte}px" x="${ml + i * bw + bw / 2}" y="${Ht - (estreito ? 8 : 11)}" text-anchor="middle">${esc(m.rot)}</text>`).join('');
  const alvos = S.map((m, i) => `<rect class="alvo" x="${ml + i * bw}" y="${mt}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}"/>`).join('');
  const guia = `<line id="guia" x1="0" y1="${mt}" x2="0" y2="${mt + ih}" stroke="${CORES.azul}" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
  window.__EVO_PTS = S.map((m, i) => ({ ...m, x: ml + i * bw + bw / 2 }));
  wrap.innerHTML = `<svg id="svgEvo" width="${W}" height="${Ht}" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Evolução mensal">
      ${gy}${barras}<path class="linha-evo" d="${linha}" fill="none" stroke="${CORES.azul}" stroke-width="2.4"/>${pontos}${guia}${rots}${alvos}</svg>
    <div class="dica" id="dicaEvo"></div>`;
  ligarEvolucao();
}

let __evoPin = null;   // indice do mes fixado por clique; sobrevive a redesenhos (resize)
function ligarEvolucao() {
  const svg = document.getElementById('svgEvo'), dica = document.getElementById('dicaEvo');
  if (!svg || !dica || !window.__EVO_PTS) return;
  const guia = document.getElementById('guia');
  const vb = svg.viewBox.baseVal;
  const mostrar = i => {
    const d = window.__EVO_PTS[i]; if (!d) return;
    const preso = __evoPin === i;
    dica.innerHTML = `<b>${esc(d.rot)}${preso ? ' <span style="color:var(--cinza-c);font-weight:400">· fixado</span>' : ''}</b>
      <span><i style="background:${CORES.laranja}"></i>Receita bruta<em>${R$(d.rb)}</em></span>
      <span><i style="background:${d.rex >= 0 ? CORES.verde : CORES.bordo}"></i>Resultado<em>${R$(d.rex)}</em></span>`;
    const r = svg.getBoundingClientRect();
    const px = (d.x / vb.width) * r.width;
    dica.style.left = Math.min(Math.max(px, 90), r.width - 90) + 'px';
    dica.style.opacity = 1;
    guia.setAttribute('x1', d.x); guia.setAttribute('x2', d.x); guia.setAttribute('opacity', .7);
    guia.setAttribute('stroke-dasharray', preso ? 'none' : '3 3');
  };
  if (__evoPin !== null && window.__EVO_PTS[__evoPin]) mostrar(__evoPin);
  svg.querySelectorAll('.alvo').forEach(el => {
    el.addEventListener('mouseenter', () => mostrar(+el.dataset.i));
    el.addEventListener('click', () => {
      const i = +el.dataset.i;
      __evoPin = __evoPin === i ? null : i;
      __evoPin === null ? mostrar(i) : mostrar(__evoPin);
    });
  });
  svg.addEventListener('mouseleave', () => {
    if (__evoPin !== null) { mostrar(__evoPin); return; }
    dica.style.opacity = 0; guia.setAttribute('opacity', 0);
  });
}

/* ===================== saídas até o resultado operacional ===================== */
function saidas(p) {
  const a = agregar(p); if (!a) return '';
  const PAIS = [CH.ded, CH.ccv, CH.dop];
  const bl = []; let pai = null;
  a.linhas.forEach((l, k) => {
    const v = a.val[k];
    if (l.nivel === 0) pai = PAIS.includes(l.rot) ? l.rot : null;
    if (l.nivel === 1 && pai && Math.abs(v || 0) > 0) bl.push({ g: l.rot, pai, v: Math.abs(v) });
  });
  if (!bl.length) return '';
  bl.sort((x, y) => y.v - x.v);
  const tot = bl.reduce((s, x) => s + x.v, 0);
  const max = bl[0].v;
  const rb = a.v(CH.rb) || 0, rop = a.v(CH.rop) || 0;
  const cor = q => q === CH.ded ? 'linear-gradient(90deg,#B8892E,#FFD37A)'
              : q === CH.ccv ? 'linear-gradient(90deg,#C23B3B,#FF6F61)'
              : 'linear-gradient(90deg,#D9701D,#FFA24D)';
  const linhas = bl.map(b => `<div class="li"><div>
      <div class="nm"><span>${esc(b.g)}</span><span style="color:var(--cinza);font-family:'IBM Plex Mono',monospace">${R$(b.v)}</span></div>
      <div class="tr"><div class="br brilho" style="transform:scaleX(${Math.max(b.v / max, .006)}) translateZ(0);background:${cor(b.pai)};opacity:.92"></div></div>
    </div><div class="pc">${P(b.v / tot)}</div></div>`).join('');
  return `<div class="card"><h2><span class="ic-chip">${ic('ic-saidas')}</span>Para onde vai o dinheiro</h2>
    <div class="leg">Tudo que sai entre a receita bruta e o resultado operacional: deduções, custos com vendas e despesas operacionais.
      Não inclui resultado financeiro nem não operacional.</div>
    <div class="tot-bar"><span>Total das saídas</span><b>${R$(tot)}</b></div>
    <div class="tot-sub">${R$(rb)} de receita bruta − ${R$(tot)} = ${R$(rop)} de resultado operacional</div>
    <div class="bh">${linhas}</div>
    <div class="tags"><span><i class="sem" style="background:#FFD37A"></i>Deduções</span>
      <span><i class="sem" style="background:#FF6F61"></i>Custo com vendas</span>
      <span><i class="sem" style="background:#FFA24D"></i>Despesas operacionais</span></div></div>`;
  return `<div class="card"><h2>Para onde vai o dinheiro</h2>
    <div class="leg">Tudo que sai entre a receita bruta e o resultado operacional: deduções, custos com vendas e despesas operacionais.
      Não inclui resultado financeiro nem não operacional.</div>
    <div class="tot-bar"><span>Total das saídas</span><b>${R$(tot)}</b></div>
    <div class="tot-sub">${R$(rb)} de receita bruta − ${R$(tot)} = ${R$(rop)} de resultado operacional</div>
    <div class="bh">${linhas}</div>
    <div class="tags"><span><i class="sem" style="background:${CORES.ouro}"></i>Deduções</span>
      <span><i class="sem" style="background:${CORES.azul}"></i>Custo com vendas</span>
      <span><i class="sem" style="background:${CORES.laranja}"></i>Despesas operacionais</span></div></div>`;
}

/* ===================== canais ===================== */
function canais(p) {
  const cs = p.comps.map(calcDe).filter(Boolean);
  if (!cs.length) return '';
  const acc = {}; const fora = new Set();
  cs.forEach(c => { (c.atual.grupos_custo || []).forEach(g => fora.add(g));
    Object.entries(c.atual.margem_por_grupo).forEach(([g, v]) => {
      acc[g] = acc[g] || { receita: 0, cmv: 0, litros: 0, pedidos: 0 };
      ['receita', 'cmv', 'litros', 'pedidos'].forEach(k => acc[g][k] += v[k]); }); });
  const PALETA = [CORES.azul, CORES.verde, CORES.ouro, CORES.bordo, CORES.laranja, '#6EE7D4', '#9CC8F2', '#FFE388'];
  const gs = Object.entries(acc).filter(([g]) => !fora.has(g))
    .map(([g, v]) => ({ g, ...v, mb: v.receita > 0 ? (v.receita - v.cmv) / v.receita : null }))
    .sort((x, y) => y.receita - x.receita)
    .map((x, i) => ({ ...x, cor: PALETA[i % PALETA.length] }));
  const max = Math.max(...gs.map(x => x.receita), 1);
  const tot = gs.reduce((s, x) => s + Math.max(x.receita, 0), 0) || 1;
  const gid = g => 'g' + g.replace(/[^a-z0-9]/gi, '_');
  const linhas = gs.map(x => {
    const c = x.mb === null ? CORES.cinza : x.mb >= .55 ? CORES.verde : x.mb >= .35 ? CORES.ouro : CORES.bordo;
    const grad = x.mb === null ? 'linear-gradient(90deg,#4B5A5D,#6D8488)'
      : x.mb >= .55 ? 'linear-gradient(90deg,#3F9142,#8FE07A)'
      : x.mb >= .35 ? 'linear-gradient(90deg,#B8892E,#FFD37A)'
      : 'linear-gradient(90deg,#B23A44,#FF6E79)';
    return `<div class="li" data-g="${gid(x.g)}"><div>
      <div class="nm"><span class="nome"><i class="dot" style="background:${x.cor}"></i>${esc(x.g)}</span><span style="color:var(--cinza);font-family:'IBM Plex Mono',monospace">${R$(x.receita)}</span></div>
      <div class="tr"><div class="br brilho" style="transform:scaleX(${Math.max(x.receita / max, .006)}) translateZ(0);background:${grad}"></div></div>
    </div><div class="pc" style="color:${c}">${x.mb === null ? '—' : P(x.mb)}<i>margem</i></div><div class="pc">${P(x.receita / tot)}<i>participação</i></div></div>`; }).join('');
  const tab = gs.map(x => `<tr><td>${esc(x.g)}</td><td>${N(x.pedidos)}</td><td>${N(x.litros)}</td>
    <td>${M(x.receita)}</td><td>${M(x.cmv)}</td><td>${x.mb === null ? '—' : P(x.mb)}</td><td>${P(x.receita / tot)}</td></tr>
    `).join('') + `<tr class="tt-canal"><td>TOTAL</td><td>${N(gs.reduce((s,x)=>s+x.pedidos,0))}</td>
    <td>${N(gs.reduce((s,x)=>s+x.litros,0))}</td><td>${M(tot)}</td>
    <td>${M(gs.reduce((s,x)=>s+x.cmv,0))}</td>
    <td>${P((tot - gs.reduce((s,x)=>s+x.cmv,0)) / tot)}</td><td>100,0%</td></tr>`;

  /* anel de participação: cada fatia é um trecho de stroke-dasharray sobre a circunferência */
  const R_ = 50, CIRC = 2 * Math.PI * R_;
  let acumulado = 0;
  const fatias = gs.map(x => {
    const parte = Math.max(x.receita, 0) / tot;
    const dash = `${Math.max(parte * CIRC, 0.6)} ${CIRC}`;
    const offset = -acumulado * CIRC;
    acumulado += parte;
    return `<circle class="fatia" data-g="${gid(x.g)}" cx="60" cy="60" r="${R_}" fill="none" stroke="${x.cor}"
      stroke-width="16" stroke-dasharray="${dash}" stroke-dashoffset="${offset}" transform="rotate(-90 60 60)"/>`;
  }).join('');
  return `<div class="card"><h2><span class="ic-chip">${ic('ic-canais')}</span>Margem por canal</h2>
    <div class="leg">O anel e o ponto ao lado de cada canal usam a mesma cor; a barra é proporcional à receita.
      Participação é sobre o total dos canais listados (vendas + logística): ${R$(tot)}.</div>
    <div class="canais-grid">
      <svg class="canal-donut" id="donutCanais" viewBox="0 0 120 120" role="img" aria-label="Participação por canal">${fatias}</svg>
      <div class="bh">${linhas}</div>
    </div>
    <div style="overflow-x:auto;margin-top:16px"><table>
      <thead><tr><th>Canal</th><th>Pedidos</th><th>Litros</th><th>Receita</th><th>CMV</th><th>Margem</th><th>Part.</th></tr></thead>
      <tbody>${tab}</tbody></table></div></div>`;
}

/* ===================== DRE detalhado ===================== */
/* blocos cujos niveis detalhados sempre aparecem, mesmo zerados */
const BLOCOS_SEMPRE_DETALHADOS = ['RECEITA COM VENDAS', 'RECEITA LOGISTICA', 'RECEITA LOGÍSTICA'];

function linhasDRE(agg, n3, ocultos) {
  const oc = ocultos instanceof Set ? ocultos : new Set(ocultos || []);
  const L = []; let b0 = null, pai1 = null, valPai1 = null, rotPai1 = null;
  agg.linhas.forEach((l, k) => {
    const v = agg.val[k];
    if (v === null || v === undefined) return;
    if (l.nivel === 0) { b0 = l.rot; pai1 = null; rotPai1 = null; }
    if (l.nivel === 1) { pai1 = b0 + '/' + l.rot; valPai1 = v; rotPai1 = l.rot; }
    if (l.nivel === 2) { rotPai1 = rotPai1; }

    // categoria marcada como oculta: some ela e os filhos (o valor segue somando nos totais)
    const camCompleto = l.nivel === 0 ? l.rot : l.nivel === 1 ? pai1 : b0 + '/' + rotPai1 + '/' + l.rot;
    if (oc.has(camCompleto)) return;
    // se pai ocultado, some filhos
    if (l.nivel === 2) {
      const camPai1 = b0 + '/' + rotPai1;
      if (oc.has(camPai1)) return;
    }
    // nivel detalhado zerado nao precisa aparecer -- exceto nos blocos de receita
    if (l.nivel === 2 && Math.abs(v) < 0.005 && !BLOCOS_SEMPRE_DETALHADOS.includes(rotPai1)) return;

    if (l.nivel === 1 && !abertos[b0]) return;
    if (l.nivel === 2 && !abertos[pai1]) return;

    const f = exibir(l), pct = l.tipo === 'pct';
    const base = baseAV(l, { b0 }, agg, valPai1);
    const av = (pct || !base) ? null : f(v) / base;

    // filhos
    let temF = false, idF = null;
    if (l.nivel === 0) { temF = agg.linhas[k + 1] && agg.linhas[k + 1].nivel === 1; idF = b0; }
    else if (l.nivel === 1) { temF = agg.linhas[k + 1] && agg.linhas[k + 1].nivel === 2; idF = pai1; }
    else if (l.nivel === 2) { const t = n3[rotPai1] && n3[rotPai1][l.rot]; if (t) { temF = true; idF = pai1 + '/' + l.rot; } }

    const cls = pct ? 'pct' : l.rot === 'RESULTADO DO EXERCÍCIO' ? 'fim' : l.tipo === 'total' ? 'tot' : 'n' + l.nivel;
    const cam = l.nivel === 0 ? l.rot : l.nivel === 1 ? b0 + '/' + l.rot : b0 + '/' + rotPai1 + '/' + l.rot;
    L.push({ cls, temF, idF, rot: (l.sinal ? '(' + l.sinal + ') ' : '') + l.rot,
      cam, l, pct, val: pct ? v : f(v), av, f, nivel: l.nivel });

    // nível 3
    if (l.nivel === 2 && temF && abertos[idF]) {
      Object.entries(n3[rotPai1][l.rot]).sort((a, b) => b[1] - a[1]).forEach(([n, vv]) =>
        L.push({ cls: 'n3', temF: false, rot: n, cam: null, l, pct: false,
          val: l.sinal === '-' ? -Math.abs(vv) : Math.abs(vv), av: null, nivel: 3 }));
    }
  });
  return L;
}

/* ---- exportacao do DRE detalhado ---- */
/* CSV com separador ";" e decimal "," -- o Excel pt-BR abre direto, sem assistente de importacao. */
function exportarDRECsv(cols, ocultos) {
  const varias = cols.length > 1;
  const total = varias ? { ...cols[0], comps: cols.flatMap(c => c.comps),
                           nome: 'Total ' + cols[0].ano, tipo: cols[0].tipo } : null;
  const aggs = cols.map(c => agregar(c));
  const aggTot = varias ? agregar(total) : aggs[0];
  const n3 = nivel3De(aggTot.comps);
  const L = linhasDRE(aggTot, n3, ocultos);

  const num = v => (v === null || v === undefined) ? '' : String(v).replace('.', ',');
  const txt = s => `"${String(s == null ? '' : s).replace(/"/g, '""')}"`;
  const valDe = (agg, x) => {
    if (!x.cam) return x.val ?? null;         // nivel 3 nao tem caminho: usa o valor ja calculado
    const v = agg.vc(x.cam);
    if (v === null || v === undefined) return null;
    return x.pct ? v : (x.f ? x.f(v) : v);
  };

  const colunas = varias ? [...cols, total] : cols;
  const cab = ['Conta', 'Nível', ...colunas.map(c => c.nome)];
  const linhas = [cab.map(txt).join(';')];
  L.forEach(x => {
    const celulas = colunas.map((c, i) => {
      const agg = (varias && i === colunas.length - 1) ? aggTot : aggs[i];
      return num(valDe(agg, x));
    });
    linhas.push([txt(x.rot), x.nivel, ...celulas].join(';'));
  });
  return linhas.join('\n');
}

/* dispara o download no navegador (nao roda em teste: depende de document/URL) */
function baixarDRECsv(cols, ocultos, nomeArquivo) {
  const csv = exportarDRECsv(cols, ocultos);
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }); // BOM: Excel le acentos
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeArquivo || 'dre.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function tabelaDRE(cols, ocultos) {
  /* cols: lista de periodos. Com mais de um, entra a coluna Total. */
  const varias = cols.length > 1;
  const total = varias ? { ...cols[0], comps: cols.flatMap(c => c.comps),
                           nome: 'Total ' + cols[0].ano, tipo: cols[0].tipo } : null;
  const aggs = cols.map(c => agregar(c));
  const aggTot = varias ? agregar(total) : aggs[0];
  const n3 = nivel3De(aggTot.comps);
  const L = linhasDRE(aggTot, n3, ocultos);

  const fmt = (d, pct) => d === null ? '—' : pct ? ((d * 100 >= 0 ? '+' : '') + (d * 100).toFixed(1) + ' p.p.')
                                                 : ((d >= 0 ? '+' : '') + (d * 100).toFixed(1) + '%');
  const avDe = (agg, x) => {
    if (x.pct || !x.cam) return null;
    const b = baseAVcam(x, agg);
    const v = agg.vc(x.cam);
    return (b && v !== null) ? (x.f ? x.f(v) : v) / b : null;
  };
  const cel = (agg, x) => { const v = x.cam ? agg.vc(x.cam) : null;
    return v === null || v === undefined ? '—' : (x.pct ? P(v) : M(x.f ? x.f(v) : v)); };
  /* valores negativos (resultado, margem, resultado financeiro em prejuízo) saltam em vermelho */
  const celNeg = (agg, x) => { const v = x.cam ? agg.vc(x.cam) : null;
    if (v === null || v === undefined) return false;
    return (x.f ? x.f(v) : v) < 0; };
  const delta = (agg, ref, x) => {
    const va = x.cam ? agg.vc(x.cam) : null, vb = (ref && x.cam) ? ref.vc(x.cam) : null;
    return x.pct ? (vb === null || va === null ? null : va - vb)
                 : variacao(x.f ? x.f(va) : va, x.f ? x.f(vb) : vb, x.l);
  };

  /* referencias: periodo anterior (para AH) e mesmo periodo do ano passado (para Δ ano) */
  const refsAnt = cols.map((c, i) => {
    const r = varias ? (i > 0 ? cols[i - 1] : periodoAnterior(c)) : periodoAnterior(c);
    return r ? agregar(r) : null;
  });
  const refsAno = cols.map(c => { const aa = periodoAnoAnt(c); return aa ? agregar(aa) : null; });
  const totRefAno = varias ? (() => { const r = periodoAnoAntLista(cols); return r ? agregar(r) : null; })() : null;

  /* cabeçalho */
  const th = [];
  const bloco = (rot, comp, anoAnt) => {
    th.push(`<th>${esc(rot)}</th>`);
    if (mostrarAV) th.push('<th>AV%</th>');
    if (mostrarAH) th.push(`<th>AH%${comp ? `<i>vs ${esc(comp)}</i>` : ''}</th>`);
    if (mostrarDelta) th.push(`<th>Δ ano${anoAnt ? `<i>vs ${esc(anoAnt)}</i>` : ''}</th>`);
  };
  cols.forEach((c, i) => bloco(agregar(c).nome,
    refsAnt[i] ? refsAnt[i].nome : null, refsAno[i] ? refsAno[i].nome : null));
  if (varias) bloco('Total ' + cols[0].ano, null, totRefAno ? totRefAno.nome : null);

  /* corpo */
  const linhas = L.map(x => {
    const tds = [];
    aggs.forEach((agg, i) => {
      tds.push(`<td class="${celNeg(agg, x) ? 'neg' : ''}">${cel(agg, x)}</td>`);
      if (mostrarAV) { const av = avDe(agg, x); tds.push(`<td class="av">${av === null ? '—' : P(Math.abs(av))}</td>`); }
      if (mostrarAH) { const d = delta(agg, refsAnt[i], x); tds.push(`<td class="${classeVar(d, x.l)}">${fmt(d, x.pct)}</td>`); }
      if (mostrarDelta) { const d = delta(agg, refsAno[i], x); tds.push(`<td class="${classeVar(d, x.l)}">${fmt(d, x.pct)}</td>`); }
    });
    if (varias) {
      tds.push(`<td class="tt ${celNeg(aggTot, x) ? 'neg' : ''}">${cel(aggTot, x)}</td>`);
      if (mostrarAV) { const av = avDe(aggTot, x); tds.push(`<td class="av tt">${av === null ? '—' : P(Math.abs(av))}</td>`); }
      if (mostrarAH) { const d = delta(aggTot, totRefAno, x); tds.push(`<td class="tt ${classeVar(d, x.l)}">${fmt(d, x.pct)}</td>`); }
      if (mostrarDelta) { const d = delta(aggTot, totRefAno, x); tds.push(`<td class="tt ${classeVar(d, x.l)}">${fmt(d, x.pct)}</td>`); }
    }
    return `<tr class="${x.cls} ${x.temF ? 'abre' : ''}" ${x.temF ? `data-b="${esc(x.idF)}" role="button" tabindex="0" aria-expanded="${abertos[x.idF] ? 'true' : 'false'}"` : ''}>
      <td><span class="seta" aria-hidden="true">${x.temF ? (abertos[x.idF] ? '▾' : '▸') : ''}</span>${esc(x.rot)}</td>${tds.join('')}<td class="vazia"></td></tr>`;
  }).join('');

  return card('DRE detalhado',
    `AV: receitas sobre a receita bruta e sobre a categoria mãe; CMV, taxas, devolução e eventos sobre a receita com vendas;
     o restante sobre a receita bruta. AH compara com o período imediatamente anterior. Δ ano compara com o mesmo período do ano passado.`,
    `<table class="dre"><thead><tr><th>Categorias</th>${th.join('')}<th class="vazia"></th></tr></thead>
      <tbody id="tb">${linhas}</tbody></table>`);
}

/* mesmo conjunto de períodos no ano anterior, para o total */
function periodoAnoAntLista(cols) {
  const ano = String(+cols[0].ano - 1);
  if (!H[ano]) return null;
  const comps = cols.flatMap(c => c.comps)
    .map(c => c.slice(0, 2) + ano).filter(c => posDe(c) >= 0);
  return comps.length ? { ano, comps, nome: cols.length > 1 ? ano : 'Total ' + ano,
                          tipo: cols[0].tipo, m: cols[0].m, ref: null } : null;
}

/* base da AV a partir da linha já montada */
function baseAVcam(x, agg) {
  const partes = x.cam.split('/');
  const b0 = partes[0];
  const pai1 = partes.length === 3 ? agg.vc(partes[0] + '/' + partes[1]) : null;
  return baseAV(x.l, { b0 }, agg, pai1);
}

/* cartão com rolagem espelhada no topo */
function card(titulo, leg, tabela) {
  return `<div class="card"><div class="card-cab">
      <div><h2><span class="ic-chip">${ic('ic-dre')}</span>${titulo}</h2><div class="leg">${leg}</div></div>
      <div class="acoes">
        <span class="flags">
          <label class="fl"><input type="checkbox" id="cAV" ${mostrarAV ? 'checked' : ''}> AV</label>
          <label class="fl"><input type="checkbox" id="cAH" ${mostrarAH ? 'checked' : ''}> AH</label>
          <label class="fl"><input type="checkbox" id="cDelta" ${mostrarDelta ? 'checked' : ''}> Δ ano</label>
        </span>
        <button class="bt" id="btNiveis">${Object.keys(abertos).some(k => abertos[k]) ? 'Recolher tudo' : 'Expandir tudo'}</button>
      </div>
    </div>
    <div class="rolagem-topo" id="rolTopo"><div></div></div>
    <div class="rolagem" id="rolTab">${tabela}</div></div>`;
}

/* ===================== insights ===================== */
function painelInsights(p) {
  const c = p.comps.length === 1 ? calcDe(p.comps[0]) : null;
  if (!c) return '';
  const i = c.insights;
  if (!i.conclusoes || !i.conclusoes.length) return '';
  return `<div class="ins ins-1"><section><h3><span class="ic-chip">${ic('ic-insight')}</span><span class="pill p-v">Conclusões</span></h3>
    <ul>${i.conclusoes.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section></div>`;
}

/* ===================== Fluxo de Caixa ===================== */
let abertosCaixa = {};
let visaoCaixa = 'mes', selPeriodosCaixa = new Set(), painelAbertoCaixa = false;
let anoCaixaEscolhido = null;   // null = automatico (ano do DRE se existir no caixa, senao o mais recente)
const CX = DADOS.caixa && DADOS.caixa.anos ? DADOS.caixa.anos : {};

/* ano exibido na pagina do caixa: o do periodo selecionado no DRE, se
   existir no caixa; senao o mais recente disponivel. Centralizado aqui
   porque tanto pgCaixa() (Task 14) quanto o botao "Expandir tudo" (abaixo)
   precisam concordar sobre qual ano estao olhando. */
function anoCaixaAtual() {
  const anos = Object.keys(CX).sort().reverse();
  if (!anos.length) return null;
  if (anoCaixaEscolhido && anos.includes(anoCaixaEscolhido)) return anoCaixaEscolhido;
  return anos.includes(compAtual.slice(2)) ? compAtual.slice(2) : anos[0];
}

/* soma os valores dos meses selecionados (aditivo); kpis de prazo tambem sao
   somados como componentes (soma+qtd) e so divididos no fim, em kpisCaixa() */
function agregarCaixa(ano, mesesNums) {
  const A = CX[ano];
  if (!A) return null;
  const idx = mesesNums.map(m => A.meses.findIndex(x => x.m === m)).filter(i => i >= 0);
  const val = A.valores.map(v => { let s = null;
    idx.forEach(i => { if (v[i] !== null && v[i] !== undefined) s = (s || 0) + v[i]; }); return s; });
  const porCaminho = {}; let b0 = null, n1 = null;
  A.linhas.forEach((l, i) => {
    if (l.nivel === 0) { b0 = l.rot; n1 = null; }
    if (l.nivel === 1) n1 = l.rot;
    const cam = l.nivel === 0 ? l.rot : l.nivel === 1 ? b0 + '/' + l.rot
      : l.nivel === 2 ? b0 + '/' + n1 + '/' + l.rot : null;
    if (cam && !(cam in porCaminho)) porCaminho[cam] = val[i];
  });
  const somaKpi = chave => idx.reduce((s, i) => s + (A.kpis[chave][i] || 0), 0);
  const somaTotal = chave => idx.reduce((s, i) => s + (A.totais[chave][i] || 0), 0);
  return { linhas: A.linhas, val, porCaminho, idx,
    diasRecSoma: somaKpi('dias_recebimento_soma'), diasRecQtd: somaKpi('dias_recebimento_qtd'),
    diasPagSoma: somaKpi('dias_pagamento_soma'), diasPagQtd: somaKpi('dias_pagamento_qtd'),
    totEntradas: somaTotal('entradas'), totSaidas: somaTotal('saidas'), totResultado: somaTotal('resultado') };
}

/* ===================== seletor de período (caixa) ===================== */
/* mesmo padrao de mes/trimestre/semestre/ano do DRE (VISOES, ja definido mais
   abaixo), mas com estado e fonte de meses proprios -- CX[ano].meses, nao
   H/TODOS -- porque o caixa pode ter um conjunto de anos/meses diferente do
   historico do DRE. */
function opcoesPeriodoCaixa(ano) {
  const ms = CX[ano] ? CX[ano].meses : [];
  if (visaoCaixa === 'mes') return ms.map(m => [m.comp, m.rot]);
  if (visaoCaixa === 'trim') {
    const q = [...new Set(ms.map(m => Math.ceil(m.m / 3)))].sort();
    return q.map(n => [ms.filter(m => Math.ceil(m.m / 3) === n).slice(-1)[0].comp, `${n}º Trim`]);
  }
  if (visaoCaixa === 'sem') {
    const q = [...new Set(ms.map(m => Math.ceil(m.m / 6)))].sort();
    return q.map(n => [ms.filter(m => Math.ceil(m.m / 6) === n).slice(-1)[0].comp, `${n}º Sem`]);
  }
  return [];
}

/* meses (numeros 1-12) que um "comp" representativo de opcoesPeriodoCaixa cobre */
function periodoCaixaMeses(compRepresentativo, ms) {
  const alvo = ms.find(m => m.comp === compRepresentativo);
  if (!alvo) return [];
  if (visaoCaixa === 'mes') return [alvo.m];
  if (visaoCaixa === 'trim') return ms.filter(m => Math.ceil(m.m / 3) === Math.ceil(alvo.m / 3)).map(m => m.m);
  if (visaoCaixa === 'sem') return ms.filter(m => Math.ceil(m.m / 6) === Math.ceil(alvo.m / 6)).map(m => m.m);
  return ms.map(m => m.m);
}

/* meses efetivamente selecionados no momento, prontos para passar como
   mesesNums para agregarCaixa/tabelaCaixaHTML/kpisCaixa/etc */
function mesesNumsCaixa() {
  const ano = anoCaixaAtual();
  if (!ano) return [];
  const ms = CX[ano].meses;
  if (visaoCaixa === 'ano') return ms.map(m => m.m);
  const op = opcoesPeriodoCaixa(ano);
  const alvo = op.filter(([c]) => selPeriodosCaixa.size === 0 || selPeriodosCaixa.has(c));
  const usar = alvo.length ? alvo : op;
  const set = new Set();
  usar.forEach(([c]) => periodoCaixaMeses(c, ms).forEach(m => set.add(m)));
  return [...set].sort((a, b) => a - b);
}

/* colunas da tabela detalhada: uma por PERÍODO FECHADO selecionado (mês,
   trimestre ou semestre -- não um mês por vez dentro do período), igual ao
   comportamento do DRE. Cada coluna soma os meses daquele período; quando
   mais de uma coluna existir, uma coluna extra "Acumulado" soma tudo. */
function colunasCaixa() {
  const ano = anoCaixaAtual();
  if (!ano) return [];
  const ms = CX[ano].meses;
  if (visaoCaixa === 'ano') return [{ comp: ano, rot: 'Ano ' + ano, meses: ms.map(m => m.m) }];
  const op = opcoesPeriodoCaixa(ano);
  const alvo = op.filter(([c]) => selPeriodosCaixa.size === 0 || selPeriodosCaixa.has(c));
  const usar = alvo.length ? alvo : op;
  return usar.map(([c, r]) => ({ comp: c, rot: r, meses: periodoCaixaMeses(c, ms) }));
}

function resumoSelecaoCaixa(op) {
  if (selPeriodosCaixa.size === 0) return 'Todos';
  const marcados = op.filter(([c]) => selPeriodosCaixa.has(c));
  if (marcados.length === 0) return 'Todos';
  if (marcados.length === 1) return marcados[0][1];
  if (marcados.length === op.length) return 'Todos';
  if (marcados.length <= 3) return marcados.map(([, r]) => r).join(', ');
  return `${marcados.length} períodos`;
}

function filtrosCaixa() {
  const ano = anoCaixaAtual();
  if (!ano) return '';
  const anosCaixa = Object.keys(CX).sort().reverse();
  const op = opcoesPeriodoCaixa(ano);
  return `${anosCaixa.length > 1 ? `<label for="fAnoCaixa">Ano</label>
    <select id="fAnoCaixa">${anosCaixa.map(a => `<option value="${a}" ${a === ano ? 'selected' : ''}>${a}</option>`).join('')}</select>` : ''}
    <label for="fVisCaixa">Visão</label>
    <select id="fVisCaixa">${VISOES.map(([v, n]) => `<option value="${v}" ${v === visaoCaixa ? 'selected' : ''}>${n}</option>`).join('')}</select>
    ${op.length ? `<label>Período</label>
    <div class="sel-multi">
      <button type="button" class="bt-sel" id="btPerCaixa" aria-expanded="${painelAbertoCaixa}">
        ${esc(resumoSelecaoCaixa(op))} <span class="cv">▾</span></button>
      <div class="painel ${painelAbertoCaixa ? 'aberto' : ''}" id="painelPerCaixa">
        <label class="opt todos"><input type="checkbox" id="pTodosCaixa" ${selPeriodosCaixa.size === 0 ? 'checked' : ''}> Todos</label>
        <div class="sep"></div>
        ${op.map(([c, r]) => `<label class="opt"><input type="checkbox" class="pOptCaixa" value="${c}"
          ${selPeriodosCaixa.has(c) ? 'checked' : ''}> ${esc(r)}</label>`).join('')}
      </div></div>` : ''}`;
}

function kpisCaixa(ano, mesesNums) {
  const agg = agregarCaixa(ano, mesesNums);
  if (!agg) return '';
  const totEnt = agg.totEntradas, totSai = agg.totSaidas;
  const resultado = agg.porCaminho['RESULTADO DE CAIXA DO PERÍODO'];
  const prazoRec = agg.diasRecQtd ? agg.diasRecSoma / agg.diasRecQtd : null;
  const prazoPag = agg.diasPagQtd ? agg.diasPagSoma / agg.diasPagQtd : null;
  const dias = v => v === null ? '—' : Math.round(Math.abs(v)) + ' dias';
  const resultadoOp = agg.porCaminho['RESULTADO DE CAIXA OPERACIONAL'];

  const cards = [
    { r: 'Total Entradas', ic: 'ic-receita', v: Mk(totEnt), full: R$0(totEnt), s: '', c: '',
      dica: 'Não inclui dinheiro de empréstimos de terceiros tomados no período (ver quadro Dívida Bancária).' },
    { r: 'Total Saídas', ic: 'ic-saidas', v: Mk(totSai), full: R$0(totSai), s: '', c: '' },
    { r: 'Resultado de Caixa Operacional', ic: 'ic-resultado', v: resultadoOp == null ? '—' : Mk(resultadoOp), full: resultadoOp == null ? '' : R$0(resultadoOp), s: '', c: resultadoOp < 0 ? 'r' : 'v',
      dica: 'Resultado das operações antes de empréstimos de terceiros e pagamento de empréstimos (principal).' },
    { r: 'Resultado do Período', ic: 'ic-resultado', v: Mk(resultado), full: R$0(resultado), s: '', c: resultado < 0 ? 'r' : 'v' },
    { r: 'Prazo<br>Médio&nbsp;de<br>Recebimento', ic: 'ic-caixa', v: dias(prazoRec), s: `${N(agg.diasRecQtd)} título(s)`, c: '',
      dica: 'Média de dias entre a Emissão do título e a Data de Crédito (quando o dinheiro entrou de fato).' },
    { r: 'Prazo<br>Médio&nbsp;de<br>Pagamento', ic: 'ic-caixa', v: dias(prazoPag), s: `${N(agg.diasPagQtd)} título(s)`, c: '',
      dica: 'Média de dias entre a Emissão do título e a Data de Débito (quando o dinheiro saiu de fato).' },
  ];
  return `<div class="kpis k6">${cards.map(k => `<div class="kpi ${k.c}"${k.dica ? ` title="${esc(k.dica)}"` : ''}>
    <div class="ic-rot"><div class="ic-chip">${ic(k.ic)}</div><div class="rot">${k.r}</div></div>
    <div class="val"${k.full ? ` title="${esc(k.full)}"` : ''}>${k.v}</div><div class="sub">${k.s}</div></div>`).join('')}</div>`;
}

function cardCaixa(titulo, leg, tabela) {
  return `<div class="card"><div class="card-cab">
      <div><h2><span class="ic-chip">${ic('ic-caixa')}</span>${titulo}</h2><div class="leg">${leg}</div></div>
      <div class="acoes">
        <button class="bt" id="btNiveisCaixa">${Object.keys(abertosCaixa).some(k => abertosCaixa[k]) ? 'Recolher tudo' : 'Expandir tudo'}</button>
      </div>
    </div>
    <div class="rolagem-topo" id="rolTopoCaixa"><div></div></div>
    <div class="rolagem" id="rolTabCaixa">${tabela}</div></div>`;
}

function linhasCaixa(agg) {
  const L = []; let b0 = null, pai1 = null, pai2 = null;
  agg.linhas.forEach((l, k) => {
    const v = agg.val[k];
    if (v === null || v === undefined) return;
    if (l.nivel === 0) { b0 = l.rot; pai1 = null; pai2 = null; }
    if (l.nivel === 1) { pai1 = b0 + '/' + l.rot; pai2 = null; }
    if (l.nivel === 2) pai2 = pai1 + '/' + l.rot;

    if (l.nivel === 1 && !abertosCaixa[b0]) return;
    if (l.nivel === 2 && !abertosCaixa[pai1]) return;
    if (l.nivel === 3 && !abertosCaixa[pai2]) return;

    let temF = false, idF = null;
    if (l.nivel === 0) { temF = agg.linhas[k + 1] && agg.linhas[k + 1].nivel === 1; idF = b0; }
    else if (l.nivel === 1) { temF = agg.linhas[k + 1] && agg.linhas[k + 1].nivel === 2; idF = pai1; }
    else if (l.nivel === 2) { temF = agg.linhas[k + 1] && agg.linhas[k + 1].nivel === 3; idF = pai2; }

    const cls = l.tipo === 'total' ? 'tot' : 'n' + l.nivel;
    L.push({ cls, temF, idF, rot: (l.sinal ? '(' + l.sinal + ') ' : '') + l.rot,
      val: v, nivel: l.nivel, k });
  });
  return L;
}

/* uma coluna por PERÍODO FECHADO selecionado (mês, trimestre ou semestre --
   mesmo comportamento do DRE: um trimestre selecionado vira 1 coluna soma
   dos 3 meses, não 3 colunas separadas), mais uma coluna "Acumulado" no fim
   quando mais de uma coluna existir. A estrutura das linhas (quais
   categorias aparecem, expandido/recolhido) usa a soma do período inteiro
   como referência; cada célula usa o agg da sua própria coluna. */
function tabelaCaixaHTML(ano) {
  const cols = colunasCaixa();
  if (!cols.length) return '<p>Sem dados de fluxo de caixa para este período.</p>';
  const aggsPorColuna = cols.map(c => agregarCaixa(ano, c.meses));
  if (aggsPorColuna.some(a => !a)) return '<p>Sem dados de fluxo de caixa para este período.</p>';
  const multi = cols.length > 1;
  const aggTotal = multi ? agregarCaixa(ano, cols.flatMap(c => c.meses)) : aggsPorColuna[0];
  const L = linhasCaixa(aggTotal);

  const th = cols.map(c => `<th>${esc(c.rot)}</th>`).join('') + (multi ? '<th class="tt">Acumulado</th>' : '');
  const linhas = L.map(x => {
    const celulas = aggsPorColuna.map(agg => {
      const v = agg.val[x.k];
      const vazio = v === null || v === undefined;
      return `<td class="${!vazio && v < 0 ? 'neg' : ''}">${vazio ? '—' : M(v)}</td>`;
    }).join('');
    const celAcum = multi ? `<td class="tt ${x.val < 0 ? 'neg' : ''}">${M(x.val)}</td>` : '';
    return `<tr class="${x.cls} ${x.temF ? 'abre' : ''}" ${x.temF ? `data-bc="${esc(x.idF)}" role="button" tabindex="0" aria-expanded="${abertosCaixa[x.idF] ? 'true' : 'false'}"` : ''}>
      <td><span class="seta" aria-hidden="true">${x.temF ? (abertosCaixa[x.idF] ? '▾' : '▸') : ''}</span>${esc(x.rot)}</td>${celulas}${celAcum}</tr>`;
  }).join('');
  return `<table class="dre"><thead><tr><th>Categorias</th>${th}<th class="vazia"></th></tr></thead>
    <tbody id="tbCaixa">${linhas}</tbody></table>`;
}

/* ===================== evolução do caixa ===================== */
function evolucaoCaixa(ano, mesesNums) {
  const A = CX[ano];
  if (!A || !A.meses.length) return '';
  const dentroSet = new Set(mesesNums || []);
  const S = A.meses.map((m, i) => {
    const ent = A.totais.entradas[i] || 0;
    const sai = A.totais.saidas[i] || 0;
    const res = A.totais.resultado[i] || 0;
    return { rot: m.rot, ent, sai, res, dentro: dentroSet.size ? dentroSet.has(m.m) : true };
  });
  if (S.length < 2) return '';
  window.__EVOC = S;
  return `<div class="card"><h2><span class="ic-chip">${ic('ic-caixa')}</span>Evolução do caixa — ${esc(ano)}</h2>
    <div class="leg">Barra clara: entradas. Barra escura: saídas. Linha: resultado do período. Não inclui
      dinheiro de empréstimos tomados (ver Dívida Bancária). Em destaque, os meses do período selecionado.
      Passe o mouse para ver os valores.</div>
    <div class="grafico" id="wrapEvoCaixa"><div class="dica" id="dicaEvoCaixa"></div></div></div>`;
}

function desenharEvolucaoCaixa() {
  const wrap = document.getElementById('wrapEvoCaixa');
  if (!wrap || !window.__EVOC) return;
  const S = window.__EVOC;
  const W = Math.max(280, Math.round(wrap.clientWidth));
  const estreito = W < 520;
  const Ht = estreito ? 210 : 270;
  const ml = estreito ? 50 : 74, mr = 10, mt = 16, mb = estreito ? 28 : 34;
  const iw = W - ml - mr, ih = Ht - mt - mb;
  const vals = S.flatMap(m => [m.ent, -m.sai, m.res, 0]);
  const hi = Math.max(...vals), lo = Math.min(...vals);
  const y = v => mt + ih - ((v - lo) / ((hi - lo) || 1)) * ih;
  const bw = iw / S.length;
  const fEixo = estreito ? 9.5 : 12, fForte = estreito ? 9.5 : 12.5;
  const gy = [...new Set([hi, (hi + lo) / 2, 0, lo])].map(v =>
    `<line x1="${ml}" y1="${y(v)}" x2="${W - mr}" y2="${y(v)}" stroke="${v === 0 ? '#3E5B62' : '#1C2E33'}"/>
     <text class="eixo" style="font-size:${fEixo}px" x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${Mk(v)}</text>`).join('');
  const barras = S.map((m, i) => {
    const x = ml + i * bw + bw * .12, w = bw * .38;
    const y0 = y(0), y1e = y(m.ent), y1s = y(-m.sai);
    const op = m.dentro ? 1 : .68;
    return `<rect x="${x}" y="${Math.min(y0, y1e)}" width="${w}" height="${Math.abs(y0 - y1e)}" fill="${CORES.laranja}" opacity="${op}" rx="2"/>
      <rect x="${x + w + bw * .12}" y="${Math.min(y0, y1s)}" width="${w}" height="${Math.abs(y0 - y1s)}" fill="${CORES.bordo}" opacity="${op}" rx="2"/>`;
  }).join('');
  const pts = S.map((m, i) => [ml + i * bw + bw / 2, y(m.res)]);
  const linha = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const pontos = pts.map((q, i) => `<circle cx="${q[0]}" cy="${q[1]}" r="${estreito ? 3 : 4}" fill="${S[i].res >= 0 ? CORES.verde : CORES.bordo}" stroke="#0A141C" stroke-width="1.5"/>`).join('');
  const rots = S.map((m, i) => `<text class="eixo forte" style="font-size:${fForte}px" x="${ml + i * bw + bw / 2}" y="${Ht - (estreito ? 8 : 11)}" text-anchor="middle">${esc(m.rot)}</text>`).join('');
  const alvos = S.map((m, i) => `<rect class="alvo" x="${ml + i * bw}" y="${mt}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}"/>`).join('');
  const guia = `<line id="guiaCaixa" x1="0" y1="${mt}" x2="0" y2="${mt + ih}" stroke="${CORES.azul}" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
  window.__EVOC_PTS = S.map((m, i) => ({ ...m, x: ml + i * bw + bw / 2 }));
  wrap.innerHTML = `<svg id="svgEvoCaixa" width="${W}" height="${Ht}" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Evolução do fluxo de caixa">
      ${gy}${barras}<path d="${linha}" fill="none" stroke="${CORES.azul}" stroke-width="2.4"/>${pontos}${guia}${rots}${alvos}</svg>
    <div class="dica" id="dicaEvoCaixa"></div>`;
  ligarEvolucaoCaixa();
}

function ligarEvolucaoCaixa() {
  const svg = document.getElementById('svgEvoCaixa'), dica = document.getElementById('dicaEvoCaixa');
  if (!svg || !dica || !window.__EVOC_PTS) return;
  const guia = document.getElementById('guiaCaixa');
  const vb = svg.viewBox.baseVal;
  const mostrar = i => {
    const d = window.__EVOC_PTS[i]; if (!d) return;
    dica.innerHTML = `<b>${esc(d.rot)}</b>
      <span><i style="background:${CORES.laranja}"></i>Entradas<em>${R$(d.ent)}</em></span>
      <span><i style="background:${CORES.bordo}"></i>Saídas<em>${R$(d.sai)}</em></span>
      <span><i style="background:${d.res >= 0 ? CORES.verde : CORES.bordo}"></i>Resultado<em>${R$(d.res)}</em></span>`;
    const r = svg.getBoundingClientRect();
    const px = (d.x / vb.width) * r.width;
    dica.style.left = Math.min(Math.max(px, 90), r.width - 90) + 'px';
    dica.style.opacity = 1;
    guia.setAttribute('x1', d.x); guia.setAttribute('x2', d.x); guia.setAttribute('opacity', .7);
  };
  svg.querySelectorAll('.alvo').forEach(el => el.addEventListener('mouseenter', () => mostrar(+el.dataset.i)));
  svg.addEventListener('mouseleave', () => { dica.style.opacity = 0; guia.setAttribute('opacity', 0); });
}

/* ===================== participação por categoria (caixa) ===================== */
const PALETA_CAIXA = [CORES.azul, CORES.verde, CORES.ouro, CORES.bordo, CORES.laranja, '#6EE7D4', '#9CC8F2', '#FFE388'];

/* um donut de participacao por bloco (nivel 0), no mesmo padrao visual do
   anel de canais do DRE (stroke-dasharray sobre a circunferencia) */
function donutCaixa(idSvg, grupos) {
  const tot = grupos.reduce((s, x) => s + Math.max(x.v, 0), 0) || 1;
  const R_ = 50, CIRC = 2 * Math.PI * R_;
  let acumulado = 0;
  const fatias = grupos.map((x, i) => {
    const parte = Math.max(x.v, 0) / tot;
    const dash = `${Math.max(parte * CIRC, 0.6)} ${CIRC}`;
    const offset = -acumulado * CIRC;
    acumulado += parte;
    return `<circle class="fatia" data-pc="${idSvg}-${i}" cx="60" cy="60" r="${R_}" fill="none" stroke="${x.cor}"
      stroke-width="16" stroke-dasharray="${dash}" stroke-dashoffset="${offset}" transform="rotate(-90 60 60)"/>`;
  }).join('');
  const legenda = grupos.map((x, i) => `<div class="li li-2col" data-pc="${idSvg}-${i}"><div>
      <div class="nm"><span class="nome"><i class="dot" style="background:${x.cor}"></i>${esc(x.rot)}</span>
        <span style="color:var(--cinza);font-family:'IBM Plex Mono',monospace">${R$(x.v)}</span></div>
      <div class="tr"><div class="br brilho" style="transform:scaleX(${Math.max(x.v / tot, .006)}) translateZ(0);background:${x.cor}"></div></div>
    </div><div class="pc">${P(x.v / tot)}</div></div>`).join('');
  return `<div class="canais-grid">
    <svg class="canal-donut" id="${idSvg}" viewBox="0 0 120 120" role="img" aria-label="Participação por categoria">${fatias}</svg>
    <div class="bh">${legenda}</div></div>`;
}

/* RECEITAS FINANCEIRAS/DESPESAS FINANCEIRAS nao aparecem como bloco de nivel
   0 -- ficam dentro de RESULTADO FINANCEIRO (nivel 0, mas valor liquido, nao
   uma categoria em si), com as duas como filhas de nivel 1. Por isso essa
   funcao trata RESULTADO FINANCEIRO a parte: soma as filhas de nivel 1 por
   sinal em duas fatias sinteticas, na mesma granularidade dos outros blocos.
   RECEITA COM VENDAS/LOGISTICA/REPASSE BEER FLOW, do mesmo jeito, ficam
   aninhadas em nivel 1 dentro de RECEITA BRUTA (pra dar pra recolher a
   RECEITA BRUTA inteira na tabela) -- aqui tambem tratamos a parte, so que
   pegando as filhas pelo proprio rot (elas ja tem nomes distintos, sem
   precisar de sintese por sinal como no caso financeiro). */
function gruposDeBlocos(agg, linhasFonte) {
  const grupos = {};
  let dentroFin = false, dentroReceitaBruta = false;
  linhasFonte.linhas.forEach((l, i) => {
    if (l.nivel === 0) {
      dentroFin = (l.rot === 'RESULTADO FINANCEIRO');
      dentroReceitaBruta = (l.rot === 'RECEITA BRUTA');
    }
    const v = agg.val[i];
    if (!v) return;
    if (l.nivel === 0 && l.tipo !== 'total' && l.rot !== 'RESULTADO FINANCEIRO') {
      grupos[l.rot] = (grupos[l.rot] || 0) + Math.abs(v);
    } else if (l.nivel === 1 && dentroFin) {
      const rot = l.sinal === '+' ? 'RECEITAS FINANCEIRAS' : 'DESPESAS FINANCEIRAS';
      grupos[rot] = (grupos[rot] || 0) + Math.abs(v);
    } else if (l.nivel === 1 && dentroReceitaBruta) {
      grupos[l.rot] = (grupos[l.rot] || 0) + Math.abs(v);
    }
  });
  return Object.entries(grupos).map(([rot, v]) => ({ rot, v })).sort((a, b) => b.v - a.v);
}

/* cor atribuida pela posicao dentro do proprio donut (entradas ou saidas),
   nao pela lista combinada -- senao categorias de lados diferentes competem
   pelo mesmo indice de paleta e duas do mesmo lado podem colidir de cor */
const comCor = arr => arr.map((x, i) => ({ ...x, cor: PALETA_CAIXA[i % PALETA_CAIXA.length] }));

function participacaoCaixa(ano, mesesNums) {
  const A = CX[ano];
  const agg = agregarCaixa(ano, mesesNums);
  if (!A || !agg) return '';
  const todosGrupos = gruposDeBlocos(agg, A);
  const gruposEnt = comCor(todosGrupos.filter(g =>
    // EMPRÉSTIMOS DE TERCEIROS fica de fora: dinheiro tomado emprestado nao e
    // receita, nao deve competir por fatia com as entradas operacionais
    ['RECEITA COM VENDAS', 'RECEITA LOGÍSTICA', 'REPASSE BEER FLOW',
     'RECEITAS FINANCEIRAS', 'RECEITAS NÃO OPERACIONAIS'].includes(g.rot)));
  const gruposSai = comCor(todosGrupos.filter(g =>
    ['DEDUÇÕES', 'CUSTO COM VENDAS', 'DESPESAS OPERACIONAIS', 'DESPESAS FINANCEIRAS',
     'DESPESAS NÃO OPERACIONAIS', 'PAGAMENTO DE EMPRÉSTIMOS'].includes(g.rot)));
  if (!gruposEnt.length && !gruposSai.length) return '';
  return `<div class="card"><h2><span class="ic-chip">${ic('ic-caixa')}</span>Participação por categoria</h2>
    <div class="leg">Participação de cada categoria dentro do total de entradas e dentro do total de saídas do período.</div>
    <h4 style="margin:6px 0">Entradas</h4>${donutCaixa('donutCaixaEnt', gruposEnt)}
    <h4 style="margin:14px 0 6px">Saídas</h4>${donutCaixa('donutCaixaSai', gruposSai)}</div>`;
}

function ligarParticipacaoCaixa() {
  const els = document.querySelectorAll('[data-pc]');
  if (!els.length) return;
  const chaves = [...new Set([...els].map(el => el.dataset.pc))];
  const marcar = alvo => chaves.forEach(k => {
    const ativo = k === alvo;
    document.querySelectorAll(`[data-pc="${k}"]`).forEach(el => {
      if (el.classList.contains('fatia')) el.classList.toggle('esmaecida', !!alvo && !ativo);
      if (el.classList.contains('li')) el.classList.toggle('on', ativo);
    });
  });
  els.forEach(el => {
    el.addEventListener('mouseenter', () => marcar(el.dataset.pc));
    el.addEventListener('mouseleave', () => marcar(null));
  });
}

/* ===================== serviço da dívida bancária ===================== */
const ROTULOS_BANCO = {
  'AGERIO': 'Agerio', 'BANCO ITAU': 'Banco Itaú', 'BIZ CAPITAL': 'Biz Capital',
  'BANCO BS2': 'Banco BS2', 'BANCO DAYCOVAL': 'Banco Daycoval',
  'CAIXA ECONOMICA FEDERAL': 'Caixa Econômica Federal', 'BANCO BRADESCO': 'Banco Bradesco',
};

function servicoDividaCaixa(ano, mesesNums) {
  const A = CX[ano];
  if (!A || !A.divida_bancaria) return '';
  const idx = mesesNums.map(m => A.meses.findIndex(x => x.m === m)).filter(i => i >= 0);
  const somaIdx = arr => idx.reduce((s, i) => s + (arr[i] || 0), 0);
  const linhas = Object.keys(A.divida_bancaria).map(banco => {
    const juros = somaIdx(A.divida_bancaria[banco].juros);
    const principal = somaIdx(A.divida_bancaria[banco].principal);
    return { banco, rotulo: ROTULOS_BANCO[banco] || banco, juros, principal, total: juros + principal };
  }).filter(x => x.total > 0).sort((a, b) => b.total - a.total);
  if (!linhas.length) return '';

  const totJuros = linhas.reduce((s, x) => s + x.juros, 0);
  const totPrincipal = linhas.reduce((s, x) => s + x.principal, 0);
  const totGeral = totJuros + totPrincipal;
  const agg = agregarCaixa(ano, mesesNums);
  const resultadoReal = agg ? (agg.porCaminho['RESULTADO DE CAIXA DO PERÍODO'] || 0) : 0;
  const resultadoSemDivida = resultadoReal + totGeral;
  const linhasHtml = linhas.map(x => `<tr><td>${esc(x.rotulo)}</td><td>${M(x.principal)}</td><td>${M(x.juros)}</td><td class="tt">${M(x.total)}</td></tr>`).join('');

  return `<div class="card"><h2><span class="ic-chip">${ic('ic-caixa')}</span>Dívida Bancária</h2>
    <div class="leg">Principal + Juros pagos a cada banco no período selecionado. Não inclui
      empréstimos de pessoa física e nem antecipação das vendas no cartão de crédito.</div>
    <div style="overflow-x:auto"><table>
